---
- name: Grafana (Docker) - Check if image exists locally
  ansible.builtin.shell:
    cmd: RUNTIME=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker); $RUNTIME image inspect {{ grafana_image }}:{{ grafana_tag }} >/dev/null 2>&1
  register: _gf_img_exists
  changed_when: false
  failed_when: false
  tags: ['grafana', 'docker', 'image']

- name: Grafana (Docker) - Pull image
  ansible.builtin.shell:
    cmd: RUNTIME=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker); $RUNTIME pull {{ grafana_image }}:{{ grafana_tag }}
  register: _gf_img_pull
  until: _gf_img_pull is succeeded
  retries: 5
  delay: 3
  when: _gf_img_exists.rc != 0
  changed_when: "'Pull complete' in _gf_img_pull.stdout or 'Downloaded' in _gf_img_pull.stdout"
  tags: ['grafana', 'docker', 'image']

- name: Grafana (Docker) - Check container running state and image
  ansible.builtin.shell:
    cmd: |
      RUNTIME=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker)
      CURRENT_IMG=$($RUNTIME inspect --format='{{ '{{' }}.Image{{ '}}' }}' {{ grafana_container_name }} 2>/dev/null || echo "")
      TARGET_IMG=$($RUNTIME image inspect --format='{{ '{{' }}.Id{{ '}}' }}' {{ grafana_image }}:{{ grafana_tag }} 2>/dev/null || echo "")
      if [ "$CURRENT_IMG" != "" ] && [ "$CURRENT_IMG" = "$TARGET_IMG" ]; then echo "MATCH"; else echo "MISMATCH"; fi
  register: _gf_container_match
  changed_when: false
  failed_when: false
  tags: ['grafana', 'docker', 'container']

- name: Grafana (Docker) - Remove container if image mismatch
  ansible.builtin.shell:
    cmd: RUNTIME=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker); $RUNTIME rm -f {{ grafana_container_name }} || true
  when: _gf_container_match.stdout == "MISMATCH"
  changed_when: _gf_container_match.stdout == "MISMATCH"
  tags: ['grafana', 'docker', 'container']

- name: Grafana (Docker) - Check if container is running
  ansible.builtin.shell:
    cmd: RUNTIME=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker); $RUNTIME ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -x {{ grafana_container_name }}
  register: _gf_container_running
  changed_when: false
  failed_when: false
  tags: ['grafana', 'docker', 'container']

- name: Grafana (Docker) - Start container
  ansible.builtin.shell:
    cmd: |
      RUNTIME=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker)
      $RUNTIME rm -f {{ grafana_container_name }} 2>/dev/null || true
      $RUNTIME run -d \
        --name={{ grafana_container_name }} \
        --restart=always \
        --network=host \
        --user={{ grafana_docker_user }} \
        -v {{ grafana_config_dir }}:{{ grafana_container_config_dir }}:ro \
        -v {{ grafana_data_dir }}:{{ grafana_container_data_dir }}:rw \
        -v {{ grafana_data_dir }}/log:{{ grafana_container_log_dir }}:rw \
        -e GF_SECURITY_ADMIN_USER="{{ _gf_safe_admin_user }}" \
        -e GF_SECURITY_ADMIN_PASSWORD="{{ _gf_safe_admin_password }}" \
        -e GF_USERS_ALLOW_SIGN_UP="false" \
        -e GF_SERVER_HTTP_PORT="{{ grafana_port }}" \
        -e GF_SERVER_DOMAIN="{{ _gf_safe_server_domain }}" \
        -e GF_SERVER_ROOT_URL="{{ _gf_safe_server_root_url }}" \
        -e GF_LOG_LEVEL="{{ grafana_log_level }}" \
        -e GF_SECURITY_SECRET_KEY="{{ _gf_safe_secret_key }}" \
        -e GF_PATHS_DATA="{{ grafana_container_data_dir }}" \
        -e GF_PATHS_LOGS="{{ grafana_container_log_dir }}" \
        -e GF_PATHS_PLUGINS="{{ grafana_container_plugins_dir }}" \
        -e GF_PATHS_PROVISIONING="{{ grafana_container_provisioning_dir }}" \
        -e GF_DATABASE_PATH="{{ grafana_container_sqlite_path }}" \
        --health-cmd="wget -qO- http://{{ _gf_safe_listen_address }}/api/health || exit 1" \
        --health-interval=30s \
        --health-timeout=10s \
        --health-retries=3 \
        --health-start-period=120s \
        {{ grafana_image }}:{{ grafana_tag }}
  when: _gf_container_running.rc != 0
  changed_when: true
  tags: ['grafana', 'docker', 'container']

- name: 'Grafana (Docker) — Wait container healthy state (health check /api/health green) SEBELUM reset password via cli'
  ansible.builtin.shell:
    cmd: |
      RUNTIME=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker)
      TRIES=0
      MAX=60
      while [ $TRIES -lt $MAX ]; do
        STATE=$($RUNTIME inspect --format='{{ '{{' }}.State.Health.Status{{ '}}' }}' {{ grafana_container_name }} 2>/dev/null || echo "")
        if [ "$STATE" = "healthy" ]; then
          echo "HEALTHY_TRIES=$TRIES"
          exit 0
        fi
        TRIES=$((TRIES + 1))
        sleep 2
      done
      echo "TIMEOUT_UNHEALTHY_AFTER_120s"
      exit 1
  register: _gf_wait_healthy
  changed_when: false
  retries: 2
  delay: 10
  until: _gf_wait_healthy is succeeded
  tags: ['grafana', 'docker', 'container', 'healthcheck', 'passwords']

- name: 'Grafana (Docker) — SET ADMIN PASSWORD INSIDE CONTAINER via grafana-cli (GRAFANA BEHAVIOR FIX: env var IGNORED for existing user in sqlite!)'
  ansible.builtin.shell:
    cmd: |
      RUNTIME=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker)
      TARGET_PW="{{ _gf_safe_admin_password_escaped }}"
      HTTP_CODE=$($RUNTIME exec {{ grafana_container_name }} bash -c 'curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:{{grafana_port}}/api/login -H "Content-Type: application/json" -d '\''{"user":"{{_gf_safe_admin_user}}","password":"'"${TARGET_PW}"'"}'\'')
      if [ "$HTTP_CODE" = "200" ]; then
        echo "PASSWORD_ALREADY_MATCHED_NO_CHANGE"
        exit 0
      fi
      $RUNTIME exec {{ grafana_container_name }} grafana-cli admin reset-admin-password "${TARGET_PW}" 2>&1 | tail -3
      sleep 2
      HTTP_CODE2=$($RUNTIME exec {{ grafana_container_name }} bash -c 'curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:{{grafana_port}}/api/login -H "Content-Type: application/json" -d '\''{"user":"{{_gf_safe_admin_user}}","password":"'"${TARGET_PW}"'"}'\'')
      if [ "$HTTP_CODE2" != "200" ]; then
        echo "ERROR_RESET_FAILED_VERIFY_HTTP=$HTTP_CODE2"
        exit 2
      fi
      echo "PASSWORD_UPDATED_VIA_GRAFANA_CLI_SUCCESS_HTTP_200_VERIFIED"
  register: _gf_cli_reset_pw
  changed_when: "'PASSWORD_UPDATED_VIA_GRAFANA_CLI_SUCCESS' in _gf_cli_reset_pw.stdout"
  failed_when: "'ERROR_RESET_FAILED_VERIFY' in _gf_cli_reset_pw.stdout or _gf_cli_reset_pw.rc not in [0, 2]"
  no_log: true
  vars:
    _gf_safe_admin_password_escaped: "{{ _gf_safe_admin_password | to_json | regex_replace('^\"', '') | regex_replace('\"$', '') }}"
  tags: ['grafana', 'docker', 'container', 'passwords', 'idempotent']
