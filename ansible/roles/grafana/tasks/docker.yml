# Pull / (re)create / verify: shared helper (DESIGN.md §1B).
- name: Grafana (Docker) - Run container
  ansible.builtin.include_role:
    name: agra_container
    apply:
      tags: ['grafana', 'docker', 'container']
  vars:
    agra_container_name: "{{ grafana_container_name }}"
    agra_container_image: "{{ grafana_image }}:{{ grafana_tag }}"
    agra_container_options:
      - --restart=always
      - --network=host
      - "--user={{ grafana_docker_user }}"
      - "--volume={{ grafana_config_dir }}:{{ grafana_container_config_dir }}:ro"
      - "--volume={{ grafana_data_dir }}:{{ grafana_container_data_dir }}:rw"
      - "--volume={{ grafana_data_dir }}/log:{{ grafana_container_log_dir }}:rw"
      - "--env=GF_SECURITY_ADMIN_USER={{ _gf_safe_admin_user }}"
      - --env=GF_USERS_ALLOW_SIGN_UP=false
      - "--env=GF_SERVER_HTTP_ADDR={{ _gf_safe_listen_address | regex_replace(':[0-9]+$', '') }}"
      - "--env=GF_SERVER_HTTP_PORT={{ grafana_port }}"
      - "--env=GF_SERVER_DOMAIN={{ _gf_safe_server_domain }}"
      - "--env=GF_SERVER_ROOT_URL={{ _gf_safe_server_root_url }}"
      - "--env=GF_LOG_LEVEL={{ grafana_log_level }}"
      - "--env=GF_PATHS_DATA={{ grafana_container_data_dir }}"
      - "--env=GF_PATHS_LOGS={{ grafana_container_log_dir }}"
      - "--env=GF_PATHS_PLUGINS={{ grafana_container_plugins_dir }}"
      - "--env=GF_PATHS_PROVISIONING={{ grafana_container_provisioning_dir }}"
      - "--env=GF_DATABASE_PATH={{ grafana_container_sqlite_path }}"
      - "--health-cmd=wget -qO- http://{{ _gf_safe_listen_address }}/api/health || exit 1"
      - --health-interval=30s
      - --health-timeout=10s
      - --health-retries=3
      - --health-start-period=120s
  tags: ['grafana', 'docker', 'container']

- name: 'Grafana (Docker) — Wait container healthy state (health check /api/health green) SEBELUM reset password via cli'
  ansible.builtin.shell:
    cmd: |
      TRIES=0
      MAX=60
      while [ $TRIES -lt $MAX ]; do
        STATE=$(docker inspect --format='{{ '{{' }}.State.Health.Status{{ '}}' }}' {{ grafana_container_name }} 2>/dev/null || echo "")
        if [ "$STATE" = "healthy" ]; then
          echo "HEALTHY_TRIES=$TRIES"
          exit 0
        fi
        TRIES=$((TRIES + 1))
        sleep 2
      done
      echo "TIMEOUT_UNHEALTHY_AFTER_120s"
      exit 1
  register: _gf_wait_healthy
  changed_when: false
  retries: 2
  delay: 10
  until: _gf_wait_healthy is succeeded
  tags: ['grafana', 'docker', 'container', 'healthcheck', 'passwords']

# Grafana hanya memakai admin_password (grafana.ini) saat user admin PERTAMA kali
# dibuat; untuk DB yang sudah ada, password disinkronkan via grafana-cli.
# Password tidak pernah masuk ke shell string atau argv: login dicek via uri,
# reset lewat stdin (--password-from-stdin) — argv `docker exec` terlihat oleh
# siapa pun di host lewat `ps`, stdin tidak. Aman untuk karakter apa pun.
- name: Grafana (Docker) - Cek login admin dengan password dari passwords.yml
  ansible.builtin.uri:
    # GET /api/user + basic auth (Grafana tidak punya route POST /api/login).
    url: "http://127.0.0.1:{{ grafana_port }}/api/user"
    url_username: "{{ _gf_safe_admin_user }}"
    url_password: "{{ _gf_safe_admin_password }}"
    force_basic_auth: true
    status_code: [200, 401]
  register: _gf_login
  no_log: true
  tags: ['grafana', 'docker', 'container', 'passwords']

- name: Grafana (Docker) - Reset admin password via grafana-cli (DB sudah ada dengan password lama)
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - --interactive
      - "{{ grafana_container_name }}"
      - grafana-cli
      - admin
      - reset-admin-password
      - --password-from-stdin
    stdin: "{{ _gf_safe_admin_password }}"
  when: _gf_login.status != 200
  changed_when: true
  no_log: true
  tags: ['grafana', 'docker', 'container', 'passwords']

- name: Grafana (Docker) - Verifikasi login admin setelah reset
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_port }}/api/user"
    url_username: "{{ _gf_safe_admin_user }}"
    url_password: "{{ _gf_safe_admin_password }}"
    force_basic_auth: true
    status_code: 200
  register: _gf_login_verify
  until: _gf_login_verify.status == 200
  retries: 5
  delay: 3
  when: _gf_login.status != 200
  no_log: true
  tags: ['grafana', 'docker', 'container', 'passwords']
