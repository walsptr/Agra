---
- name: restart grafana
  ansible.builtin.debug:
    msg: "Restart grafana triggered"
  changed_when: true
  notify:
    - restart grafana docker
    - restart grafana native

- name: restart grafana docker
  ansible.builtin.shell:
    cmd: RUNTIME=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker); $RUNTIME restart {{ grafana_container_name }} || true
  when:
    - agra_deployment_mode == 'docker'
    - enable_grafana | default(true) | bool
  changed_when: true
  ignore_errors: true

- name: restart grafana native
  ansible.builtin.service:
    name: agra-grafana
    state: restarted
    daemon_reload: true
  when:
    - agra_deployment_mode == 'native'
    - enable_grafana | default(true) | bool
  ignore_errors: true
