---
- name: Common (Native) - Ensure systemd is available
  ansible.builtin.assert:
    that:
      - ansible_facts['service_mgr'] == 'systemd'
    fail_msg: "Mode native memerlukan systemd sebagai service manager. Ditemukan: {{ ansible_facts['service_mgr'] | default('unknown') }}. Kenapa: role native menggunakan systemd unit untuk mengelola service monitoring. Perbaikan: gunakan OS dengan systemd (Ubuntu 16.04+, Debian 9+, RHEL/CentOS 7+) atau beralih ke agra_deployment_mode: docker."
    quiet: true
  tags: ['common', 'native']

- name: Common (Native) - Package manager ready (cache sudah di-update di config.yml)
  ansible.builtin.debug:
    msg: "Native mode siap: systemd={{ ansible_facts['service_mgr'] }}, OS={{ ansible_facts['os_family'] }}. Instalasi service per-package akan dilakukan di role service masing-masing."
  changed_when: false
  tags: ['common', 'native']
