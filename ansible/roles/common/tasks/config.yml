---
- name: Common - OS package cache update (Debian)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'
  changed_when: false
  tags: ['common', 'packages']

- name: Common - OS package cache update (RedHat)
  ansible.builtin.dnf:
    update_cache: true
  when: ansible_facts['os_family'] == 'RedHat'
  changed_when: false
  tags: ['common', 'packages']

- name: Common - Ensure base persist directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '2775'
  loop:
    - "{{ common_home_dir }}"
    - "{{ common_etc_dir }}"
  tags: ['common', 'dirs']

- name: Common - Ensure user SSH directory exists for HA sync
  ansible.builtin.file:
    path: "{{ common_home_dir }}/.ssh"
    state: directory
    owner: root
    group: root
    mode: '0700'
  tags: ['common', 'ssh']

- name: Common - Install OS common packages
  ansible.builtin.package:
    name: "{{ common_os_packages }}"
    state: present
  tags: ['common', 'packages']

- name: Common - Detect firewall tool (via POSIX commands, TIDAK USAH fact ansible_facts.services)
  ansible.builtin.shell:
    cmd: |
      set -e
      # User explicit override via common_firewall_tool var
      if [ "{{ common_firewall_tool }}" != "auto" ]; then
        printf '%s' "{{ common_firewall_tool }}"
        exit 0
      fi
      # Priority 1: UFW (Debian/Ubuntu default)
      if command -v ufw >/dev/null 2>&1; then
        if ufw status 2>/dev/null | grep -qE "^Status: active$" ; then
          printf '%s' "ufw"
          exit 0
        fi
      fi
      # Priority 2: firewalld (RHEL/CentOS/Fedora default)
      if command -v firewall-cmd >/dev/null 2>&1; then
        if firewall-cmd --state 2>/dev/null | grep -qE "^running$" ; then
          printf '%s' "firewalld"
          exit 0
        fi
      fi
      # Tidak ada firewall yang terdeteksi / aktif -> skip
      printf '%s' "none"
  args:
    executable: /bin/bash
  register: _firewall_detect_raw
  changed_when: false
  failed_when: _firewall_detect_raw.rc != 0
  tags: ['common', 'firewall']

- name: Common - Parse firewall detection ke fact _common_firewall_detected
  ansible.builtin.set_fact:
    _common_firewall_detected: "{{ _firewall_detect_raw.stdout | trim | lower }}"
  changed_when: false
  tags: ['common', 'firewall']

- name: Common - Collect ports to open based on feature flags
  ansible.builtin.set_fact:
    _common_ports_tcp: >-
      {{
        (['22'] if True else []) +
        (['80', '443'] if enable_nginx | default(true) else []) +
        (['9090'] if (enable_prometheus | default(true) and not (enable_nginx | default(true))) else []) +
        (['3000'] if (enable_grafana | default(true) and not (enable_nginx | default(true))) else [])
      }}
  changed_when: false
  tags: ['common', 'firewall']

- name: Common - Open firewall ports (ufw) — Idempotent check rule exists before add
  ansible.builtin.shell:
    cmd: |
      set -e
      PORT="{{ item | string }}"
      # Idempotency: Cek apakah rule untuk port ini SUDAH ADA.
      # Check dengan: (1) grep ufw status numbered by port AND protocol tcp, (2) grep by rule comment agra.
      if ufw status numbered 2>/dev/null | grep -qE "^\[.*\]\s+${PORT}/tcp\s+ALLOW\s+IN" ; then
        echo "EXISTS: port ${PORT}/tcp sudah ada di ufw (berdasarkan ufw status numbered allow)"
        exit 0
      fi
      if ufw status 2>/dev/null | grep -qE "^${PORT}/tcp\s+ALLOW\s+Anywhere" ; then
        echo "EXISTS: port ${PORT}/tcp (allow anywhere)"
        exit 0
      fi
      # Rule TIDAK ADA: jalankan ufw allow
      ufw allow proto tcp from any to any port "${PORT}" comment "agra monitoring port ${PORT}" >/dev/null 2>&1
      echo "CHANGED: added ufw allow ${PORT}/tcp agra monitoring"
      exit 2  # 2 = CHANGED
  args:
    executable: /bin/bash
  loop: "{{ _common_ports_tcp | unique }}"
  register: _ufw_add_result
  changed_when:
    - _ufw_add_result.rc is defined
    - _ufw_add_result.rc == 2  # hanya exit 2 = benar-benar nambah rule
  failed_when:
    - _ufw_add_result.rc is defined
    - _ufw_add_result.rc not in [0, 2]  # rc 0=exists, 2=added -> keduanya sukses
  when:
    - _common_firewall_detected == 'ufw'
    - common_firewall_tool != 'none'
  tags: ['common', 'firewall']

- name: Common - Open firewall ports (firewalld) — Idempotent check rule exists
  ansible.builtin.shell:
    cmd: |
      set -e
      PORT="{{ item | string }}"
      FW_PORT="${PORT}/tcp"
      # Idempotency: Cek apakah sudah ada di default zone (active runtime + permanent)
      RUNTIME_EXIST=0
      PERMANENT_EXIST=0
      if command -v firewall-cmd >/dev/null 2>&1; then
        firewall-cmd --zone=public --query-port="${FW_PORT}" >/dev/null 2>&1 && RUNTIME_EXIST=1
        firewall-cmd --permanent --zone=public --query-port="${FW_PORT}" >/dev/null 2>&1 && PERMANENT_EXIST=1
      fi
      if [ "${RUNTIME_EXIST}" -eq 1 ] && [ "${PERMANENT_EXIST}" -eq 1 ]; then
        echo "EXISTS: firewalld port ${FW_PORT} sudah ada di RUNTIME & PERMANENT"
        exit 0
      fi
      # Belum lengkap -> tambahkan (permanent DULU agar persist reboot, lalu runtime dengan --add-port + reload)
      if [ "${PERMANENT_EXIST}" -ne 1 ]; then
        firewall-cmd --permanent --zone=public --add-port="${FW_PORT}" >/dev/null 2>&1
      fi
      if [ "${RUNTIME_EXIST}" -ne 1 ]; then
        firewall-cmd --zone=public --add-port="${FW_PORT}" >/dev/null 2>&1
      fi
      echo "CHANGED: firewalld added port ${FW_PORT}"
      exit 2
  args:
    executable: /bin/bash
  loop: "{{ _common_ports_tcp | unique }}"
  register: _firewalld_add_result
  changed_when:
    - _firewalld_add_result.rc is defined
    - _firewalld_add_result.rc == 2
  failed_when:
    - _firewalld_add_result.rc is defined
    - _firewalld_add_result.rc not in [0, 2]
  when:
    - _common_firewall_detected == 'firewalld'
    - common_firewall_tool != 'none'
  tags: ['common', 'firewall']
