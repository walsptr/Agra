---
# Docker is installed by `agra check` (precheck bootstrap: docker.io on Debian,
# docker-ce from download.docker.com on RHEL — ARCHITECTURE.md §3). Deploy does
# not install a runtime; it requires the Docker engine, running.
- name: Common (Docker) - Locate the docker CLI
  ansible.builtin.command:
    argv: [sh, -c, 'command -v docker']
  register: _common_docker_bin
  changed_when: false
  failed_when: false
  tags: ['common', 'docker']

- name: Common (Docker) - Docker must be installed (by agra check)
  ansible.builtin.assert:
    that: _common_docker_bin.rc == 0
    fail_msg: >-
      docker tidak ada di {{ inventory_hostname }}. Jalankan `agra check -i <inventory>`
      dulu — precheck memasang Docker di setiap node.
    quiet: true
  tags: ['common', 'docker']

# podman-docker has no docker.service: a podman-only host fails here, loudly.
- name: Common (Docker) - Start and enable docker service
  ansible.builtin.service:
    name: "{{ common_docker_service_name }}"
    state: started
    enabled: true
  tags: ['common', 'docker', 'service']

# agra before PR 10 created a bridge network `agra_network` on every host that
# no container ever joined (all agra containers use --network=host). Remove
# it while it is still empty; a network something has joined since is not
# agra's to remove.
- name: Common (Docker) - Inspect leftover agra_network (agra < PR 10)
  ansible.builtin.command:
    argv: [docker, network, inspect, --format, "{{ '{{' }} len .Containers {{ '}}' }}", agra_network]
  register: _common_legacy_net
  changed_when: false
  failed_when:
    - _common_legacy_net.rc != 0
    - _common_legacy_net.stderr | lower is not search('no such network|not found')
  tags: ['common', 'docker', 'network']

- name: Common (Docker) - Remove empty leftover agra_network
  ansible.builtin.command:
    argv: [docker, network, rm, agra_network]
  changed_when: true
  when:
    - _common_legacy_net.rc == 0
    - _common_legacy_net.stdout | trim == '0'
  tags: ['common', 'docker', 'network']

- name: Common (Docker) - WARNING leftover agra_network is in use
  ansible.builtin.debug:
    msg: >-
      WARNING: Docker network agra_network (dibuat agra lama, tidak dipakai agra lagi)
      masih dipakai {{ _common_legacy_net.stdout | trim }} container di {{ inventory_hostname }},
      jadi tidak dihapus. Jika container itu bukan milik anda lagi: docker network disconnect
      agra_network <container>, lalu docker network rm agra_network.
  when:
    - _common_legacy_net.rc == 0
    - _common_legacy_net.stdout | trim != '0'
  tags: ['common', 'docker', 'network']
