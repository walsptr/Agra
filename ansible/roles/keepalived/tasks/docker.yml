---
- name: Keepalived (Docker) - WARNING keepalived docker BUTUH cap_add NET_ADMIN + host network
  ansible.builtin.debug:
    msg: >-
      PERINGATAN: Keepalived mode docker MEMBUTUHKAN kernel module ip_vs loaded, cap_add NET_ADMIN,
      dan host network mode. Pastikan module ip_vs sudah di-load di host OS.
  tags: ['keepalived', 'docker']

- name: Keepalived (Docker) - Check if image exists locally
  ansible.builtin.shell:
    cmd: RUNTIME=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker); $RUNTIME image inspect {{ keepalived_image }}:{{ keepalived_tag }} >/dev/null 2>&1
  register: _ka_img_exists
  changed_when: false
  failed_when: false
  tags: ['keepalived', 'docker', 'image']

- name: Keepalived (Docker) - Pull image
  ansible.builtin.shell:
    cmd: RUNTIME=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker); $RUNTIME pull {{ keepalived_image }}:{{ keepalived_tag }}
  register: _ka_img_pull
  until: _ka_img_pull is succeeded
  retries: 5
  delay: 3
  when: _ka_img_exists.rc != 0
  changed_when: "'Pull complete' in _ka_img_pull.stdout or 'Downloaded' in _ka_img_pull.stdout"
  tags: ['keepalived', 'docker', 'image']

- name: Keepalived (Docker) - Check container running state and image
  ansible.builtin.shell:
    cmd: |
      RUNTIME=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker)
      CURRENT_IMG=$($RUNTIME inspect --format='{{ '{{' }}.Image{{ '}}' }}' {{ keepalived_container_name }} 2>/dev/null || echo "")
      TARGET_IMG=$($RUNTIME image inspect --format='{{ '{{' }}.Id{{ '}}' }}' {{ keepalived_image }}:{{ keepalived_tag }} 2>/dev/null || echo "")
      if [ "$CURRENT_IMG" != "" ] && [ "$CURRENT_IMG" = "$TARGET_IMG" ]; then echo "MATCH"; else echo "MISMATCH"; fi
  register: _ka_container_match
  changed_when: false
  failed_when: false
  tags: ['keepalived', 'docker', 'container']

- name: Keepalived (Docker) - Remove container if image mismatch
  ansible.builtin.shell:
    cmd: RUNTIME=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker); $RUNTIME rm -f {{ keepalived_container_name }} || true
  when: _ka_container_match.stdout == "MISMATCH"
  changed_when: _ka_container_match.stdout == "MISMATCH"
  tags: ['keepalived', 'docker', 'container']

- name: Keepalived (Docker) - Check if container is running
  ansible.builtin.shell:
    cmd: RUNTIME=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker); $RUNTIME ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -x {{ keepalived_container_name }}
  register: _ka_container_running
  changed_when: false
  failed_when: false
  tags: ['keepalived', 'docker', 'container']

- name: Keepalived (Docker) - Validate keepalived.conf via container keepalived -t
  ansible.builtin.shell:
    cmd: |
      RUNTIME=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker)
      $RUNTIME run --rm \
        -v {{ keepalived_config_dir }}:{{ keepalived_config_dir }}:ro \
        --entrypoint=/bin/sh \
        {{ keepalived_image }}:{{ keepalived_tag }} \
        -c "keepalived -t -f {{ keepalived_config_dir }}/keepalived.conf 2>&1 || true"
  changed_when: false
  tags: ['keepalived', 'docker', 'validate']

- name: Keepalived (Docker) - Start container (host network + cap NET_ADMIN)
  ansible.builtin.shell:
    cmd: |
      RUNTIME=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker)
      $RUNTIME run -d \
        --name={{ keepalived_container_name }} \
        --restart=always \
        --network=host \
        --cap-add=NET_ADMIN \
        --cap-add=NET_BROADCAST \
        --cap-add=NET_RAW \
        --cap-add=SYS_NICE \
        --privileged=true \
        -v {{ keepalived_config_dir }}/keepalived.conf:/usr/local/etc/keepalived/keepalived.conf:ro \
        -v /usr/local/bin/agra_monitoring_healthcheck.sh:/usr/local/bin/agra_monitoring_healthcheck.sh:ro \
        -v /usr/local/bin/agra_keepalived_notify.sh:/usr/local/bin/agra_keepalived_notify.sh:ro \
        -v {{ keepalived_log_file }}:{{ keepalived_log_file }} \
        -e KEEPALIVED_AUTOCONF="false" \
        -e KEEPALIVED_CONF="/usr/local/etc/keepalived/keepalived.conf" \
        {{ keepalived_image }}:{{ keepalived_tag }}
  when: _ka_container_running.rc != 0
  changed_when: true
  tags: ['keepalived', 'docker', 'container']
