---
- name: Keepalived (Native) - Install keepalived package (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - "{{ keepalived_native_package_name }}"
      - curl
      - iproute2
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'
  tags: ['keepalived', 'native', 'install']

- name: Keepalived (Native) - Install keepalived package (RHEL/CentOS)
  ansible.builtin.dnf:
    name:
      - "{{ keepalived_native_package_name }}"
      - curl
      - iproute
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
  tags: ['keepalived', 'native', 'install']

- name: Keepalived (Native) - Validate keepalived.conf via keepalived -t
  ansible.builtin.shell:
    cmd: keepalived -t -f {{ keepalived_config_dir }}/keepalived.conf 2>&1 || true
  changed_when: false
  tags: ['keepalived', 'native', 'validate']

- name: Keepalived (Native) - Enable and start keepalived service
  ansible.builtin.service:
    name: "{{ keepalived_service_name }}"
    state: started
    enabled: true
  register: _ka_start
  ignore_errors: true
  tags: ['keepalived', 'native', 'service']

- name: Keepalived (Native) - Sysctl net.ipv4.ip_nonlocal_bind=1 (bare shell sysctl -w + sysctl.d file)
  ansible.builtin.shell:
    cmd: |
      set -e
      KEY="net.ipv4.ip_nonlocal_bind"
      VAL="1"
      CONF_FILE="/etc/sysctl.d/99-agra-keepalived.conf"
      RUNTIME_VAL=$(sysctl -n "$KEY" 2>/dev/null || echo "0")
      FILE_EXACT=0
      if [ -f "$CONF_FILE" ]; then
        grep -qxF "${KEY}=${VAL}" "$CONF_FILE" && FILE_EXACT=1 || true
      fi
      if [ "${RUNTIME_VAL}" = "${VAL}" ] && [ "${FILE_EXACT}" -eq 1 ]; then
        echo "EXISTS: runtime sysctl ${KEY}=${VAL} & file conf match"
        exit 0
      fi
      mkdir -p /etc/sysctl.d
      echo "${KEY}=${VAL}" > "$CONF_FILE"
      sysctl -w "${KEY}=${VAL}" >/dev/null 2>&1
      sysctl -p "$CONF_FILE" >/dev/null 2>&1
      echo "CHANGED: sysctl ${KEY}=${VAL} applied"
      exit 2
  args:
    executable: /bin/bash
  register: _sysctl_result
  changed_when: _sysctl_result.rc is defined and _sysctl_result.rc == 2
  failed_when: _sysctl_result.rc is defined and _sysctl_result.rc not in [0, 2]
  ignore_errors: true
  tags: ['keepalived', 'native', 'sysctl']
