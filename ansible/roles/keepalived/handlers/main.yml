---
- name: reload keepalived
  ansible.builtin.debug:
    msg: "Reload keepalived triggered"
  changed_when: true
  notify:
    - reload keepalived native
    - reload keepalived docker

- name: restart keepalived
  ansible.builtin.debug:
    msg: "Restart keepalived triggered"
  changed_when: true
  notify:
    - restart keepalived native
    - restart keepalived docker

- name: reload keepalived native
  ansible.builtin.service:
    name: "{{ keepalived_service_name }}"
    state: reloaded
  when:
    - agra_deployment_mode == 'native'
    - enable_keepalived | default(false) | bool
  ignore_errors: true

- name: restart keepalived native
  ansible.builtin.service:
    name: "{{ keepalived_service_name }}"
    state: restarted
    daemon_reload: true
  when:
    - agra_deployment_mode == 'native'
    - enable_keepalived | default(false) | bool
  ignore_errors: true

- name: reload keepalived docker
  ansible.builtin.shell:
    cmd: RUNTIME=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker); $RUNTIME exec {{ keepalived_container_name }} kill -HUP 1 || true
  when:
    - agra_deployment_mode == 'docker'
    - enable_keepalived | default(false) | bool
  changed_when: true
  ignore_errors: true

- name: restart keepalived docker
  ansible.builtin.shell:
    cmd: RUNTIME=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker); $RUNTIME restart {{ keepalived_container_name }} || true
  when:
    - agra_deployment_mode == 'docker'
    - enable_keepalived | default(false) | bool
  changed_when: true
  ignore_errors: true
