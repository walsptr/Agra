---
# Container yang belum ada (mis. `deploy --tags config` di host baru) bukan
# error — akan dibuat dengan config baru saat deploy penuh. Error lain
# (daemon mati, config invalid) WAJIB gagal, bukan `|| true`.
- name: restart node_exporter
  ansible.builtin.debug:
    msg: "Restart handler triggered"
  changed_when: true
  notify:
    - restart node_exporter docker

- name: restart node_exporter docker
  ansible.builtin.command:
    cmd: docker restart {{ node_exporter_container_name }}
  register: _h_result
  changed_when: _h_result.rc == 0
  failed_when: _h_result.rc != 0 and 'no such container' not in (_h_result.stderr | lower)
  when:
    - enable_node_exporter | default(true) | bool
