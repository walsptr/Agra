---
- name: Node Exporter - Skip if disabled
  ansible.builtin.meta: end_host
  when: not (enable_node_exporter | default(true) | bool)

- name: Node Exporter - Include shared config tasks
  ansible.builtin.include_tasks: config.yml

- name: Node Exporter - Include docker deployment tasks (Docker-only mode)
  ansible.builtin.include_tasks: docker.yml
