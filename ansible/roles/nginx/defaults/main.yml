---
enable_nginx: true
enable_https: true
expose_prometheus_via_nginx: false

nginx_container_name: agra-nginx
nginx_image: nginx
nginx_tag: "1.27-alpine"

nginx_config_dir: /etc/nginx
nginx_sites_available_dir: "{{ nginx_config_dir }}/sites-available"
nginx_sites_enabled_dir: "{{ nginx_config_dir }}/sites-enabled"
nginx_confd_dir: "{{ nginx_config_dir }}/conf.d"
nginx_log_dir: /var/log/nginx
nginx_cache_dir: /var/cache/nginx
nginx_pid_path: /var/run/nginx.pid

# ── Nginx worker process ownership (runtime writable dirs: log & cache) ──
# User untuk directive `user X;` di nginx.conf.j2 (user default image nginx alpine).
nginx_container_user: "nginx"

# UID/GID numerik pemilik dir runtime (log, cache): user nginx di image
# nginx:1.27-alpine = 101/101 (`docker run --rm nginx:1.27-alpine id nginx`).
# Override di globals.yml hanya untuk image custom dengan UID berbeda.
nginx_uid: 101
nginx_gid: 101

# Default mode UNTUK RUNTIME WRITABLE dirs (log/cache). 0755 = rwxr-xr-x (user write, group+other read-only). Bisa override 0750 jika paranoid.
nginx_dir_mode: "0755"

nginx_worker_processes: auto
nginx_worker_connections: 1024
nginx_keepalive_timeout: 65
nginx_client_max_body_size: 25m

tls_self_signed_days_valid: 3650
tls_self_signed_country: ID
tls_self_signed_state: Jakarta
tls_self_signed_locality: Jakarta
tls_self_signed_organization: agra-monitoring
tls_self_signed_organizational_unit: it

# Path SUMBER di CONTROL NODE (bukan path di managed host). Role meng-copy ke
# {{ nginx_config_dir }}/ssl/{agra.crt,agra.key,agra-ca.crt,dhparam.pem}.
# CA chain & dhparam opsional: di-copy hanya jika file ada.
tls_cert_path: /etc/agra/ssl/agra.crt
tls_key_path: /etc/agra/ssl/agra.key
tls_ca_path: /etc/agra/ssl/agra-ca.crt
tls_dhparam_path: /etc/agra/ssl/dhparam.pem
# ── Dedicated SSL paths PER SERVICE (scalable multi-domain certs) ──
# Path SUMBER di control node. "" = pakai cert global (tls_cert_path / tls_key_path).
tls_grafana_cert_path: ""
tls_grafana_key_path: ""
tls_prometheus_cert_path: ""
tls_prometheus_key_path: ""
tls_protocols: "TLSv1.2 TLSv1.3"
tls_ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
tls_prefer_server_ciphers: "on"
tls_session_timeout: "1d"
tls_session_cache: "shared:SSL:10m"
tls_session_tickets: "off"
tls_hsts_max_age: "31536000"
tls_hsts_include_subdomains: true
tls_hsts_preload: false

grafana_backend_url: "http://127.0.0.1:{{ grafana_port | default(3000) }}"
prometheus_backend_url: "http://127.0.0.1:{{ prometheus_port | default(9090) }}"
grafana_domain: ""
prometheus_domain: ""
# Grafana (default_server) and prometheus_domain listen here, with or without
# a domain. HTTP only redirects to HTTPS when enable_https.
nginx_http_port: 80
nginx_https_port: 443
# Loopback-only liveness endpoint (conf.d/agra-healthz.conf) for the keepalived health check.
nginx_health_port: 18080
