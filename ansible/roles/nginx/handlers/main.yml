---
- name: nginx syntax check
  ansible.builtin.command:
    cmd: >-
      {% if agra_deployment_mode == 'native' %}nginx -t{% else %}echo "docker nginx skip syntax check"{% endif %}
  register: _syntax_check
  changed_when: false
  failed_when: _syntax_check.rc is defined and _syntax_check.rc > 0 and 'skip' not in _syntax_check.stdout
  ignore_errors: false
  listen: "nginx syntax check"

- name: reload nginx
  ansible.builtin.debug:
    msg: "Reload nginx triggered"
  changed_when: true
  notify:
    - reload nginx native
    - reload nginx docker

- name: reload nginx native
  ansible.builtin.service:
    name: nginx
    state: reloaded
  when:
    - agra_deployment_mode == 'native'
    - enable_nginx | default(true) | bool
  ignore_errors: true

- name: reload nginx docker
  community.docker.docker_container_exec:
    container: "{{ nginx_container_name }}"
    command: "nginx -s reload"
  when:
    - agra_deployment_mode == 'docker'
    - enable_nginx | default(true) | bool
  ignore_errors: true
