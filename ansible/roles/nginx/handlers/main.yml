---
# Container yang belum ada (mis. `deploy --tags config` di host baru) bukan
# error — akan dibuat dengan config baru saat deploy penuh. Error lain
# (daemon mati, config invalid) WAJIB gagal, bukan `|| true`.
# Urutan handler = urutan di file ini: syntax check SEBELUM reload/restart,
# sehingga config invalid menghentikan play sebelum nginx di-reload.
# `nginx -t` jalan di container sementara dengan mount yang sama
# (vars/main.yml), bukan di container yang berjalan: container itu masih
# membaca nginx.conf lama (mount satu file), jadi tidak bisa menguji yang baru.
# Image belum ada di host (mis. `deploy --tags config` di host baru): belum
# ada yang bisa diuji, container dibuat — dan diverifikasi — saat deploy penuh.
- name: nginx syntax check image
  listen: "nginx syntax check"
  ansible.builtin.command:
    argv: [docker, image, inspect, --format, "{{ '{{' }}.Id{{ '}}' }}", "{{ nginx_image }}:{{ nginx_tag }}"]
  register: _nginx_h_image
  changed_when: false
  failed_when: false
  when:
    - enable_nginx | default(true) | bool

- name: nginx syntax check
  listen: "nginx syntax check"
  ansible.builtin.command:
    argv: >-
      {{ ['docker', 'run', '--rm', '--network=host', '--entrypoint=nginx']
         + _nginx_volumes | map('regex_replace', '^', '--volume=') | list
         + [nginx_image ~ ':' ~ nginx_tag, '-t'] }}
  changed_when: false
  when:
    - enable_nginx | default(true) | bool
    - _nginx_h_image.rc | default(1) == 0

- name: restart nginx
  ansible.builtin.debug:
    msg: "Restart nginx triggered"
  changed_when: true
  notify:
    - restart nginx docker

- name: reload nginx
  ansible.builtin.debug:
    msg: "Reload nginx triggered"
  changed_when: true
  notify:
    - reload nginx docker

- name: restart nginx docker
  ansible.builtin.command:
    cmd: docker restart {{ nginx_container_name }}
  register: _h_result
  changed_when: _h_result.rc == 0
  failed_when: _h_result.rc != 0 and 'no such container' not in (_h_result.stderr | lower)
  when:
    - enable_nginx | default(true) | bool

- name: reload nginx docker
  ansible.builtin.command:
    cmd: docker exec {{ nginx_container_name }} nginx -s reload
  register: _h_result
  changed_when: _h_result.rc == 0
  failed_when: _h_result.rc != 0 and 'no such container' not in (_h_result.stderr | lower)
  when:
    - enable_nginx | default(true) | bool
