---
# Pull / (re)create / verify: shared helper (DESIGN.md §1B).
- name: Nginx (Docker) - Run container (host network for 80/443)
  ansible.builtin.include_role:
    name: agra_container
    apply:
      tags: ['nginx', 'docker', 'container']
  vars:
    agra_container_name: "{{ nginx_container_name }}"
    agra_container_image: "{{ nginx_image }}:{{ nginx_tag }}"
    agra_container_options:
      - --restart=always
      - --network=host
      - "--volume={{ nginx_config_dir }}/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "--volume={{ nginx_config_dir }}/sites-available:/etc/nginx/sites-available:ro"
      - "--volume={{ nginx_config_dir }}/sites-enabled:/etc/nginx/sites-enabled:ro"
      - "--volume={{ nginx_config_dir }}/conf.d:/etc/nginx/conf.d:ro"
      - "--volume={{ nginx_config_dir }}/ssl:/etc/nginx/ssl:ro"
      - "--volume={{ nginx_log_dir }}:/var/log/nginx:rw"
      - "--volume={{ nginx_cache_dir }}:/var/cache/nginx:rw"
      - "--health-cmd=curl -fsS --max-time 3 http://127.0.0.1:{{ nginx_health_port }}/healthz -o /dev/null || exit 1"
      - --health-interval=30s
      - --health-timeout=7s
      - --health-retries=3
      - --health-start-period=45s
  tags: ['nginx', 'docker', 'container']
