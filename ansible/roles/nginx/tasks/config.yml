---
- name: 'Nginx (Config) - PRECHECK FAIL-FAST - Compute SSL clean paths + fallback empty (anti ssl_certificate empty string emerg)'
  ansible.builtin.set_fact:
    _nginx_fb_cert: "{{ nginx_config_dir }}/ssl/agra.crt"
    _nginx_fb_key: "{{ nginx_config_dir }}/ssl/agra.key"
    _nginx_fb_dh: "{{ nginx_config_dir }}/ssl/dhparam.pem"
    _nginx_clean_cert: "{{ (((tls_cert_path | default('')).split() | join('')) or (nginx_config_dir ~ '/ssl/agra.crt')).split() | join('') }}"
    _nginx_clean_key: "{{ (((tls_key_path | default('')).split() | join('')) or (nginx_config_dir ~ '/ssl/agra.key')).split() | join('') }}"
    _nginx_clean_dh: "{{ (((tls_dhparam_path | default('')).split() | join('')) or (nginx_config_dir ~ '/ssl/dhparam.pem')).split() | join('') }}"
  tags: ['nginx', 'config', 'precheck', 'ssl']

- name: 'Nginx (Config) - PRECHECK FAIL-FAST - Stat SSL cert + key files exist check di host (fallback aware)'
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
    get_md5: false
  loop:
    - "{{ _nginx_clean_cert }}"
    - "{{ _nginx_clean_key }}"
  register: _nginx_ssl_files_stat
  tags: ['nginx', 'config', 'precheck', 'ssl']

- name: 'Nginx (Config) - PRECHECK FAIL-FAST enable_https=true - SSL cert+key NOT EMPTY files exists OR self-signed generate will run'
  ansible.builtin.assert:
    that:
      - "not (enable_https | default(true) | bool) or _nginx_clean_cert | length > 0"
      - "not (enable_https | default(true) | bool) or _nginx_clean_key | length > 0"
      - "not (enable_https | default(true) | bool) or (tls_self_signed_generate | default(true) | bool) or ((_nginx_ssl_files_stat.results | map(attribute='stat.exists') | list) | select('equalto', true) | list | length == 2)"
    fail_msg: |
      ┌──────────────────────────────────────────────────────────────────────────────┐
      │ NGINX PRECHECK SSL GAGAL!                                                    │
      │ Kemungkinan penyebab dan solusi:                                             │
      │                                                                              │
      │ (1) tls_cert_path / tls_key_path di override di globals.yml TANPA VALUE     │
      │     (contoh broken pattern YAML: `tls_cert_path:` no isi = empty string).    │
      │     → ssl_certificate dirender dengan value "" = nginx EMERGENCY invalid args│
      │                                                                              │
      │ SOLUSI 1 - RECOMMENDED pakai auto self-signed default (tanpa setup manual):  │
      │   DELETE atau COMMENT OUT SEMUA baris tls_cert_path: / tls_key_path: /      │
      │   tls_dhparam_path: di file etc/agra/globals.yml.                            │
      │   Fallback otomatis pakai path /etc/nginx/ssl/agra.crt + agra.key, dan       │
      │   task self-signed generate OTOMATIS membuatkan file cert/key+dhparam.       │
      │                                                                              │
      │ SOLUSI 2 - Override dengan custom cert SSL asli milikmu:                     │
      │   Isi VALUE BENAR dan LENGKAP di etc/agra/globals.yml, TANPA leading         │
      │   whitespace / newline (tidak usah pakai >- folded scalar!):                 │
      │     tls_cert_path: /etc/nginx/ssl/yourdomain.crt                             │
      │     tls_key_path:  /etc/nginx/ssl/yourdomain.key                             │
      │   PASTIKAN file CRT+KEY benar-benar SUDAH ADA di SEMUA node target inventory│
      │   group monitoring (copy manual atau upload ke /etc/agra/config/nginx/ssl/). │
      │                                                                              │
      │ SOLUSI 3 - Temporary disable HTTPS untuk local testing saja:                 │
      │   Set enable_https: false di globals.yml, deploy akan cuma expose port 80.  │
      └──────────────────────────────────────────────────────────────────────────────┘
    success_msg: "Nginx SSL paths OK (fallback aware) - cert={{ _nginx_clean_cert }}, key={{ _nginx_clean_key }}, dhparam={{ _nginx_clean_dh }}"
  ignore_errors: false
  tags: ['nginx', 'config', 'precheck', 'ssl', 'assert']

- name: Nginx (Config) - Ensure CONFIG/READONLY dirs exist (root-owned, site+ssl config)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "{{ '0750' if 'ssl' in item else '0755' }}"
  loop:
    - "{{ nginx_config_dir }}"
    - "{{ nginx_sites_available_dir }}"
    - "{{ nginx_sites_enabled_dir }}"
    - "{{ nginx_confd_dir }}"
    - "{{ nginx_config_dir }}/ssl"
  tags: ['nginx', 'config', 'dirs', 'configdirs']

- name: Nginx (Config) - Ensure RUNTIME WRITABLE dirs exist (log cache, nginx worker UID inside container butuh nulis disini)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ nginx_uid }}"
    group: "{{ nginx_gid }}"
    mode: "{{ nginx_dir_mode }}"
  loop:
    - "{{ nginx_log_dir }}"
    - "{{ nginx_cache_dir }}"
  tags: ['nginx', 'config', 'dirs', 'writabledirs', 'runtime']

- name: Nginx (Config) - FORCESYNC parent common dirs ownership root:root 2775 (SHA e6360b0 grafana pattern, meskipun --tags nginx skip common)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '2775'
  loop:
    - "{{ common_etc_dir | default('/etc/agra') }}"
    - "{{ common_home_dir | default('/var/lib/agra') }}"
  ignore_errors: true
  tags: ['nginx', 'config', 'dirs', 'autocorrect', 'sha:e6360b0']

- name: Nginx (SSL) - Build self-signed cert+key (fallback-aware path)
  block:
    - name: Nginx (SSL) - Set subject_alt_name list
      ansible.builtin.set_fact:
        _nginx_san_list: >-
          {{
            ['DNS:' + tls_self_signed_cn,
              'DNS:localhost',
              'IP:127.0.0.1']
            + (['IP:' + monitoring_vip] if (monitoring_vip is defined and monitoring_vip | length > 0 else [])
          }}

    - name: Nginx (SSL) - Generate 2048-bit RSA private key (bare shell openssl genrsa, creates guard)
      ansible.builtin.shell:
        cmd: |
          openssl genrsa -out "{{ _nginx_clean_key }}" 2048 2>/dev/null
          chmod 0600 "{{ _nginx_clean_key }}"
          echo "CHANGED: RSA 2048 private key generated"
      args:
        creates: "{{ _nginx_clean_key }}"
        executable: /bin/bash
      register: _ssl_key
      changed_when: _ssl_key.rc is defined

    - name: Nginx (SSL) - Generate self-signed certificate (bare shell openssl req x509, creates guard)
      ansible.builtin.shell:
        cmd: |
          set -e
          KEY_PATH="{{ _nginx_clean_key }}"
          CRT_PATH="{{ _nginx_clean_cert }}"
          DAYS="{{ tls_self_signed_days_valid }}"
          CN="{{ tls_self_signed_cn }}"
          C="{{ tls_self_signed_country }}"
          ST="{{ tls_self_signed_state }}"
          L="{{ tls_self_signed_locality }}"
          O="{{ tls_self_signed_organization }}"
          OU="{{ tls_self_signed_organizational_unit }}"
          SAN="{{ _nginx_san_list | join(',') }}"
          SUBJ="/C=${C}/ST=${ST}/L=${L}/O=${O}/OU=${OU}/CN=${CN}"
          openssl req -new -x509 -sha256 -nodes \
            -days "${DAYS}" \
            -key "${KEY_PATH}" \
            -out "${CRT_PATH}" \
            -subj "${SUBJ}" \
            -addext "subjectAltName=${SAN}" 2>/dev/null
          chmod 0644 "${CRT_PATH}"
          echo "CHANGED: self-signed x509 cert generated, CN=${CN}, days=${DAYS}"
      args:
        creates: "{{ _nginx_clean_cert }}"
        executable: /bin/bash
      register: _ssl_cert
      changed_when: _ssl_cert.rc is defined
  when:
    - enable_https | default(true) | bool
    - tls_self_signed_generate | default(true) | bool
    - _nginx_clean_cert == (nginx_config_dir ~ '/ssl/agra.crt')
  tags: ['nginx', 'config', 'ssl']

- name: 'Nginx (SSL) - Generate Diffie-Hellman params (guard creates sangat lama, 2048bit ~ 10-60s)'
  ansible.builtin.command:
    cmd: "openssl dhparam -out {{ _nginx_clean_dh }} {{ tls_dhparam_bits | int }}"
    creates: "{{ _nginx_clean_dh }}"
  environment:
    RANDFILE: /tmp/.rnd
  async: 300
  poll: 10
  when: enable_https | default(true) | bool
  ignore_errors: true
  tags: ['nginx', 'config', 'ssl']

- name: Nginx (SSL Custom) - Copy custom cert user dari /etc/agra/config/nginx/ssl/
  block:
    - name: Nginx (SSL Custom) - Check override cert/key di /etc/agra/config/nginx/ssl/
      ansible.builtin.stat:
        path: "/etc/agra/config/nginx/ssl/{{ item }}"
      loop:
        - agra.crt
        - agra.key
        - agra-ca.crt
      register: _custom_ssl_stat

    - name: Nginx (SSL Custom) - Copy custom cert jika ada
      ansible.builtin.copy:
        src: "/etc/agra/config/nginx/ssl/{{ item.item }}"
        dest: "{{ nginx_config_dir }}/ssl/{{ item.item }}"
        owner: root
        group: root
        mode: "{{ '0600' if item.item == 'agra.key' else '0644' }}"
        remote_src: true
      loop: "{{ _custom_ssl_stat.results }}"
      when: item.stat is defined and item.stat.exists
      notify: ['reload nginx']
  tags: ['nginx', 'config', 'ssl']

- name: Nginx (Config) - Render nginx.conf via first_found
  ansible.builtin.template:
    src: "{{ lookup('first_found', {'files': ['/etc/agra/config/nginx/nginx.conf.j2', 'nginx.conf.j2'], 'paths': [role_path + '/templates']}) }}"
    dest: "{{ nginx_config_dir }}/nginx.conf"
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: ['reload nginx', 'nginx syntax check']
  tags: ['nginx', 'config', 'conf']

- name: Nginx (Config) - Render agra-monitoring site available via first_found
  ansible.builtin.template:
    src: "{{ lookup('first_found', {'files': ['/etc/agra/config/nginx/sites-available/agra-monitoring.conf.j2', 'sites-available/agra-monitoring.conf.j2'], 'paths': [role_path + '/templates']}) }}"
    dest: "{{ nginx_sites_available_dir }}/agra-monitoring.conf"
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: ['reload nginx', 'nginx syntax check']
  tags: ['nginx', 'config', 'site']

- name: Nginx (Config) - Enable agra-monitoring site (symlink to sites-enabled)
  ansible.builtin.file:
    src: "{{ nginx_sites_available_dir }}/agra-monitoring.conf"
    dest: "{{ nginx_sites_enabled_dir }}/agra-monitoring.conf"
    state: link
    force: true
  notify: ['reload nginx']
  ignore_errors: true
  tags: ['nginx', 'config', 'site']

- name: Nginx (Config) - Disable default.conf from conf.d jika ada
  ansible.builtin.file:
    path: "{{ nginx_confd_dir }}/default.conf"
    state: absent
  notify: ['reload nginx']
  tags: ['nginx', 'config', 'site']
