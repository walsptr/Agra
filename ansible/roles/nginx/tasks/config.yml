---
- name: Nginx (Config) - Ensure CONFIG/READONLY dirs exist (root-owned, site+ssl config)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "{{ '0750' if 'ssl' in item else '0755' }}"
  loop:
    - "{{ nginx_config_dir }}"
    - "{{ nginx_sites_available_dir }}"
    - "{{ nginx_sites_enabled_dir }}"
    - "{{ nginx_confd_dir }}"
    - "{{ nginx_config_dir }}/ssl"
  tags: ['nginx', 'config', 'dirs', 'configdirs']

- name: Nginx (Config) - Ensure RUNTIME WRITABLE dirs exist (log cache, nginx worker UID inside container butuh nulis disini)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ nginx_uid }}"
    group: "{{ nginx_gid }}"
    mode: "{{ nginx_dir_mode }}"
  loop:
    - "{{ nginx_log_dir }}"
    - "{{ nginx_cache_dir }}"
  tags: ['nginx', 'config', 'dirs', 'writabledirs', 'runtime']

- name: Nginx (Config) - FORCESYNC parent common dirs ownership root:root 2775 (SHA e6360b0 grafana pattern, meskipun --tags nginx skip common)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '2775'
  loop:
    - "{{ common_etc_dir | default('/etc/agra') }}"
    - "{{ common_home_dir | default('/var/lib/agra') }}"
  ignore_errors: true
  tags: ['nginx', 'config', 'dirs', 'autocorrect', 'sha:e6360b0']

- name: Nginx (SSL Default Source) - Copy default output cert CONTROL-NODE /etc/agra/ssl/ KE managed-host /etc/nginx/ssl/ (PRIMARY OUTPUT `agra certificates generate`)
  block:
    - name: Nginx (SSL Default Source) - Stat default source cert files di CONTROL NODE /etc/agra/ssl/
      ansible.builtin.stat:
        path: "{{ item.src }}"
        get_checksum: false
      register: _defssl_src_stat
      loop:
        - src: /etc/agra/ssl/agra.crt
          dst: "{{ nginx_config_dir }}/ssl/agra.crt"
          mode: '0644'
        - src: /etc/agra/ssl/agra.key
          dst: "{{ nginx_config_dir }}/ssl/agra.key"
          mode: '0600'
        - src: /etc/agra/ssl/agra-ca.crt
          dst: "{{ nginx_config_dir }}/ssl/agra-ca.crt"
          mode: '0644'
        - src: /etc/agra/ssl/dhparam.pem
          dst: "{{ tls_dhparam_path }}"
          mode: '0644'
      become: true
      delegate_to: localhost
      run_once: true

    - name: Nginx (SSL Default Source) - Copy cert control-node ke managed-host jika source exist
      ansible.builtin.copy:
        src: "{{ item.item.src }}"
        dest: "{{ item.item.dst }}"
        owner: root
        group: root
        mode: "{{ item.item.mode }}"
        force: "{{ overwrite_ssl_certs | default(false) | bool }}"
        backup: true
      loop: "{{ _defssl_src_stat.results }}"
      when: _defssl_src_stat is defined and item is defined and item.item is defined and item.stat is defined and item.stat.exists
      notify: ['reload nginx']
  when: enable_https | default(true) | bool
  tags: ['nginx', 'config', 'ssl']

- name: Nginx (SSL Custom) - Copy custom cert user dari /etc/agra/config/nginx/ssl/
  block:
    - name: Nginx (SSL Custom) - Check override cert/key di /etc/agra/config/nginx/ssl/
      ansible.builtin.stat:
        path: "/etc/agra/config/nginx/ssl/{{ item }}"
      loop:
        - agra.crt
        - agra.key
        - agra-ca.crt
      register: _custom_ssl_stat

    - name: Nginx (SSL Custom) - Copy custom cert jika ada
      ansible.builtin.copy:
        src: "/etc/agra/config/nginx/ssl/{{ item.item }}"
        dest: "{{ nginx_config_dir }}/ssl/{{ item.item }}"
        owner: root
        group: root
        mode: "{{ '0600' if item.item == 'agra.key' else '0644' }}"
        remote_src: true
      loop: "{{ _custom_ssl_stat.results }}"
      when: item.stat is defined and item.stat.exists
      notify: ['reload nginx']
  tags: ['nginx', 'config', 'ssl']

- name: Nginx (SSL Per-Service Dedicated) - Copy dedicated grafana cert ke managed-host
  block:
    - name: Stat dedicated grafana cert di control node source
      ansible.builtin.stat:
        path: "{{ item.src }}"
        get_checksum: false
      register: _ded_stat_g
      loop:
        - src: "{{ tls_grafana_cert_path }}"
          dst: "{{ nginx_config_dir }}/ssl/grafana.crt"
          mode: '0644'
        - src: "{{ tls_grafana_key_path }}"
          dst: "{{ nginx_config_dir }}/ssl/grafana.key"
          mode: '0600'
      when: (tls_grafana_cert_path | default('') | trim | length > 0) and (tls_grafana_key_path | default('') | trim | length > 0)

    - name: Copy dedicated grafana cert & key jika source ada
      ansible.builtin.copy:
        src: "{{ item.item.src }}"
        dest: "{{ item.item.dst }}"
        owner: root
        group: root
        mode: "{{ item.item.mode }}"
        remote_src: true
      loop: "{{ _ded_stat_g.results }}"
      when: _ded_stat_g is defined and item is defined and item.stat is defined and item.stat.exists
      notify: ['reload nginx']
  when: enable_https | default(true) | bool
  tags: ['nginx', 'config', 'ssl']

- name: Nginx (SSL Per-Service Dedicated) - Copy dedicated prometheus cert ke managed-host
  block:
    - name: Stat dedicated prometheus cert di control node source
      ansible.builtin.stat:
        path: "{{ item.src }}"
        get_checksum: false
      register: _ded_stat_p
      loop:
        - src: "{{ tls_prometheus_cert_path }}"
          dst: "{{ nginx_config_dir }}/ssl/prometheus.crt"
          mode: '0644'
        - src: "{{ tls_prometheus_key_path }}"
          dst: "{{ nginx_config_dir }}/ssl/prometheus.key"
          mode: '0600'
      when: ((tls_prometheus_cert_path | default('') | trim | length > 0) and (tls_prometheus_key_path | default('') | trim | length > 0)) or ((prometheus_domain | default('') | trim | length) > 0)

    - name: Copy dedicated prometheus cert & key jika source ada
      ansible.builtin.copy:
        src: "{{ item.item.src }}"
        dest: "{{ item.item.dst }}"
        owner: root
        group: root
        mode: "{{ item.item.mode }}"
        remote_src: true
      loop: "{{ _ded_stat_p.results }}"
      when: _ded_stat_p is defined and item is defined and item.stat is defined and item.stat.exists
      notify: ['reload nginx']
  when: enable_https | default(true) | bool
  tags: ['nginx', 'config', 'ssl']

- name: Nginx (SSL FINAL GUARD) - PASTIKAN Cert + Key ADA di managed-host SEBELUM render template nginx (cegah emerg crash start)
  block:
    - name: Nginx (SSL FINAL GUARD) - Stat target cert + key managed-host final
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
      register: _final_ssl_stat
      loop:
        - "{{ nginx_config_dir }}/ssl/agra.crt"
        - "{{ nginx_config_dir }}/ssl/agra.key"
      become: true

    - name: Nginx (SSL FINAL GUARD) - FAIL USER-FRIENDLY BOX JIKA cert+key MASIH TIDAK ADA
      ansible.builtin.fail:
        msg: |
          ┌─────────────────────────────────────────────────────────────────────────────────┐
          │ ✗ SSL cert TIDAK DIAUTO-GENERATE saat deploy (new default workflow).             │
          │   CRITICAL: SSL Certificate + Private key TIDAK DITEMUKAN di managed-host.       │
          │   Path target yang harus ada:                                                    │
          │     {{ nginx_config_dir }}/ssl/agra.crt  ← cert PEM (public)                     │
          │     {{ nginx_config_dir }}/ssl/agra.key  ← private key PEM (secret, 0600)        │
          │                                                                                  │
          │   KENAPA TERJADI? 3 Penyebab:                                                    │
          │   1. LUPA generate self-signed via PRE-DEPLOY CLI `agra certificates generate`   │
          │      di control node (belum ada file di /etc/agra/ssl/ → tidak ke-copy).         │
          │   2. LUPA set `tls_cert_path` di globals.yml untuk custom CA-signed /            │
          │      LetsEncrypt (cert user di path lain tapi tidak diberitahu ke role).         │
          │   3. Upgrade dari versi lama yang masih mengandalkan inline generate managed-host│
          │      (fitur DITONGAK TOTAL sejak v0.1.0+). Gunakan command CLI                  │
          │      `agra certificates generate`.                                               │
          │                                                                                  │
          │   SOLUSI (PILIH SALAH SATU, URUTAN SESUAI PRIORITAS):                            │
          │   ┌────────────────────────────────────────────────────────────────────────────┐ │
          │   │ SOLUSI 1 [SELF-SIGNED, DIREKOMENDASIKAN UNTUK INTERNAL]:                   │ │
          │   │   Jalankan PRE-DEPLOY di CONTROL NODE:                                     │ │
          │   │     $ agra certificates generate --include-dhparam                         │ │
          │   │   Cert disimpan di /etc/agra/ssl/ → otomatis di-copy ke semua managed-host│ │
          │   │   oleh task Default Source copy. Setelah itu re-deploy:                   │ │
          │   │     $ agra deploy -i inventory.ini                                         │ │
          │   ├────────────────────────────────────────────────────────────────────────────┤ │
          │   │ SOLUSI 2 [CUSTOM CA-SIGNED / LETSENCRYPT]:                                 │ │
          │   │   2a. Dapatkan fullchain.pem + privkey.pem dari CA (mis. certbot certonly).│ │
          │   │   2b. SET PATH di /etc/agra/globals.yml (DILARANG hardcode inline managed-│ │
          │   │       host!):                                                              │ │
          │   │         tls_cert_path: "/etc/letsencrypt/live/monitor.example.com/fullchain.pem"│ │
          │   │         tls_key_path:  "/etc/letsencrypt/live/monitor.example.com/privkey.pem"  │ │
          │   │         # Opsional CA chain (ssl_stapling):                                │ │
          │   │         tls_ca_path:   "/etc/letsencrypt/live/monitor.example.com/chain.pem"    │ │
          │   │   2c. JIKA ingin dedicated cert berbeda PER DOMAIN (prometheus_domain     │ │
          │   │       berbeda dari grafana_domain):                                        │ │
          │   │         tls_grafana_cert_path:     "/etc/letsencrypt/live/monitor.example.com/fullchain.pem"│ │
          │   │         tls_grafana_key_path:      "/etc/letsencrypt/live/monitor.example.com/privkey.pem"  │ │
          │   │         tls_prometheus_cert_path:  "/etc/letsencrypt/live/prom.example.com/fullchain.pem"   │ │
          │   │         tls_prometheus_key_path:   "/etc/letsencrypt/live/prom.example.com/privkey.pem"     │ │
          │   │   2d. Re-deploy: agra deploy -i inventory.ini → custom cert di-copy       │ │
          │   │       otomatis via block copy custom / dedicated.                          │ │
          │   └────────────────────────────────────────────────────────────────────────────┘ │
          └─────────────────────────────────────────────────────────────────────────────────┘
      when: _final_ssl_stat.results | selectattr('stat.exists', 'equalto', false) | list | length > 0
  when: enable_https | default(true) | bool
  tags: ['nginx', 'config', 'ssl']

- name: Nginx (Config) - Render nginx.conf via first_found
  ansible.builtin.template:
    src: "{{ lookup('first_found', {'files': ['/etc/agra/config/nginx/nginx.conf.j2', 'nginx.conf.j2'], 'paths': [role_path + '/templates']}) }}"
    dest: "{{ nginx_config_dir }}/nginx.conf"
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: ['reload nginx', 'nginx syntax check']
  tags: ['nginx', 'config', 'conf']

- name: Nginx (Config) - Render agra-monitoring site available via first_found
  ansible.builtin.template:
    src: "{{ lookup('first_found', {'files': ['/etc/agra/config/nginx/sites-available/agra-monitoring.conf.j2', 'sites-available/agra-monitoring.conf.j2'], 'paths': [role_path + '/templates']}) }}"
    dest: "{{ nginx_sites_available_dir }}/agra-monitoring.conf"
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: ['reload nginx', 'nginx syntax check']
  tags: ['nginx', 'config', 'site']

- name: Nginx (Config) - Enable agra-monitoring site (symlink to sites-enabled)
  ansible.builtin.file:
    src: "{{ nginx_sites_available_dir }}/agra-monitoring.conf"
    dest: "{{ nginx_sites_enabled_dir }}/agra-monitoring.conf"
    state: link
    force: true
  notify: ['reload nginx']
  ignore_errors: true
  tags: ['nginx', 'config', 'site']

- name: Nginx (Config) - Disable default.conf from conf.d jika ada
  ansible.builtin.file:
    path: "{{ nginx_confd_dir }}/default.conf"
    state: absent
  notify: ['reload nginx']
  tags: ['nginx', 'config', 'site']
