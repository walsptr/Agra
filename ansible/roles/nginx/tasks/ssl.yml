---
# ── SSL: copy cert dari CONTROL NODE ke managed host ──────────────────────
# tls_*_path = path SUMBER di control node (default /etc/agra/ssl/*, hasil
# `agra certificates generate`, atau cert CA-signed custom). Dibaca sebagai
# operator user pemilik /etc/agra — stat tanpa become, copy src= dibaca
# action plugin di control node (DESIGN.md §8A). Tujuan di managed host tetap:
# {{ nginx_config_dir }}/ssl/{agra,grafana,prometheus}.{crt,key}.
- name: Nginx (SSL) - Copy cert/key dari control node
  when: enable_https | default(true) | bool
  tags: ['nginx', 'config', 'ssl']
  vars:
    _nginx_ssl_files: >-
      {{ [
           {'src': tls_cert_path, 'dst': 'agra.crt', 'mode': '0644', 'required': true},
           {'src': tls_key_path, 'dst': 'agra.key', 'mode': '0600', 'required': true},
           {'src': tls_ca_path, 'dst': 'agra-ca.crt', 'mode': '0644', 'required': false},
           {'src': tls_dhparam_path, 'dst': 'dhparam.pem', 'mode': '0644', 'required': false},
           {'src': tls_grafana_cert_path, 'dst': 'grafana.crt', 'mode': '0644', 'required': true},
           {'src': tls_grafana_key_path, 'dst': 'grafana.key', 'mode': '0600', 'required': true},
           {'src': tls_prometheus_cert_path, 'dst': 'prometheus.crt', 'mode': '0644', 'required': true},
           {'src': tls_prometheus_key_path, 'dst': 'prometheus.key', 'mode': '0600', 'required': true},
         ] | rejectattr('src', 'none') | selectattr('src', 'truthy') | list }}
    # The pairs the server blocks use: a dedicated path, else the global one
    # (sites-available/*.conf.j2 choose cert and key the same way).
    _nginx_ssl_pairs: >-
      {{ [
           {'cert': tls_cert_path, 'key': tls_key_path},
           {'cert': tls_grafana_cert_path | default('', true) | trim or tls_cert_path,
            'key': tls_grafana_key_path | default('', true) | trim or tls_key_path},
           {'cert': tls_prometheus_cert_path | default('', true) | trim or tls_cert_path,
            'key': tls_prometheus_key_path | default('', true) | trim or tls_key_path},
         ] | unique | list }}
  block:
    - name: Nginx (SSL) - Stat sumber cert di control node
      ansible.builtin.stat:
        path: "{{ item.src }}"
        get_checksum: false
      loop: "{{ _nginx_ssl_files }}"
      loop_control:
        label: "{{ item.src }}"
      register: _nginx_ssl_src
      delegate_to: localhost
      become: false
      run_once: true

    - name: Nginx (SSL) - Cert/key wajib ada dan terbaca di control node
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.readable
        fail_msg: >-
          {{ item.item.src }} {{ 'tidak terbaca oleh user saat ini — sudo chown -R "$USER:$USER" /etc/agra'
          if item.stat.exists else 'tidak ditemukan — jalankan `agra certificates generate`, atau set
          tls_cert_path/tls_key_path di globals.yml ke cert CA-signed' }}.
        quiet: true
      loop: "{{ _nginx_ssl_src.results }}"
      loop_control:
        label: "{{ item.item.src }}"
      when: item.item.required
      run_once: true

    # A key that does not belong to its certificate passes every check above
    # but stops nginx at its next start ("key values mismatch"). Compared on
    # the control node, before anything is copied.
    - name: Nginx (SSL) - Public key dari cert
      ansible.builtin.command:
        argv: [openssl, x509, -noout, -pubkey, -in, "{{ item.cert }}"]
      loop: "{{ _nginx_ssl_pairs }}"
      loop_control:
        label: "{{ item.cert }}"
      register: _nginx_ssl_cert_pub
      changed_when: false
      check_mode: false  # read-only; the assert below needs it in --check too
      failed_when: false
      delegate_to: localhost
      become: false
      run_once: true

    - name: Nginx (SSL) - Public key dari key
      ansible.builtin.command:
        argv: [openssl, pkey, -pubout, -passin, "pass:", -in, "{{ item.key }}"]
      loop: "{{ _nginx_ssl_pairs }}"
      loop_control:
        label: "{{ item.key }}"
      register: _nginx_ssl_key_pub
      changed_when: false
      check_mode: false  # read-only; the assert below needs it in --check too
      failed_when: false
      delegate_to: localhost
      become: false
      run_once: true

    - name: Nginx (SSL) - Cert dan key harus satu pasangan
      ansible.builtin.assert:
        that:
          - item.0.rc == 0
          - item.1.rc == 0
          - item.0.stdout == item.1.stdout
        fail_msg: >-
          {{ item.0.item.key }} bukan private key untuk {{ item.0.item.cert }}
          {{- ' (' ~ item.0.item.cert ~ ' bukan sertifikat PEM)' if item.0.rc != 0 else '' }}
          {{- ' (' ~ item.0.item.key ~ ' bukan private key PEM tanpa passphrase)' if item.1.rc != 0 else '' }}.
          nginx akan gagal start dengan pasangan ini. Self-signed: `agra certificates generate`;
          CA-signed: set tls_*_cert_path dan tls_*_key_path ke pasangan yang benar.
        quiet: true
      loop: "{{ _nginx_ssl_cert_pub.results | zip(_nginx_ssl_key_pub.results) | list }}"
      loop_control:
        label: "{{ item.0.item.cert }}"
      run_once: true

    - name: Nginx (SSL) - Copy ke {{ nginx_config_dir }}/ssl
      ansible.builtin.copy:
        src: "{{ item.item.src }}"
        dest: "{{ nginx_config_dir }}/ssl/{{ item.item.dst }}"
        owner: root
        group: root
        mode: "{{ item.item.mode }}"
      loop: "{{ _nginx_ssl_src.results }}"
      loop_control:
        label: "{{ item.item.dst }}"
      when: item.stat.exists
      notify: ['nginx syntax check', 'reload nginx']

    - name: Nginx (SSL) - Catat apakah CA chain tersedia (ssl_stapling auto)
      ansible.builtin.set_fact:
        _nginx_ca_present: >-
          {{ _nginx_ssl_src.results | selectattr('item.dst', 'equalto', 'agra-ca.crt')
             | selectattr('stat.exists') | list | length > 0 }}
