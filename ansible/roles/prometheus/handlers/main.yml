---
- name: restart prometheus
  ansible.builtin.debug:
    msg: "Restart prometheus triggered"
  changed_when: true
  notify:
    - restart prometheus docker
    - restart prometheus native

- name: reload prometheus
  ansible.builtin.debug:
    msg: "Reload prometheus triggered (lifecycle API)"
  changed_when: true
  notify:
    - reload prometheus docker
    - reload prometheus native

- name: restart prometheus docker
  community.docker.docker_container:
    name: "{{ prometheus_container_name }}"
    state: started
    restart: true
  when:
    - agra_deployment_mode == 'docker'
    - enable_prometheus | default(true) | bool
  ignore_errors: true

- name: restart prometheus native
  ansible.builtin.service:
    name: agra-prometheus
    state: restarted
    daemon_reload: true
  when:
    - agra_deployment_mode == 'native'
    - enable_prometheus | default(true) | bool
  ignore_errors: true

- name: reload prometheus docker
  ansible.builtin.uri:
    url: "http://{{ prometheus_web_listen_address }}/-/reload"
    method: POST
    status_code: [200, 204, 403]
  when:
    - agra_deployment_mode == 'docker'
    - enable_prometheus | default(true) | bool
  ignore_errors: true

- name: reload prometheus native
  ansible.builtin.uri:
    url: "http://{{ prometheus_web_listen_address }}/-/reload"
    method: POST
    status_code: [200, 204, 403]
  when:
    - agra_deployment_mode == 'native'
    - enable_prometheus | default(true) | bool
  ignore_errors: true
