---
- name: restart prometheus
  ansible.builtin.debug:
    msg: "Restart prometheus triggered"
  changed_when: true
  notify:
    - restart prometheus docker

- name: reload prometheus
  ansible.builtin.debug:
    msg: "Reload prometheus triggered (lifecycle API)"
  changed_when: true
  notify:
    - reload prometheus docker

- name: restart prometheus docker
  ansible.builtin.shell:
    cmd: RUNTIME=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker); $RUNTIME restart {{ prometheus_container_name }} || true
  when:
    - enable_prometheus | default(true) | bool
  changed_when: true
  ignore_errors: true

- name: reload prometheus docker
  ansible.builtin.uri:
    url: "http://{{ prometheus_web_listen_address }}/-/reload"
    method: POST
    status_code: [200, 204, 403]
  when:
    - enable_prometheus | default(true) | bool
  ignore_errors: true
