---
- name: Prometheus (Native) - Check installed binary version
  ansible.builtin.shell: |
    if [ -x {{ prometheus_native_binary_path }} ]; then
      {{ prometheus_native_binary_path }} --version 2>&1 | head -1 | grep -oE 'v?[0-9]+\.[0-9]+\.[0-9]+' | tr -d 'v'
    else
      echo "NOT_INSTALLED"
    fi
  args:
    executable: /bin/bash
  register: _prom_installed_ver
  changed_when: false
  check_mode: false
  tags: ['prometheus', 'native', 'binary']

- name: Prometheus (Native) - Download and install binary
  block:
    - name: Prometheus (Native) - Download release tarball
      ansible.builtin.get_url:
        url: "{{ prometheus_native_binary_url }}"
        dest: /tmp/prometheus-{{ prometheus_native_version }}.tar.gz
        mode: '0644'
        force: false
      register: _prom_download
      until: _prom_download is succeeded
      retries: 5
      delay: 3

    - name: Prometheus (Native) - Extract tarball
      ansible.builtin.unarchive:
        src: /tmp/prometheus-{{ prometheus_native_version }}.tar.gz
        dest: /tmp/
        remote_src: true
        creates: /tmp/prometheus-{{ prometheus_native_version }}.linux-amd64/prometheus

    - name: Prometheus (Native) - Install prometheus + promtool
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '0755'
        remote_src: true
      loop:
        - { src: '/tmp/prometheus-{{ prometheus_native_version }}.linux-amd64/prometheus', dest: '{{ prometheus_native_binary_path }}' }
        - { src: '/tmp/prometheus-{{ prometheus_native_version }}.linux-amd64/promtool', dest: '{{ prometheus_native_tools_path }}' }
      notify: ['restart prometheus']

    - name: Prometheus (Native) - Cleanup temp
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/prometheus-{{ prometheus_native_version }}.tar.gz
        - /tmp/prometheus-{{ prometheus_native_version }}.linux-amd64
  when: _prom_installed_ver.stdout != prometheus_native_version
  tags: ['prometheus', 'native', 'binary']

- name: Prometheus (Native) - Validate prometheus.yml via promtool binary
  ansible.builtin.command:
    cmd: "{{ prometheus_native_tools_path }} check config-files {{ prometheus_config_dir }}/prometheus.yml"
  changed_when: false
  tags: ['prometheus', 'native', 'validate']

- name: Prometheus (Native) - Render systemd unit via first_found
  ansible.builtin.template:
    src: "{{ lookup('first_found', {'files': ['/etc/agra/config/prometheus/prometheus.service.j2', 'prometheus.service.j2'], 'paths': [role_path + '/templates']}) }}"
    dest: /etc/systemd/system/agra-prometheus.service
    owner: root
    group: root
    mode: '0644'
  notify: ['restart prometheus']
  tags: ['prometheus', 'native', 'systemd']

- name: Prometheus (Native) - systemd daemon reload
  ansible.builtin.systemd:
    daemon_reload: true
  when: _prom_installed_ver.stdout != prometheus_native_version
  tags: ['prometheus', 'native', 'systemd']

- name: Prometheus (Native) - Enable and start service
  ansible.builtin.service:
    name: agra-prometheus
    state: started
    enabled: true
  tags: ['prometheus', 'native', 'service']
