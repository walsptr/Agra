---
- name: Prometheus (Config) - Ensure config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ prometheus_uid }}"
    group: "{{ prometheus_gid }}"
    mode: "{{ prometheus_dir_mode }}"
  loop:
    - "{{ prometheus_config_dir }}"
    - "{{ prometheus_file_sd_dir }}"
    - "{{ prometheus_rules_dir }}"
    - "{{ prometheus_data_dir }}"
  tags: ['prometheus', 'config', 'dirs']

- name: Prometheus (Config) - Ensure data dir has correct ownership (nobody=65534 for TSDB)
  ansible.builtin.file:
    path: "{{ prometheus_data_dir }}"
    state: directory
    owner: "{{ prometheus_uid }}"
    group: "{{ prometheus_gid }}"
    mode: "{{ prometheus_dir_mode }}"
    recurse: false
  tags: ['prometheus', 'config', 'dirs']

- name: Prometheus (Config) - Build CLI extra args string
  ansible.builtin.set_fact:
    _prometheus_extra_args: >-
      --config.file={{ prometheus_config_dir }}/prometheus.yml
      --storage.tsdb.path={{ prometheus_data_dir }}
      --storage.tsdb.retention.time={{ prometheus_retention_time }}
      {%- if prometheus_retention_size | length > 0 %}
      --storage.tsdb.retention.size={{ prometheus_retention_size }}
      {%- endif %}
      --web.listen-address={{ prometheus_web_listen_address }}
      {%- if _prometheus_external_url | length > 0 %}
      --web.external-url={{ _prometheus_external_url }}
      --web.route-prefix=/
      {%- endif %}
      --web.enable-admin-api
      --web.enable-lifecycle
      --log.level={{ prometheus_log_level }}
  vars:
    # Prometheus always serves at / — Grafana's datasource, the health checks,
    # backups and nginx (which strips /prometheus/) all use it there. Only its
    # links and redirects carry the external URL's path; without
    # --web.route-prefix=/ it would move every route under that path.
    # expose_prometheus_via_nginx: /prometheus/ under Grafana's public URL
    # (vars/public_url.yml).
    _prometheus_external_url: "{{ prometheus_web_external_url | trim or _agra_prometheus_subpath_url | trim }}"
  changed_when: false
  tags: ['prometheus', 'config']

- name: Prometheus (Config) - Render main prometheus.yml via FIRST_FOUND override
  ansible.builtin.template:
    src: "{{ lookup('first_found', {'files': ['/etc/agra/config/prometheus/prometheus.yml.j2', 'prometheus.yml.j2'], 'paths': [role_path + '/templates']}) }}"
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: "{{ prometheus_uid }}"
    group: "{{ prometheus_gid }}"
    mode: "{{ prometheus_file_mode }}"
  notify: ['restart prometheus']
  tags: ['prometheus', 'config']

# enable_node_exporter: false = tidak ada exporter yang berjalan, jadi tidak
# ada target (dulu: target tetap ditulis dan selalu down).
- name: Prometheus (Config) - Generate file_sd targets dari inventory groups['node_exporter']
  ansible.builtin.copy:
    dest: "{{ prometheus_file_sd_dir }}/node_exporter.yml"
    content: |
      # Generated by agra from inventory groups['node_exporter'] — do not edit manually, will be overwritten
      {% if enable_node_exporter | default(true) | bool and groups['node_exporter'] | default([]) | length > 0 %}
      - targets:
      {% for host in groups['node_exporter'] %}
        - "{{ hostvars[host]['ansible_host'] | default(host) }}:{{ (hostvars[host]['node_exporter_port'] | default(9100)) | string }}"
      {% endfor %}
        labels:
          job: node_exporter
      {% else %}
      []
      {% endif %}
    owner: "{{ prometheus_uid }}"
    group: "{{ prometheus_gid }}"
    mode: "{{ prometheus_file_mode }}"
  notify: ['reload prometheus']
  tags: ['prometheus', 'config', 'file_sd']
