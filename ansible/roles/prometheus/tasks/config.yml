---
- name: Prometheus (Config) - Ensure config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ common_user | default('agra') }}"
    group: "{{ common_group | default('agra') }}"
    mode: '0755'
  loop:
    - "{{ prometheus_config_dir }}"
    - "{{ prometheus_file_sd_dir }}"
    - "{{ prometheus_rules_dir }}"
    - "{{ prometheus_data_dir }}"
  tags: ['prometheus', 'config', 'dirs']

- name: Prometheus (Config) - Ensure data dir has correct ownership (nobody for TSDB)
  ansible.builtin.file:
    path: "{{ prometheus_data_dir }}"
    state: directory
    owner: "{{ prometheus_skip_head | default('65534') }}"
    group: "{{ common_group | default('agra') }}"
    mode: '0755'
    recurse: false
  tags: ['prometheus', 'config', 'dirs']

- name: Prometheus (Config) - Build CLI extra args string
  ansible.builtin.set_fact:
    _prometheus_extra_args: >-
      --config.file={{ prometheus_config_dir }}/prometheus.yml
      --storage.tsdb.path={{ prometheus_data_dir }}
      --storage.tsdb.retention.time={{ prometheus_retention_time }}
      {% if prometheus_retention_size | length > 0 %}
      --storage.tsdb.retention.size={{ prometheus_retention_size }}
      {% endif %}
      --web.listen-address={{ prometheus_web_listen_address }}
      {% if prometheus_web_external_url | length > 0 %}
      --web.external-url={{ prometheus_web_external_url }}
      {% endif %}
      --web.enable-admin-api
      --web.enable-lifecycle
      --log.level={{ prometheus_log_level }}
  changed_when: false
  tags: ['prometheus', 'config']

- name: Prometheus (Config) - Render main prometheus.yml via FIRST_FOUND override
  ansible.builtin.template:
    src: "{{ lookup('first_found', {'files': ['/etc/agra/config/prometheus/prometheus.yml.j2', 'prometheus.yml.j2'], 'paths': [role_path + '/templates']}) }}"
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: "{{ common_user | default('agra') }}"
    group: "{{ common_group | default('agra') }}"
    mode: '0644'
    validate: "{{ prometheus_native_tools_path if ansible_facts['os_family'] != '' else '' }} check config-files %s 2>&1 || true"
  notify: ['restart prometheus']
  tags: ['prometheus', 'config']

- name: Prometheus (Config) - Generate file_sd targets dari inventory groups['node_exporter']
  ansible.builtin.copy:
    dest: "{{ prometheus_file_sd_dir }}/node_exporter.yml"
    content: |
      # Generated by agra from inventory groups['node_exporter'] — do not edit manually, will be overwritten
      {% if groups['node_exporter'] is defined and groups['node_exporter'] | length > 0 %}
      - targets:
      {% for host in groups['node_exporter'] %}
        - "{{ hostvars[host]['ansible_host'] | default(host) }}:{{ (hostvars[host]['node_exporter_port'] | default(9100)) | string }}"
      {% endfor %}
        labels:
          job: node_exporter
      {% endif %}

      {% if groups['prometheus'] is defined and groups['prometheus'] | length > 0 %}
      - targets:
      {% for host in groups['prometheus'] %}
        - "{{ hostvars[host]['ansible_host'] | default(host) }}:{{ prometheus_port | string }}"
      {% endfor %}
        labels:
          job: prometheus
      {% endif %}
    owner: "{{ common_user | default('agra') }}"
    group: "{{ common_group | default('agra') }}"
    mode: '0644'
  notify: ['reload prometheus']
  tags: ['prometheus', 'config', 'file_sd']
