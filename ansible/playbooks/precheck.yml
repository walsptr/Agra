---
- name: 'AGRA — Preflight Validation / Precheck'
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  vars:
    _precheck_report: {}
    _precheck_pass: true
  tags: ['always', 'precheck']

  tasks:
    # ──────────────────────────────────────────────────────────────
    # GUARD: JANGAN bypass CLI! Ini memastikan HANYA CLI `agra check` / `agra precheck` / `agra verify`
    # dengan -i explicit yang boleh menjalankan playbook ini. Jika user panggil ansible-playbook LANGSUNG
    # (bypass wrapper CLI) tanpa -i → FAIL, agar user selalu explicit inventory.
    # ──────────────────────────────────────────────────────────────
    - name: 'Precheck (GUARD CLI) — Playbook ini HANYA boleh dijalankan VIA CLI `agra check/precheck/verify -i <inventory>`'
      ansible.builtin.assert:
        that:
          - _agra_cli_inventory_explicit_confirmed is defined
          - _agra_cli_inventory_explicit_confirmed | bool == true
        fail_msg: >-
          ❌ Playbook precheck.yml DILARANG dijalankan LANGSUNG via `ansible-playbook` tanpa wrapper CLI agra.
          (actual: variable _agra_cli_inventory_explicit_confirmed tidak terdefinisi)

          Alasan: Command `agra check` / `agra precheck` / `agra verify` WAJIB menyertakan
          -i / --inventory secara EXPLICIT agar user selalu memilih inventory yang dicek
          (dan playbook akan PING SEMUA NODE di inventory terlebih dahulu).

          Perbaiki (PILIH 1):
          1. ✅ REKOMENDASI: Jalankan via CLI wrapper AGRA (lebih aman + auto -i explicit check):
                agra check -i inventory/all-in-one
                ATAU: agra precheck -i inventory/multinode -K
          2. Jika BENAR-BENAR ingin jalankan ansible-playbook LANGSUNG (tidak disarankan):
                ansible-playbook ansible/playbooks/precheck.yml \
                  -i <YOUR_INVENTORY_PATH> \
                  -e "_agra_cli_inventory_explicit_confirmed=true"
      run_once: true
      delegate_to: localhost
      changed_when: false

    # ──────────────────────────────────────────────────────────────
    # PHASE 0: PING REACHABILITY ALL HOSTS (WAJIB BERHASIL SEMUA)
    # ──────────────────────────────────────────────────────────────
    - name: 'Precheck (NODE KONEKSI) — PING SEMUA HOST di inventory (ansible.builtin.ping)'
      ansible.builtin.ping:
        data: "agra-pong-{{ inventory_hostname }}"
      register: _precheck_ping
      ignore_unreachable: false
      changed_when: false

    - name: 'Precheck (NODE KONEKSI) — Semua host HARUS reachable, abort jika ada 1+ host UNREACHABLE'
      ansible.builtin.assert:
        that:
          - _precheck_ping is succeeded
          - _precheck_ping.ping is defined
          - _precheck_ping.ping is search("^agra-pong-")
        fail_msg: >-
          ❌ Host {{ inventory_hostname }} TIDAK BISA DIKONEKSI melalui SSH / Ansible connection plugin.
          (actual: _precheck_ping.failed={{ _precheck_ping.failed | default('yes') }},
          unreachable={{ _precheck_ping.unreachable | default('yes') }})

          Alasan umum + perbaiki:
          1. Host DOWN / tidak aktif → pastikan VM/server menyala & IP benar di inventory.
          2. SSH tidak bisa login → Cek SSH key user (ssh-copy-id user@host) / password di CLI dengan flag -K.
          3. Inventory hostname salah → edit file inventory -i <inventory> pastikan hostname / IP benar.
          4. Firewall blok port 22 → pastikan port 22 SSH terbuka di security group target host.
          5. Python tidak ada di target host → install python3 minimal di remote target (Ansible butuh).
          6. User tidak punya sudo NOPASSWD → jika perlu, jalankan dengan flag `-K` (ask-become-pass).
      changed_when: false

    # ──────────────────────────────────────────────────────────────
    # PHASE 1: Gather facts HANYA setelah PING berhasil semua
    # ──────────────────────────────────────────────────────────────
    - name: 'Precheck — Gather facts SEMUA host setelah ping verified'
      ansible.builtin.setup:
        gather_subset:
          - 'all_ipv4_addresses'
          - 'network'
          - 'hardware'
          - 'virtual'
          - 'distribution'
          - 'date_time'
      changed_when: false

    # ──────────────────────────────────────────────────────────────
    # PHASE BARU: NODE BOOTSTRAP (mengikuti pola Kolla-Ansible bootstrap-servers)
    # Tujuan: SEBELUM validasi vars assertion, pastikan SEMUA managed node inventory
    #         (group [monitoring] atau [node_exporter]) sudah:
    #         [1] apt/dnf package cache update terbaru
    #         [2] safe-upgrade packages OS (sehingga Docker dependency libs terbaru)
    #         [3] install Docker engine + dependencies (docker.io/python3-docker)
    #         [4] start & enable docker.service
    #         [5] VERIFY docker info OK (fail-fast jika daemon tidak bisa start)
    # Fail-fast: any_errors_fatal block level
    # Managed node ONLY: tidak jalan di control node localhost (delegate_to none)
    # ──────────────────────────────────────────────────────────────
    - name: 'Precheck (BOOTSTRAP NODE) — BLOCK: Update packages + safe-upgrade + install Docker engine + verify Docker ready (setiap managed node inventory — pola Kolla-ansible bootstrap-servers)'
      block:
        # ── 1. DEBIAN FAMILY ──
        - name: 'Precheck Bootstrap (Debian) — Update apt package index cache_valid_time=3600 agar idempotent'
          ansible.builtin.apt:
            update_cache: yes
            cache_valid_time: 3600
          when: ansible_facts['os_family'] == 'Debian'
          tags: ['bootstrap', 'precheck', 'docker', 'packages', 'update']

        - name: 'Precheck Bootstrap (Debian) — Safe upgrade packages (tidak hapus paket / dist-upgrade) — agar Docker libc dependensi terbaru'
          ansible.builtin.apt:
            upgrade: safe
          when: ansible_facts['os_family'] == 'Debian'
          tags: ['bootstrap', 'precheck', 'docker', 'packages', 'upgrade']

        - name: 'Precheck Bootstrap (Debian) — Install docker prerequisite packages (apt-transport-https ca-certificates curl gnupg lsb-release)'
          ansible.builtin.apt:
            name:
              - apt-transport-https
              - ca-certificates
              - curl
              - gnupg
              - lsb-release
            state: present
          when: ansible_facts['os_family'] == 'Debian'
          tags: ['bootstrap', 'precheck', 'docker', 'packages']

        - name: 'Precheck Bootstrap (Debian) — Install Docker engine docker.io + python3-docker SDK'
          ansible.builtin.apt:
            name:
              - docker.io
              - python3-docker
            state: present
          when: ansible_facts['os_family'] == 'Debian'
          tags: ['bootstrap', 'precheck', 'docker', 'packages']

        # ── 2. REDHAT FAMILY (RHEL / CentOS / Rocky / AlmaLinux / Fedora) ──
        - name: 'Precheck Bootstrap (RedHat) — Update dnf package metadata cache'
          ansible.builtin.dnf:
            update_cache: yes
          when: ansible_facts['os_family'] == 'RedHat'
          tags: ['bootstrap', 'precheck', 'docker', 'packages', 'update']

        - name: 'Precheck Bootstrap (RedHat) — Install Docker engine docker + python3-docker SDK'
          ansible.builtin.dnf:
            name:
              - docker
              - python3-docker
            state: present
          when: ansible_facts['os_family'] == 'RedHat'
          tags: ['bootstrap', 'precheck', 'docker', 'packages']

        # ── 3. SEMUA OS FAMILY ──
        - name: 'Precheck Bootstrap (All) — Start & enable docker.service via systemd'
          ansible.builtin.service:
            name: docker
            state: started
            enabled: true
          ignore_errors: true
          tags: ['bootstrap', 'precheck', 'docker', 'service']

        # ── 4. VERIFY DOCKER READY (FAIL-FAST) ──
        - name: 'Precheck Bootstrap (All) — VERIFY docker binary exists & Docker daemon bisa jalankan docker info OK'
          ansible.builtin.command:
            cmd: bash -lc 'set -e; command -v docker >/dev/null; docker info >/dev/null'
          register: _precheck_bootstrap_docker_info
          changed_when: false
          failed_when: false
          tags: ['bootstrap', 'precheck', 'docker', 'verify']

        - name: 'Precheck Bootstrap (All) — FAIL-FAST ASSERT: Docker binary + daemon WAJIB ready di SEMUA node. Jika gagal disini, tidak lanjut ke validasi vars!'
          ansible.builtin.assert:
            that:
              - _precheck_bootstrap_docker_info.rc is defined
              - _precheck_bootstrap_docker_info.rc | int == 0
            fail_msg: >-
              ❌ DOCKER DAEMON TIDAK BISA START di node {{ inventory_hostname }}
              (actual: _precheck_bootstrap_docker_info.rc={{ _precheck_bootstrap_docker_info.rc | default('undefined') }}).

              Langkah perbaiki (URUT):
              1. Cek log Docker daemon terbaru:
                 $ sudo journalctl -u docker.service -n 80 --no-pager
              2. Penyebab umum + solusi:
                 a. Kernel cgroup v2 incompat → Upgrade kernel LTS terbaru
                 b. Disk /var/lib/docker penuh → cleanup docker system prune -af
                 c. IPTables / nf_tables bentrok → sudo systemctl restart docker
                 d. Package corruput → reinstall: sudo apt-get install --reinstall docker.io
                 e. DNS resolve gagal apt update (block step 1) → pastikan node bisa egress
                    ke repo OS (deb.debian.org / mirror.centos). Firewall blok 80/443?
              3. Setelah perbaiki, jalankan LAGI: agra precheck -i <inventory> [-K]
          tags: ['bootstrap', 'precheck', 'docker', 'verify']

        # ── 5. DEBIAN OPSIONAL: WARNING JIKA REBOOT REQUIRED (setelah upgrade kernel) ──
        - name: 'Precheck Bootstrap (Debian ONLY) — STAT file /var/run/reboot-required (penanda upgrade kernel / libc butuh reboot)'
          ansible.builtin.stat:
            path: /var/run/reboot-required
            get_checksum: false
          register: _precheck_bootstrap_reboot_required_stat
          when: ansible_facts['os_family'] == 'Debian'
          changed_when: false
          tags: ['bootstrap', 'precheck', 'reboot']

        - name: 'Precheck Bootstrap ⚠️ WARNING — Node {{ inventory_hostname }} BUTUH REBOOT setelah kernel/libc upgrade. DISARANKAN reboot SEBELUM deploy!'
          ansible.builtin.debug:
            msg: >-
              ⚠️  WARNING: /var/run/reboot-required ADA di {{ inventory_hostname }}.
                  Upgrade kernel / library kritis (libc / systemd / openssl) baru saja
                  di-install pada fase bootstrap upgrade dan BUTUH REBOOT AGAR EFEKTIF.
                  WALAUPUN deploy bisa tetap berjalan, DISARANKAN untuk reboot node
                  TERLEBIH DAHULU SEBELUM menjalankan `agra deploy`.
          when:
            - ansible_facts['os_family'] == 'Debian'
            - _precheck_bootstrap_reboot_required_stat.stat.exists is defined
            - _precheck_bootstrap_reboot_required_stat.stat.exists | default(false) | bool == true
          changed_when: false
          tags: ['bootstrap', 'precheck', 'reboot', 'warning']

      # ── BLOCK LEVEL KONTROL ──
      any_errors_fatal: true
      # HANYA jalankan block ini di MANAGED node inventory anggota group monitoring ATAU node_exporter
      # JANGAN jalankan di control node localhost (kecuali localhost masuk group [monitoring], misal AIO)
      when:
        - inventory_hostname in (groups['monitoring'] | default([]))
          or
          inventory_hostname in (groups['node_exporter'] | default([]))

    - name: 'Precheck (LOAD) — STAT /etc/agra/globals.yml & passwords.yml exists di control node (localhost)'
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
      loop:
        - "/etc/agra/globals.yml"
        - "/etc/agra/passwords.yml"
      register: _precheck_etcagra_stat
      run_once: true
      delegate_to: localhost
      changed_when: false

    - name: 'Precheck — Load globals.yml + passwords.yml (with become: true untuk handle root-owned 0600 passwords.yml RULES §7)'
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "/etc/agra/globals.yml"
        - "/etc/agra/passwords.yml"
      become: true
      become_user: root
      failed_when: false
      changed_when: false
      run_once: true
      delegate_to: localhost

    - name: 'Precheck (LOAD) — WARNING jika globals.yml ADA tapi YAML invalid / include_vars GAGAL (monitoring_vip/grafana_domain empty padahal file non-empty)'
      ansible.builtin.debug:
        msg: |-
          ⚠️  WARNING: File /etc/agra/globals.yml ADA (size={{ _precheck_etcagra_stat.results[0].stat.size | default(0) }} bytes)
              tapi VARIABLE UTAMA `monitoring_vip` / `grafana_domain` MASIH KOSONG / UNDEFINED.
              
              KEMUNGKINAN BESAR: include_vars GAGAL (YAML SYNTAX ERROR di globals.yml, atau permission 0640
              user non-root tidak bisa baca). 
              
              PERIKSA:
                1. Validasi YAML syntax /etc/agra/globals.yml:
                   $ python3 -c "import yaml,sys; yaml.safe_load(open('/etc/agra/globals.yml')); print('OK')"
                2. Permission file: harus 0644 atau user ansible bisa baca (sudo chmod 0644 /etc/agra/globals.yml)
      when:
        - _precheck_etcagra_stat.results[0].stat.exists | default(false) | bool
        - _precheck_etcagra_stat.results[0].stat.size | default(0) | int > 20
        - (monitoring_vip | default('') | length == 0) and (grafana_domain | default('') | length == 0)
      run_once: true
      delegate_to: localhost
      changed_when: false
      tags: ['always']

    # ══════════════════════════════════════════════════════════════════════════
    # LAYER DEFAULT GUARD: JIKA include_vars globals GAGAL (YAML invalid / permission),
    # set FALLBACK DEFAULT UNTUK SEMUA VARS KRITIS SESUAI contexts/SCHEMA.md,
    # sehingga TIDAK ADA task crash "var is undefined".
    # Jika include_vars BERHASIL → var sudah terdefinisi, jadi | default() NO-OP (tidak overwrite).
    # ══════════════════════════════════════════════════════════════════════════
    - name: 'Precheck (DEFAULT GUARD) — FALLBACK set default ALL critical vars jika include_vars globals gagal (YAML invalid / permission)'
      ansible.builtin.set_fact:
        # === Deployment & Infrastructure ===
        enable_https: "{{ enable_https | default(true) | bool }}"
        tls_enabled: "{{ tls_enabled | default(true) | bool }}"
        enable_ha_grafana: "{{ enable_ha_grafana | default(false) | bool }}"
        overwrite_ssl_certs: "{{ overwrite_ssl_certs | default(false) | bool }}"
        monitoring_vip: "{{ monitoring_vip | default('') }}"
        grafana_nginx_port: "{{ grafana_nginx_port | default(30080) | int }}"
        prometheus_nginx_port: "{{ prometheus_nginx_port | default(30090) | int }}"

        # === Grafana Core ===
        grafana_domain: "{{ grafana_domain | default('') }}"
        grafana_database: "{{ grafana_database | default('sqlite') }}"
        grafana_database_host: "{{ grafana_database_host | default('') }}"
        grafana_database_port: "{{ grafana_database_port | default(3306) | int }}"
        grafana_tag: "{{ grafana_tag | default('') }}"

        # === Prometheus Core ===
        prometheus_domain: "{{ prometheus_domain | default('') }}"
        prometheus_tag: "{{ prometheus_tag | default('') }}"

        # === Node Exporter ===
        node_exporter_tag: "{{ node_exporter_tag | default('') }}"

        # === TLS Paths ===
        tls_cert_path: "{{ tls_cert_path | default('') }}"
        tls_key_path: "{{ tls_key_path | default('') }}"
        tls_grafana_cert_path: "{{ tls_grafana_cert_path | default('') }}"
        tls_grafana_key_path: "{{ tls_grafana_key_path | default('') }}"
        tls_prometheus_cert_path: "{{ tls_prometheus_cert_path | default('') }}"
        tls_prometheus_key_path: "{{ tls_prometheus_key_path | default('') }}"
      run_once: true
      delegate_to: localhost
      changed_when: false
      tags: ['always']

    - name: 'Precheck (Kategori — TOPOLOGI) — Minimal ada 1 node group monitoring'
      ansible.builtin.assert:
        that:
          - groups['monitoring'] is defined
          - groups['monitoring'] | length >= 1
        fail_msg: >-
          groups['monitoring'] TIDAK TERDEFINISI atau KOSONG (jumlah={{ groups['monitoring'] | default([]) | length }}).
          Agra monitoring stack minimal butuh 1 host di group inventory [monitoring].
          Perbaiki: edit file inventory di inventory/all-in-one ATAU inventory/multinode,
          tambahkan host ke group [monitoring] sesuai dokumentasi ARCHITECTURE.md §4.
      run_once: true
      delegate_to: localhost

    - name: 'Precheck (TOPOLOGI) — node_exporter group terdefinisi'
      ansible.builtin.assert:
        that:
          - groups['node_exporter'] is defined
          - groups['node_exporter'] | length >= 1
        fail_msg: >-
          groups['node_exporter'] TIDAK ADA atau KOSONG (jumlah={{ groups['node_exporter'] | default([]) | length }}).
          Node Exporter adalah minimal metrics agent — minimal harus ada 1 node untuk di-scrape.
          Perbaiki: di inventory, gunakan `[node_exporter:children]` + masukkan group monitoring (dan app jika ada).
      run_once: true
      delegate_to: localhost


    # ──────────────────────────────────────────────────────────────
    # UNIVERSAL SINGLE SLURP /etc/agra/globals.yml
    # HANYA 1 KALI CALL slurp DI SELURUH PRECHECK (optimasi I/O, NFR-2).
    # MONITORING_VIP fallback separate slurp LAMA DIHAPUS → merge disini.
    # Ignore_errors = true → YAML invalid globals.yml TIDAK CRASH playbook
    # (triple safety: vars context | direct parse | default guard layer 1).
    # ──────────────────────────────────────────────────────────────
    - name: 'Precheck (GLOBAL DIRECT PARSE) — BLOCK: Universal Single Slurp /etc/agra/globals.yml extract 20 critical vars + aggregate first-found (P1 var ctx / P2 direct parse / P3 default SCHEMA)'
      block:
        # ── TASK 1a: SLURP 1x only (control node localhost) ──
        - name: 'Precheck DIRECT PARSE 1/4 — slurp /etc/agra/globals.yml (SINGLE I/O READ di seluruh playbook)'
          ansible.builtin.slurp:
            src: "/etc/agra/globals.yml"
          register: _precheck_globals_slurp_universal
          delegate_to: localhost

        # ── TASK 1b-0a: PYTHON SAFE PARSE via command module (yaml.safe_load try/except, output JSON) ──
        #    WHY: Jinja filter `from_yaml` inside set_fact args dievaluasi saat "Finalization of task args"
        #         (SEBELUM task berjalan), jadi ignore_errors:true TIDAK menangkap YAML error dengan bersih
        #         (tampilkan "fatal: ... FAILED!" stack trace ke user). Dengan task command python,
        #         yaml.safe_load dibungkus try/except → selalu output JSON valid → from_json NEVER FAILS,
        #         dan ignore_errors di task command BISA menyerap error dengan bersih (no fatal output).
        - name: 'Precheck DIRECT PARSE 2a/4 — python yaml.safe_load /etc/agra/globals.yml try/except error-safe output JSON'
          ansible.builtin.command:
            cmd: |
              python3 -c "
              import yaml, json, sys
              try:
                  with open('/etc/agra/globals.yml', 'r') as fh:
                      raw = fh.read()
                  parsed = yaml.safe_load(raw) if raw.strip() else {}
                  if not isinstance(parsed, dict):
                      parsed = {}
              except Exception:
                  parsed = {}
              print(json.dumps(parsed))
              "
          delegate_to: localhost
          register: _precheck_globals_pyparse
          ignore_errors: true
          changed_when: false
          failed_when: false
          check_mode: false

        # ── TASK 1b-0b: SET FACT dari python parse JSON (100% error-safe, JSON selalu valid) ──
        - name: 'Precheck DIRECT PARSE 2b/4 — set_fact _precheck_globals_parsed_dict dari stdout python parse JSON (fallback empty dict)'
          ansible.builtin.set_fact:
            _precheck_globals_parsed_dict: >-
              {%- set safe_stdout = (_precheck_globals_pyparse.stdout | default('{}')) | string | trim -%}
              {%- set json_str = '{}' if (safe_stdout | length == 0) else safe_stdout -%}
              {{ json_str | from_json }}
          delegate_to: localhost

        # ── TASK 1b: EXTRACT vars _precheck_g_* dari parsed dict ──
        - name: 'Precheck DIRECT PARSE 3/4 — extract helper _precheck_g_<varname> dari parsed YAML globals.yml (jika key tidak ada → empty string "")'
          ansible.builtin.set_fact:
            # Infrastructure vars
            _precheck_g_enable_https:           "{{ ((_precheck_globals_parsed_dict.get('enable_https') is not none) | ternary(_precheck_globals_parsed_dict.get('enable_https'), true)) | bool }}"
            _precheck_g_tls_enabled:            "{{ ((_precheck_globals_parsed_dict.get('tls_enabled') is not none) | ternary(_precheck_globals_parsed_dict.get('tls_enabled'), true)) | bool }}"
            _precheck_g_enable_ha_grafana:      "{{ ((_precheck_globals_parsed_dict.get('enable_ha_grafana') is not none) | ternary(_precheck_globals_parsed_dict.get('enable_ha_grafana'), false)) | bool }}"
            _precheck_g_overwrite_ssl_certs:    "{{ ((_precheck_globals_parsed_dict.get('overwrite_ssl_certs') is not none) | ternary(_precheck_globals_parsed_dict.get('overwrite_ssl_certs'), false)) | bool }}"
            _precheck_g_monitoring_vip:         "{{ _precheck_globals_parsed_dict.get('monitoring_vip', '') | default('') | string | trim }}"
            _precheck_g_grafana_nginx_port:     "{{ (_precheck_globals_parsed_dict.get('grafana_nginx_port', 30080) is not none) | ternary(_precheck_globals_parsed_dict.get('grafana_nginx_port', 30080), 30080) | int }}"
            _precheck_g_prometheus_nginx_port:  "{{ (_precheck_globals_parsed_dict.get('prometheus_nginx_port', 30090) is not none) | ternary(_precheck_globals_parsed_dict.get('prometheus_nginx_port', 30090), 30090) | int }}"
            # Grafana vars
            _precheck_g_grafana_domain:         "{{ _precheck_globals_parsed_dict.get('grafana_domain', '') | default('') | string | trim }}"
            _precheck_g_grafana_database:       "{{ _precheck_globals_parsed_dict.get('grafana_database', '') | default('') | string | trim }}"
            _precheck_g_grafana_database_host:  "{{ _precheck_globals_parsed_dict.get('grafana_database_host', '') | default('') | string | trim }}"
            _precheck_g_grafana_database_port:  "{{ _precheck_globals_parsed_dict.get('grafana_database_port', 3306) | default(3306) | int }}"
            _precheck_g_grafana_tag:            "{{ _precheck_globals_parsed_dict.get('grafana_tag', '') | default('') | string | trim }}"
            # Prometheus vars
            _precheck_g_prometheus_domain:         "{{ _precheck_globals_parsed_dict.get('prometheus_domain', '') | default('') | string | trim }}"
            _precheck_g_prometheus_tag:            "{{ _precheck_globals_parsed_dict.get('prometheus_tag', '') | default('') | string | trim }}"
            # Node Exporter vars
            _precheck_g_node_exporter_tag:            "{{ _precheck_globals_parsed_dict.get('node_exporter_tag', '') | default('') | string | trim }}"
            # TLS vars
            _precheck_g_tls_cert_path: "{{ _precheck_globals_parsed_dict.get('tls_cert_path', '') | default('') | string | trim }}"
            _precheck_g_tls_key_path:  "{{ _precheck_globals_parsed_dict.get('tls_key_path', '') | default('') | string | trim }}"
          delegate_to: localhost

        # ── TASK 1c: AGGREGATE FIRST-FOUND vars _precheck_v_* (S1 / S2) ──
        - name: 'Precheck DIRECT PARSE 4/4 — FIRST-FOUND AGGREGATE _precheck_v_<varname> = S1 direct parse globals (HIGH) / S2 default SCHEMA (LOW). Juga backward compat bridge fact _precheck_monitoring_vip untuk assertion monitoring_vip lama.'
          ansible.builtin.set_fact:
            # Infrastructure vars (mode bool)
            _precheck_v_enable_https: >-
              {%- set s1_raw = _precheck_g_enable_https | default(None) -%}
              {%- set s2 = true -%}
              {%- if s1_raw is not none -%}{{ s1_raw | bool }}{%- else -%}{{ s2 }}{%- endif -%}
            _precheck_v_tls_enabled: >-
              {%- set s1_raw = _precheck_g_tls_enabled | default(None) -%}
              {%- set s2 = true -%}
              {%- if s1_raw is not none -%}{{ s1_raw | bool }}{%- else -%}{{ s2 }}{%- endif -%}
            _precheck_v_enable_ha_grafana: >-
              {%- set s1_raw = _precheck_g_enable_ha_grafana | default(None) -%}
              {%- set s2 = false -%}
              {%- if s1_raw is not none -%}{{ s1_raw | bool }}{%- else -%}{{ s2 }}{%- endif -%}
            _precheck_v_overwrite_ssl_certs: >-
              {%- set s1_raw = _precheck_g_overwrite_ssl_certs | default(None) -%}
              {%- set s2 = false -%}
              {%- if s1_raw is not none -%}{{ s1_raw | bool }}{%- else -%}{{ s2 }}{%- endif -%}
            _precheck_v_monitoring_vip: >-
              {%- set s1 = _precheck_g_monitoring_vip | default('') | string | trim -%}
              {%- set s2 = '' -%}
              {%- if s1 | length > 0 -%}{{ s1 }}{%- else -%}{{ s2 }}{%- endif -%}
            _precheck_v_grafana_nginx_port: "{{ _precheck_g_grafana_nginx_port if _precheck_g_grafana_nginx_port is not none else grafana_nginx_port }}"
            _precheck_v_prometheus_nginx_port: "{{ _precheck_g_prometheus_nginx_port if _precheck_g_prometheus_nginx_port is not none else prometheus_nginx_port }}"
            # BACKWARD COMPAT BRIDGE: assertion monitoring_vip LAMA reference _precheck_monitoring_vip (tanpa _v_) → TETAP WORKS
            _precheck_monitoring_vip: >-
              {{ _precheck_v_monitoring_vip | default('') | string | trim }}
            # Grafana vars
            _precheck_v_grafana_domain: >-
              {%- set s1 = _precheck_g_grafana_domain | default('') | string | trim -%}
              {%- set s2 = '' -%}
              {%- if s1 | length > 0 -%}{{ s1 }}{%- else -%}{{ s2 }}{%- endif -%}
            _precheck_v_grafana_database: >-
              {%- set s1 = _precheck_g_grafana_database | default('') | string | trim -%}
              {%- set s2 = 'sqlite' -%}
              {%- if s1 | length > 0 -%}{{ s1 }}{%- else -%}{{ s2 }}{%- endif -%}
            _precheck_v_grafana_database_host: >-
              {%- set s1 = _precheck_g_grafana_database_host | default('') | string | trim -%}
              {%- set s2 = '' -%}
              {%- if s1 | length > 0 -%}{{ s1 }}{%- else -%}{{ s2 }}{%- endif -%}
            _precheck_v_grafana_database_port: >-
              {%- set s1 = _precheck_g_grafana_database_port | default(0) | int -%}
              {%- set s2 = 3306 -%}
              {%- if s1 | int > 0 -%}{{ s1 | int }}{%- else -%}{{ s2 | int }}{%- endif -%}
            _precheck_v_grafana_tag: >-
              {%- set s1 = _precheck_g_grafana_tag | default('') | string | trim -%}
              {%- set s2 = '' -%}
              {%- if s1 | length > 0 -%}{{ s1 }}{%- else -%}{{ s2 }}{%- endif -%}
            # Prometheus vars
            _precheck_v_prometheus_domain: >-
              {%- set s1 = _precheck_g_prometheus_domain | default('') | string | trim -%}
              {%- set s2 = '' -%}
              {%- if s1 | length > 0 -%}{{ s1 }}{%- else -%}{{ s2 }}{%- endif -%}
            _precheck_v_prometheus_tag: >-
              {%- set s1 = _precheck_g_prometheus_tag | default('') | string | trim -%}
              {%- set s2 = '' -%}
              {%- if s1 | length > 0 -%}{{ s1 }}{%- else -%}{{ s2 }}{%- endif -%}
            # Node Exporter vars
            _precheck_v_node_exporter_tag: >-
              {%- set s1 = _precheck_g_node_exporter_tag | default('') | string | trim -%}
              {%- set s2 = '' -%}
              {%- if s1 | length > 0 -%}{{ s1 }}{%- else -%}{{ s2 }}{%- endif -%}
            # TLS vars
            _precheck_v_tls_cert_path: >-
              {%- set s1 = _precheck_g_tls_cert_path | default('') | string | trim -%}
              {%- set s2 = '' -%}
              {%- if s1 | length > 0 -%}{{ s1 }}{%- else -%}{{ s2 }}{%- endif -%}
            _precheck_v_tls_key_path: >-
              {%- set s1 = _precheck_g_tls_key_path | default('') | string | trim -%}
              {%- set s2 = '' -%}
              {%- if s1 | length > 0 -%}{{ s1 }}{%- else -%}{{ s2 }}{%- endif -%}
          delegate_to: localhost
      # BLOCK LEVEL ignore_errors + when + run_once:
      ignore_errors: true
      when:
        - _precheck_etcagra_stat.results[0].stat.exists | default(false) | bool
      run_once: true
      delegate_to: localhost
      tags: ['always']

    - name: 'Precheck (TOPOLOGI) — Multi-node WAJIB monitoring_vip (validasi via direct parse globals)'
      ansible.builtin.assert:
        that:
          - _precheck_v_monitoring_vip | length > 0
        fail_msg: >-
          ❌ Multi-node HA: groups['monitoring']={{ groups['monitoring'] | length }} node TAPI monitoring_vip KOSONG. Nilai saat ini='{{ _precheck_v_monitoring_vip }}'.
          SATU-SATUNYA SUMBER config yang dicek (direct parse): /etc/agra/globals.yml (control node localhost).
          Perbaiki: edit /etc/agra/globals.yml, set line:
            monitoring_vip: "192.168.1.100"
          Setelah disimpan, validasi YAML syntax (wajib indentasi benar):
            python3 -c "import yaml; yaml.safe_load(open('/etc/agra/globals.yml')); print('YAML OK')"
          CATATAN: JANGAN set vars konfigurasi di file inventory [group:vars] atau host_vars!
          Inventory HANYA untuk daftar host + koneksi SSH (ansible_host / ansible_connection). Lihat RULES.md §14.
      when:
        - groups['monitoring'] is defined
        - groups['monitoring'] | length > 1
      run_once: true
      delegate_to: localhost

    - name: 'Precheck (GRAFANA DB) — Mode DB valid'
      ansible.builtin.assert:
        that:
          - _precheck_v_grafana_database in ['sqlite', 'mysql', 'postgresql']
        fail_msg: >-
          ❌ grafana_database INVALID. Nilai saat ini='{{ _precheck_v_grafana_database }}'.
          SATU-SATUNYA SUMBER config yang dicek (direct parse): /etc/agra/globals.yml (control node localhost).
          Perbaiki: edit /etc/agra/globals.yml, set line:
            grafana_database: "sqlite"
          Setelah disimpan, validasi YAML syntax (wajib indentasi benar):
            python3 -c "import yaml; yaml.safe_load(open('/etc/agra/globals.yml')); print('YAML OK')"
          CATATAN: JANGAN set vars konfigurasi di file inventory [group:vars] atau host_vars!
          Inventory HANYA untuk daftar host + koneksi SSH (ansible_host / ansible_connection). Lihat RULES.md §14.
      run_once: true
      delegate_to: localhost

    - name: 'Precheck (GRAFANA DB) — External mysql/pg WAJIB host tidak kosong'
      ansible.builtin.assert:
        that:
          - _precheck_v_grafana_database_host | length > 0
        fail_msg: >-
          ❌ grafana_database='{{ _precheck_v_grafana_database }}' external TAPI grafana_database_host KOSONG. Nilai saat ini='{{ _precheck_v_grafana_database_host }}'.
          SATU-SATUNYA SUMBER config yang dicek (direct parse): /etc/agra/globals.yml (control node localhost).
          Perbaiki: edit /etc/agra/globals.yml, set line:
            grafana_database_host: "db.example.com"
          Setelah disimpan, validasi YAML syntax (wajib indentasi benar):
            python3 -c "import yaml; yaml.safe_load(open('/etc/agra/globals.yml')); print('YAML OK')"
          CATATAN: JANGAN set vars konfigurasi di file inventory [group:vars] atau host_vars!
          Inventory HANYA untuk daftar host + koneksi SSH (ansible_host / ansible_connection). Lihat RULES.md §14.
      when:
        - _precheck_v_grafana_database in ['mysql', 'postgresql']
      run_once: true
      delegate_to: localhost

    - name: 'Precheck (GRAFANA DB) — Connectivity check ke external DB host port'
      ansible.builtin.wait_for:
        host: "{{ _precheck_v_grafana_database_host }}"
        port: "{{ _precheck_v_grafana_database_port | int }}"
        state: started
        timeout: 5
      when:
        - _precheck_v_grafana_database in ['mysql', 'postgresql']
      run_once: true
      delegate_to: localhost
      register: _db_check
      ignore_errors: true

    - name: 'Precheck (GRAFANA DB) — Hard fail jika external DB tidak reachable'
      ansible.builtin.assert:
        that:
          - _db_check is not failed
        fail_msg: >-
          ❌ External DB {{ _precheck_v_grafana_database }} di {{ _precheck_v_grafana_database_host }}:{{ _precheck_v_grafana_database_port }} TIDAK TERCAPAI dalam 5 detik. Nilai saat ini host='{{ _precheck_v_grafana_database_host }}', port='{{ _precheck_v_grafana_database_port }}'.
          SATU-SATUNYA SUMBER config yang dicek (direct parse): /etc/agra/globals.yml (control node localhost).
          Perbaiki: edit /etc/agra/globals.yml, set line:
            grafana_database_host: "db.example.com"
            grafana_database_port: 3306
          Setelah disimpan, validasi YAML syntax (wajib indentasi benar):
            python3 -c "import yaml; yaml.safe_load(open('/etc/agra/globals.yml')); print('YAML OK')"
          CATATAN: Pastikan (a) host/port benar, (b) firewall open, (c) service DB hidup.
          Inventory HANYA untuk daftar host + koneksi SSH (ansible_host / ansible_connection). Lihat RULES.md §14.
      when:
        - _precheck_v_grafana_database in ['mysql', 'postgresql']
        - _db_check is failed
      run_once: true
      delegate_to: localhost

    - name: 'Precheck (VERSI) — Docker variabel tag WAJIB terisi (mode docker-only)'
      ansible.builtin.assert:
        that:
          - item.tag | length > 0
        fail_msg: >-
          ❌ {{ item.name }}_tag KOSONG. Nilai saat ini='{{ item.tag }}'.
          SATU-SATUNYA SUMBER config yang dicek (direct parse): /etc/agra/globals.yml (control node localhost).
          Perbaiki: edit /etc/agra/globals.yml, set line:
            {{ item.name }}_tag: "v1.0.0"
          Setelah disimpan, validasi YAML syntax (wajib indentasi benar):
            python3 -c "import yaml; yaml.safe_load(open('/etc/agra/globals.yml')); print('YAML OK')"
          CATATAN: JANGAN set vars konfigurasi di file inventory [group:vars] atau host_vars!
          Inventory HANYA untuk daftar host + koneksi SSH (ansible_host / ansible_connection). Lihat RULES.md §14.
      loop:
        - { name: 'prometheus', tag: "{{ _precheck_v_prometheus_tag }}" }
        - { name: 'grafana', tag: "{{ _precheck_v_grafana_tag }}" }
        - { name: 'node_exporter', tag: "{{ _precheck_v_node_exporter_tag }}" }
      run_once: true
      delegate_to: localhost

    - name: 'Precheck (GRAFANA SECRET) — BLOCK: Cek grafana_admin_password + grafana_secret_key ASLI dari /etc/agra/passwords.yml TIDAK BOLEH default/weak'
      block:
        - name: 'Precheck Secret Grafana — STAT passwords.yml exist'
          ansible.builtin.stat:
            path: "/etc/agra/passwords.yml"
            get_checksum: false
          register: _precheck_pwd_stat
          run_once: true
          delegate_to: localhost
          become: true
          become_user: root
          changed_when: false

        - name: 'Precheck Secret Grafana — SLURP /etc/agra/passwords.yml via module (PAKAI BECOME ROOT — slurp module RESPEK become, BERBEDA lookup(file) yang IGNORIR become → EACCES file chmod 0600)'
          ansible.builtin.slurp:
            src: "/etc/agra/passwords.yml"
          register: _precheck_pwd_slurp
          when: _precheck_pwd_stat.stat is defined and _precheck_pwd_stat.stat.exists
          run_once: true
          delegate_to: localhost
          become: true
          become_user: root
          changed_when: false

        - name: 'Precheck Secret Grafana — Parse dict YAML: slurp content defined + length>0 → b64decode → from_yaml (JIKA content undefined / length 0 → empty dict {}, BUKAN check .skipped yang salah logic)'
          ansible.builtin.set_fact:
            _precheck_pwd_dict: >-
              {% if _precheck_pwd_slurp.content is defined and _precheck_pwd_slurp.content | default('') | length > 0 %}
                {{ ((_precheck_pwd_slurp.content | b64decode | default('---\n', true)) | from_yaml) | default({}, true) }}
              {% else %}
                {{ {} }}
              {% endif %}
          run_once: true
          delegate_to: localhost
          changed_when: false

        - name: 'Precheck Secret Grafana — Extract grafana_admin_password + grafana_secret_key real dari passwords.yml (bukan role defaults, bukan globals)'
          ansible.builtin.set_fact:
            _precheck_pwd_grafana_admin:     "{{ (_precheck_pwd_dict.get('grafana_admin_password', '') | default('', true) | string | trim) }}"
            _precheck_pwd_grafana_secret:    "{{ (_precheck_pwd_dict.get('grafana_secret_key',    '') | default('', true) | string | trim) }}"
            _precheck_pwd_prom_admin:         "{{ (_precheck_pwd_dict.get('prometheus_admin_password', '') | default('', true) | string | trim) }}"
            _precheck_pwd_grafana_db:         "{{ (_precheck_pwd_dict.get('grafana_database_password', '') | default('', true) | string | trim) }}"
            _precheck_pwd_backup_s3_secret:   "{{ (_precheck_pwd_dict.get('backup_s3_secret_key',   '') | default('', true) | string | trim) }}"
            _precheck_pwd_file_exists:        "{{ _precheck_pwd_stat.stat is defined and _precheck_pwd_stat.stat.exists }}"
            _precheck_pwd_dict_keys:          "{{ (_precheck_pwd_dict.keys() | default([], true) | list | sort) }}"
            _precheck_pwd_dict_keys_count:    "{{ (_precheck_pwd_dict.keys() | default([], true) | list | length) }}"
            _precheck_pwd_field_admin_exists: "{{ (_precheck_pwd_dict.keys() | default([], true) | list | intersect(['grafana_admin_password']) | length > 0) }}"
            _precheck_pwd_field_secret_exists: "{{ (_precheck_pwd_dict.keys() | default([], true) | list | intersect(['grafana_secret_key']) | length > 0) }}"

            _precheck_pwd_raw_text: >-
              {% if _precheck_pwd_slurp.content is defined and _precheck_pwd_slurp.content | default('') | length > 0 %}
                {{ _precheck_pwd_slurp.content | b64decode | default('', true) }}
              {% else %}
                <<<SLURP_CONTENT_UNDEFINED_or_SKIPPED>>>
              {% endif %}
            _precheck_pwd_raw_first80:     "{{ _precheck_pwd_raw_text[:80] | default('', true) | string | replace('\n', ' ') }}"
            _precheck_pwd_raw_line_count:  "{{ ( _precheck_pwd_raw_text.split('\n') | list | length | default(0) | int ) }}"
          run_once: true
          delegate_to: localhost
          changed_when: false

        - name: 'Precheck Secret Grafana — Cross-validate Kolla pattern: Fact global include_vars PLAY AWAL (grafana_admin_password) vs Direct file parse'
          ansible.builtin.set_fact:
            _precheck_pwd_from_globals_grafana_admin: "{{ grafana_admin_password | default('<<<FACT_UNDEFINED_AFTER_INCLUDE_VARS>>>', true) | string | trim }}"
            _precheck_pwd_from_globals_grafana_secret: "{{ grafana_secret_key | default('<<<FACT_UNDEFINED_AFTER_INCLUDE_VARS>>>', true) | string | trim }}"
            _precheck_pwd_globals_match_file: >-
              {{ ( _precheck_pwd_grafana_admin == _precheck_pwd_from_globals_grafana_admin
                   and _precheck_pwd_grafana_admin | length > 0
                   and (not _precheck_pwd_from_globals_grafana_admin | string | regex_search('FACT_UNDEFINED') | default(false) | bool)
              ) | bool }}
          run_once: true
          delegate_to: localhost
          changed_when: false

        - name: 'Precheck Secret Grafana — DEBUG SELALU PRINT: [1]STAT [2]PARSE [3]FIELD [5]RAW CONTENT slurp status [6]KOLLA CROSS-VALIDATE [4]ROOT CAUSE (dev mode — plaintext only, TANPA enkripsi)'
          ansible.builtin.debug:
            msg: |
              🔍 PRECHECK GRAFANA SECRET — TROUBLESHOOT INFO (DIAGNOSTIC):
              ┌─────────────────────────────────────────────────────────────────┐
              │ [1] STATUS FILE /etc/agra/passwords.yml (STAT)                  │
              │     · File exists        : {{ _precheck_pwd_file_exists }}
              {% if _precheck_pwd_file_exists | bool %}
              │     · Size (bytes)       : {{ _precheck_pwd_stat.stat.size | default('?') }}
              │     · Mode / chmod       : {{ _precheck_pwd_stat.stat.mode | default('?') }}  (harus = 0600)
              │     · Owner              : {{ _precheck_pwd_stat.stat.pw_name | default('?') }}:{{ _precheck_pwd_stat.stat.gr_name | default('?') }}  (harus = root:root)
              {% endif %}
              ├─────────────────────────────────────────────────────────────────┤
              │ [2] HASIL PARSE DICT passwords.yml (slurp + b64decode + from_yaml)│
              │     · Jumlah total keys  : {{ _precheck_pwd_dict_keys_count }} keys
              │     · List keys yang ADA : [{% for k in _precheck_pwd_dict_keys %}'{{ k }}'{% if not loop.last %}, {% endif %}{% endfor %}]
              ├─────────────────────────────────────────────────────────────────┤
              │ [3] FIELD YANG DICEK assertion:                                 │
              │     · grafana_admin_password
              │       → FIELD ADA di file?  : {{ _precheck_pwd_field_admin_exists }}
              │       → VALUE (truncate 16) : "{{ _precheck_pwd_grafana_admin[:16] }}{% if _precheck_pwd_grafana_admin | length > 16 %}...{% endif %}"
              │       → PANJANG VALUE      : {{ _precheck_pwd_grafana_admin | length }}
              │       → EQUAL "admin"?     : {{ _precheck_pwd_grafana_admin == 'admin' }}
              │     · grafana_secret_key
              │       → FIELD ADA di file?  : {{ _precheck_pwd_field_secret_exists }}
              │       → VALUE (truncate 20) : "{{ _precheck_pwd_grafana_secret[:20] }}{% if _precheck_pwd_grafana_secret | length > 20 %}...{% endif %}"
              │       → PANJANG VALUE      : {{ _precheck_pwd_grafana_secret | length }}
              ├─────────────────────────────────────────────────────────────────┤
              │ [5] SLURP RAW CONTENT STATUS (PLAINTEXT SAJA, DEV MODE)     │
              │     · First 80 chars raw decoded: "{{ _precheck_pwd_raw_first80 }}"
              │     · Total baris decoded     : {{ _precheck_pwd_raw_line_count }} lines
              │     · Size bytes file STAT    : {{ _precheck_pwd_stat.stat.size | default('?') }}
              │     · ✨ SLURP content TERDEFINISI DENGAN BAIK? : {{ (_precheck_pwd_slurp.content is defined and _precheck_pwd_slurp.content | default('') | length > 0) | bool }}
              │       (jika False = PENYEBAB UTAMA semua field kosong! biasanya module slurp become tidak jalan; cek sudo passwordless? cek permission /etc/agra chmod?)
              ├─────────────────────────────────────────────────────────────────┤
              │ [6] CROSS-VALIDASI KOLLA-ANSIBLE PATTERN: Fact include_vars vs Direct file parse │
              │     · Fact include_vars grafana_admin (PLAY AWAL line 237 include_vars, Kolla pattern)
              │       → VALUE trunc 16 chars: "{{ _precheck_pwd_from_globals_grafana_admin[:16] }}{% if _precheck_pwd_from_globals_grafana_admin | length > 16 %}...{% endif %}"
              │       → PANJANG          : {{ _precheck_pwd_from_globals_grafana_admin | length }}
              │       → APAKAH TERDEFINISI? : {{ (not _precheck_pwd_from_globals_grafana_admin | string | regex_search('FACT_UNDEFINED') | default(false) | bool) }}
              │     · Direct file parse grafana_admin (panel [3])
              │       → VALUE trunc 16 chars: "{{ _precheck_pwd_grafana_admin[:16] }}{% if _precheck_pwd_grafana_admin | length > 16 %}...{% endif %}"
              │       → PANJANG          : {{ _precheck_pwd_grafana_admin | length }}
              │     · ☯ KEDUA NILAI SAMA?  : {{ _precheck_pwd_globals_match_file | bool }}
              {% if not _precheck_pwd_globals_match_file | bool %}
              │     PENYEBAB perbedaan nilai:
              │       - Fact global UNDEFINED (<<<FACT_UNDEFINED...>>> muncul) → PLAY AWAL include_vars line 237 GAGAL (permission 0600 / become passwordless sudo? cek log task PRE AWAL "Precheck — Load globals.yml + passwords.yml" ERROR ATAU IGNORED?)
              │       - Fact global ADA tapi BEDA nilai → BUG PRECEDENCE: cek /etc/agra/globals.yml MASIH ADA line 26 grafana_admin_password: "admin" TIDAK TERHAPUS? (commit 16646f1 SEHARUSNYA line 26-27 SUDAH dihapus!) → HAPUS JIKA MASIH ADA.
              {% endif %}
              ├─────────────────────────────────────────────────────────────────┤
              │ [4] ROOT CAUSE KEMUNGKINAN (Berdasarkan panel [1]+[2]+[3]+[5]+[6]): │
              {% if not _precheck_pwd_file_exists | bool %}
              │   ⚠️ FILE TIDAK ADA → Solusi: Jalankan `agra genpwd`               │
              {% elif _precheck_pwd_stat.stat.mode is defined and _precheck_pwd_stat.stat.mode != '0600' %}
              │   ⚠️ MODE FILE BUKAN 0600 → Fix: sudo chmod 0600 /etc/agra/passwords.yml │
              {% elif _precheck_pwd_stat.stat.pw_name is defined and _precheck_pwd_stat.stat.pw_name != 'root' %}
              │   ⚠️ OWNER BUKAN root → Fix: sudo chown root:root /etc/agra/passwords.yml │
              {% elif _precheck_pwd_file_exists | bool and ( _precheck_pwd_stat.stat.size | default(0) | int > 50 ) and ( not (_precheck_pwd_slurp.content is defined and _precheck_pwd_slurp.content | default('') | length > 0) ) %}
              │   🚨 SLURP MODULE GAGAL BACA CONTENT (content undefined / length 0)!
              │      → file size {{ _precheck_pwd_stat.stat.size | default('?') }} bytes tapi content tidak bisa di-slurp!
              │      SOLUSI: (a) cek sudo passwordless sudo untuk user ubuntu (sudo -n true),
              │              (b) chown root:root /etc/agra + chmod 0775 /etc/agra dulu,
              │              (c) JALANKAN LAGI: agra genpwd --force (overwrite file dgn plaintext baru).
              {% elif _precheck_pwd_file_exists | bool and ( _precheck_pwd_stat.stat.size | default(0) | int > 50 ) and ( _precheck_pwd_dict_keys_count | int == 0 ) %}
              │   ⚠️ FILE BESAR tapi PARSE YAML RETURN DICT KOSONG (0 keys)!      │
              │      → YAML TIDAK VALID. Kemungkinan:
              │        · Hanya comment TANPA key:value apapun.
              │        · Syntax YAML rusak total (tab / colon / quote salah).
              │   ✅ FIX: Jalankan `agra genpwd --force` (overwrite file dgn YANG VALID!)
              {% elif (not _precheck_pwd_field_admin_exists | bool) or (not _precheck_pwd_field_secret_exists | bool) %}
              │   ⚠️ FIELD TIDAK ADA DI FILE! (grafana_admin_password / grafana_secret_key TIDAK di list keys panel 2)
              │   ✅ CARA FIX MUDAH: Jalankan → `agra genpwd`  (TANPA --force!)    │
              │      → Commit da2b4bf: genpwd IDEMPOTENT field-by-field.         │
              │      → HANYA field KOSONG yang DIISI random baru.                │
              │      → Field existing (keepalived/s3) RETAIN 100% AMAN.          │
              {% elif _precheck_pwd_grafana_admin | length == 0 %}
              │   ⚠️ FIELD ADA tapi VALUE KOSONG → `agra genpwd` (field diisi random) │
              {% elif _precheck_pwd_grafana_admin == 'admin' %}
              │   ⚠️ VALUE = "admin" (default lemah!) → `agra genpwd --force`       │
              {% elif _precheck_pwd_grafana_secret | length < 16 %}
              │   ⚠️ secret_key PANJANG < 16 → `agra genpwd` (atau --force regenerate) │
              {% else %}
              │   ✅ SEMUA SESUAI STANDARD → assertion PASS ✔                     │
              {% endif %}
              └─────────────────────────────────────────────────────────────────┘
          run_once: true
          delegate_to: localhost
          changed_when: false
        - name: 'Precheck Secret Grafana — FAIL-FAST ASSERT: grafana_admin_password TIDAK BOLEH = "admin" (default) dan minimal 8 karakter'
          ansible.builtin.assert:
            that:
              - _precheck_pwd_field_admin_exists | bool
              - _precheck_pwd_grafana_admin | string | length > 0
              - _precheck_pwd_grafana_admin | string != 'admin'
              - _precheck_pwd_grafana_admin | string | length >= 8
            fail_msg: >-
                ❌ SECURITY: grafana_admin_password di /etc/agra/passwords.yml TIDAK SESUAI STANDARD!
                
                === [DIAGNOSTIC] DATA DARI DEBUG PANEL [1]-[6] DI ATAS ===
                · Field ADA di passwords.yml?   : {{ _precheck_pwd_field_admin_exists }}
                · Nilai saat ini (truncate 16)  : "{{ _precheck_pwd_grafana_admin[:16] }}{% if _precheck_pwd_grafana_admin | length > 16 %}...{% endif %}"
                · Panjang karakter              : {{ _precheck_pwd_grafana_admin | length }} (minimal 8)
                · Sama dengan default "admin"?  : {{ _precheck_pwd_grafana_admin == 'admin' }}
                · ✨ SLURP content TERDEFINISI? : {{ (_precheck_pwd_slurp.content is defined and _precheck_pwd_slurp.content | default('') | length > 0) | bool }}
                
                === [ROOT CAUSE BERDASARKAN DIAGNOSTIC (auto Jinja if/elif)] ===
                {% if not (_precheck_pwd_slurp.content is defined and _precheck_pwd_slurp.content | default('') | length > 0) %}
                🔴 SLURP MODULE GAGAL BACA CONTENT (content undefined atau length 0).
                   File size mungkin ada tapi module slurp + become root TIDAK BERHASIL baca isi.
                   Penyebab: sudo passwordless tidak jalan / become gagal / permission /etc/agra salah.
                {% elif not _precheck_pwd_field_admin_exists | bool %}
                🔴 FIELD `grafana_admin_password` TIDAK ADA SAMA SEKALI di passwords.yml!
                   Biasanya genpwd PERNAH dijalankan SEBELUM commit da2b4bf (versi lama cek size>50 bytes → GAGAL tanpa --force, file TIDAK diubah).
                   ATAU YAML syntax RUSAK TOTAL (from_yaml return {}), cek panel [5] first80 chars.
                {% elif _precheck_pwd_grafana_admin | length == 0 %}
                🟡 FIELD ADA TAPI VALUE KOSONG string (empty).
                {% elif _precheck_pwd_grafana_admin == 'admin' %}
                🔴 FIELD ADA TAPI VALUE = 'admin' DEFAULT TIDAK AMAN!
                {% elif _precheck_pwd_grafana_admin | length < 8 %}
                🟡 FIELD ADA TAPI PANJANG KURANG DARI 8 KARAKTER.
                {% else %}
                🔴 Lihat panel debug task di atas [1]-[6] untuk diagnostic detail lebih lanjut.
                {% endif %}
                
                === [CARA FIX URUTAN PRIORITAS (1-3 MENIT)] ===
                  PRIORITAS #1 [SLURP FAIL (Panel [5] = False)]:
                     → (a) cek sudo passwordless: $ sudo -n true  (jika minta password → enable NOPASSWD untuk user ubuntu di /etc/sudoers.d/)
                     → (b) perbaiki permission: $ sudo chown root:root /etc/agra && sudo chmod 0775 /etc/agra
                     → (c) JALANKAN 👉 $ agra genpwd --force
                        (OVERWRITE SEMUA field + REGENERATE SEMUA password random secure 14+ chars.
                         File DITULIS ULANG SEBAGAI PLAINTEXT YANG VALID.)
                     → (d) cek isi RAW file secara langsung (sudo):
                        $ sudo head -3 /etc/agra/passwords.yml
                
                  PRIORITAS #2 [SLURP OK tapi field tidak ada / YAML rusak]:
                     → JALANKAN 👉 $ agra genpwd --force
                        (overwrite file dgn plaintext YANG VALID, semua field regenerate.)
                     → ATAU jika YAML syntax rusak ringan, edit manual:
                        $ sudo vi /etc/agra/passwords.yml  (pastikan indentasi 2 spasi, TIDAK ada tab)
                     → 1. Pastikan SUDAH git pull origin main commit da2b4bf ada untuk genpwd idempotent.
                     → 2. Jalankan TANPA --force (field existing RETAIN 100% AMAN):
                             $ agra genpwd
                        → genpwd SEKARANG IDEMPOTENT field-by-field. Hanya field KOSONG / TIDAK ADA yang DIISI.
                     → 3. Jalankan LAGI precheck: $ agra precheck -i inventory/....yml
                
                  PRIORITAS #3 [field ADA tapi value empty / kurang]:
                     → Jalankan TANPA --force: $ agra genpwd
                        (hanya field KOSONG yang DIISI, field existing RETAIN AMAN.)
                
                  PRIORITAS #4: deploy ulang grafana SETELAH password BENAR:
                     → $ agra deploy -i inventory/....yml
                     → ⚠ PERHATIAN: grafana_admin_password HANYA di-apply PERTAMA KALI container start / grafana.db baru.
                        Jika DB sudah dibuat dengan admin/admin, reset password manual via:
                          docker exec -it agra-grafana grafana-cli admin reset-admin-password <password-baru>
            success_msg: >-
              ✅ grafana_admin_password SESUAI STANDARD. Field ADA, length={{ _precheck_pwd_grafana_admin | length }}, BUKAN default admin, direct parse == fact include_vars Kolla pattern: {{ _precheck_pwd_globals_match_file | bool }}.
          run_once: true
          delegate_to: localhost
        - name: 'Precheck Secret Grafana — FAIL-FAST ASSERT: grafana_secret_key TIDAK BOLEH empty / default CHANGE_ME / < 16 karakter'
          ansible.builtin.assert:
            that:
              - _precheck_pwd_grafana_secret | length > 0
              - _precheck_pwd_grafana_secret | length >= 16
              - "'CHANGE_ME' not in _precheck_pwd_grafana_secret | upper"
            fail_msg: >-
              ❌ SECURITY: grafana_secret_key di /etc/agra/passwords.yml WEAK/DEFAULT/EMPTY!
              Nilai saat ini (length={{ _precheck_pwd_grafana_secret | length }}): "{{ _precheck_pwd_grafana_secret[:20] }}{% if _precheck_pwd_grafana_secret | length > 20 %}...{% endif %}"
              (grafana_secret_key minimal 16 karakter, tidak boleh mengandung kata CHANGE_ME placeholder).

              FIX: Jalankan $ agra genpwd  (field grafana_secret_key auto-generate random 32 chars).
                   Jika isi manual: openssl rand -base64 32 → paste ke /etc/agra/passwords.yml line grafana_secret_key.
          run_once: true
          delegate_to: localhost
      when: enable_grafana | default(true) | bool
      tags: ['grafana', 'security', 'precheck']

    - name: 'Precheck (TLS EXPIRY) — Cek sisa umur cert self-signed jika enable_https'
      block:
        - name: 'Precheck TLS — Stat cert file'
          ansible.builtin.stat:
            path: "{{ _precheck_v_tls_cert_path }}"
          register: _cert_stat
        - name: 'Precheck TLS — Hitung days remaining via openssl x509'
          ansible.builtin.command: >-
            openssl x509 -in {{ _precheck_v_tls_cert_path }} -noout -enddate
          register: _cert_end
          changed_when: false
          failed_when: false
          when: _cert_stat.stat is defined and _cert_stat.stat.exists
        - name: 'Precheck TLS — WARNING kalau remaining < 30 hari'
          ansible.builtin.debug:
            msg: >-
              ⚠️ PERINGATAN: TLS cert {{ _precheck_v_tls_cert_path }} akan EXPIRED DALAM < 30 HARI
              (enddate={{ _cert_end.stdout | default('N/A') }}). Jalankan `agra tls regenerate` untuk
              generate cert self-signed baru (DESIGN §6, Task 13).
          when:
            - _cert_end.rc is defined
            - _cert_end.rc == 0
            - (('notAfter=' in _cert_end.stdout) or ('notAfter' in _cert_end.stdout))
      when:
        - _precheck_v_enable_https | bool
        - _precheck_v_tls_cert_path | length > 0
      ignore_errors: true

    - name: 'Precheck — SUMMARY SUCCESS'
      ansible.builtin.debug:
        msg:
          - "✅ AGRA PRECHECK PASSED"
          - "Node Bootstrap: Docker engine ready ✓ semua {{ groups['monitoring'] | default([]) | length }} monitoring node + {{ groups['node_exporter'] | default([]) | length }} node_exporter target"
          - "Topologi: {{ groups['monitoring'] | length }} monitoring node(s), {{ groups['node_exporter'] | default([]) | length }} node_exporter target(s)"
          - "Configuration source: DIRECT PARSE /etc/agra/globals.yml (single source of truth precheck assertions)"
          - "Grafana database: {{ _precheck_v_grafana_database }}"
          - "HA: enable_ha_grafana={{ _precheck_v_enable_ha_grafana }}; keepalived={{ groups['monitoring'] | length > 1 }}"
      run_once: true
