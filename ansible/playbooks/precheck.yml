---
- name: 'AGRA — Preflight Validation / Precheck'
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  vars:
    _precheck_report: {}
    _precheck_pass: true
  tags: ['always', 'precheck']

  tasks:
    # ──────────────────────────────────────────────────────────────
    # GUARD: JANGAN bypass CLI! Ini memastikan HANYA CLI `agra check` / `agra precheck` / `agra verify`
    # dengan -i explicit yang boleh menjalankan playbook ini. Jika user panggil ansible-playbook LANGSUNG
    # (bypass wrapper CLI) tanpa -i → FAIL, agar user selalu explicit inventory.
    # ──────────────────────────────────────────────────────────────
    - name: 'Precheck (GUARD CLI) — Playbook ini HANYA boleh dijalankan VIA CLI `agra check/precheck/verify -i <inventory>`'
      ansible.builtin.assert:
        that:
          - _agra_cli_inventory_explicit_confirmed is defined
          - _agra_cli_inventory_explicit_confirmed | bool == true
        fail_msg: >-
          ❌ Playbook precheck.yml DILARANG dijalankan LANGSUNG via `ansible-playbook` tanpa wrapper CLI agra.
          (actual: variable _agra_cli_inventory_explicit_confirmed tidak terdefinisi)

          Alasan: Command `agra check` / `agra precheck` / `agra verify` WAJIB menyertakan
          -i / --inventory secara EXPLICIT agar user selalu memilih inventory yang dicek
          (dan playbook akan PING SEMUA NODE di inventory terlebih dahulu).

          Perbaiki (PILIH 1):
          1. ✅ REKOMENDASI: Jalankan via CLI wrapper AGRA (lebih aman + auto -i explicit check):
                agra check -i inventory/all-in-one
                ATAU: agra precheck -i inventory/multinode -K
          2. Jika BENAR-BENAR ingin jalankan ansible-playbook LANGSUNG (tidak disarankan):
                ansible-playbook ansible/playbooks/precheck.yml \
                  -i <YOUR_INVENTORY_PATH> \
                  -e "_agra_cli_inventory_explicit_confirmed=true"
      run_once: true
      delegate_to: localhost
      changed_when: false

    # ──────────────────────────────────────────────────────────────
    # PHASE 0: PING REACHABILITY ALL HOSTS (WAJIB BERHASIL SEMUA)
    # ──────────────────────────────────────────────────────────────
    - name: 'Precheck (NODE KONEKSI) — PING SEMUA HOST di inventory (ansible.builtin.ping)'
      ansible.builtin.ping:
        data: "agra-pong-{{ inventory_hostname }}"
      register: _precheck_ping
      ignore_unreachable: false
      changed_when: false

    - name: 'Precheck (NODE KONEKSI) — Semua host HARUS reachable, abort jika ada 1+ host UNREACHABLE'
      ansible.builtin.assert:
        that:
          - _precheck_ping is succeeded
          - _precheck_ping.ping is defined
          - _precheck_ping.ping is search("^agra-pong-")
        fail_msg: >-
          ❌ Host {{ inventory_hostname }} TIDAK BISA DIKONEKSI melalui SSH / Ansible connection plugin.
          (actual: _precheck_ping.failed={{ _precheck_ping.failed | default('yes') }},
          unreachable={{ _precheck_ping.unreachable | default('yes') }})

          Alasan umum + perbaiki:
          1. Host DOWN / tidak aktif → pastikan VM/server menyala & IP benar di inventory.
          2. SSH tidak bisa login → Cek SSH key user (ssh-copy-id user@host) / password di CLI dengan flag -K.
          3. Inventory hostname salah → edit file inventory -i <inventory> pastikan hostname / IP benar.
          4. Firewall blok port 22 → pastikan port 22 SSH terbuka di security group target host.
          5. Python tidak ada di target host → install python3 minimal di remote target (Ansible butuh).
          6. User tidak punya sudo NOPASSWD → jika perlu, jalankan dengan flag `-K` (ask-become-pass).
      changed_when: false

    # ──────────────────────────────────────────────────────────────
    # PHASE 1: Gather facts HANYA setelah PING berhasil semua
    # ──────────────────────────────────────────────────────────────
    - name: 'Precheck — Gather facts SEMUA host setelah ping verified'
      ansible.builtin.setup:
        gather_subset:
          - 'all_ipv4_addresses'
          - 'network'
          - 'hardware'
          - 'virtual'
          - 'distribution'
          - 'date_time'
      changed_when: false

    - name: 'Precheck (LOAD) — STAT /etc/agra/globals.yml & passwords.yml exists di control node (localhost)'
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
      loop:
        - "/etc/agra/globals.yml"
        - "/etc/agra/passwords.yml"
      register: _precheck_etcagra_stat
      run_once: true
      delegate_to: localhost
      changed_when: false

    - name: 'Precheck — Load globals.yml + passwords.yml'
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "/etc/agra/globals.yml"
        - "/etc/agra/passwords.yml"
      ignore_errors: true
      run_once: true
      delegate_to: localhost

    - name: 'Precheck (LOAD) — WARNING jika globals.yml ADA tapi YAML invalid / include_vars GAGAL (monitoring_vip/grafana_domain empty padahal file non-empty)'
      ansible.builtin.debug:
        msg: |-
          ⚠️  WARNING: File /etc/agra/globals.yml ADA (size={{ _precheck_etcagra_stat.results[0].stat.size | default(0) }} bytes)
              tapi VARIABLE UTAMA `monitoring_vip` / `grafana_domain` MASIH KOSONG / UNDEFINED.
              
              KEMUNGKINAN BESAR: include_vars GAGAL (YAML SYNTAX ERROR di globals.yml, atau permission 0640
              user non-root tidak bisa baca). 
              
              PERIKSA:
                1. Validasi YAML syntax /etc/agra/globals.yml:
                   $ python3 -c "import yaml,sys; yaml.safe_load(open('/etc/agra/globals.yml')); print('OK')"
                2. Permission file: harus 0644 atau user ansible bisa baca (sudo chmod 0644 /etc/agra/globals.yml)
      when:
        - _precheck_etcagra_stat.results[0].stat.exists | default(false) | bool
        - _precheck_etcagra_stat.results[0].stat.size | default(0) | int > 20
        - (monitoring_vip | default('') | length == 0) and (grafana_domain | default('') | length == 0)
      run_once: true
      delegate_to: localhost
      changed_when: false
      tags: ['always']

    - name: 'Precheck (Kategori — TOPOLOGI) — Minimal ada 1 node group monitoring'
      ansible.builtin.assert:
        that:
          - groups['monitoring'] is defined
          - groups['monitoring'] | length >= 1
        fail_msg: >-
          groups['monitoring'] TIDAK TERDEFINISI atau KOSONG (jumlah={{ groups['monitoring'] | default([]) | length }}).
          Agra monitoring stack minimal butuh 1 host di group inventory [monitoring].
          Perbaiki: edit file inventory di inventory/all-in-one ATAU inventory/multinode,
          tambahkan host ke group [monitoring] sesuai dokumentasi ARCHITECTURE.md §4.
      run_once: true
      delegate_to: localhost

    - name: 'Precheck (TOPOLOGI) — node_exporter group terdefinisi'
      ansible.builtin.assert:
        that:
          - groups['node_exporter'] is defined
          - groups['node_exporter'] | length >= 1
        fail_msg: >-
          groups['node_exporter'] TIDAK ADA atau KOSONG (jumlah={{ groups['node_exporter'] | default([]) | length }}).
          Node Exporter adalah minimal metrics agent — minimal harus ada 1 node untuk di-scrape.
          Perbaiki: di inventory, gunakan `[node_exporter:children]` + masukkan group monitoring (dan app jika ada).
      run_once: true
      delegate_to: localhost

    - name: 'Precheck (TOPOLOGI) — AGGREGATE monitoring_vip dari 4 SUMBER (first found non-empty) untuk hindari scoping delegate ambigu'
      ansible.builtin.set_fact:
        _precheck_monitoring_vip: >-
          {%- set found = namespace(v='') -%}
          {%- set ns = namespace(vipped='') -%}
          {%- set ns_global_mon = monitoring_vip | default('') | trim -%}
          {%- if ns_global_mon | length > 0 and found.v | length == 0 -%}
            {%- set found.v = ns_global_mon -%}
          {%- endif -%}
          {%- set hv_first = hostvars[groups['monitoring'][0]]['monitoring_vip'] | default('') | trim -%}
          {%- if hv_first | length > 0 and found.v | length == 0 -%}
            {%- set found.v = hv_first -%}
          {%- endif -%}
          {%- for h in groups['monitoring'] | default([]) -%}
            {%- set hv_mon = hostvars[h]['monitoring_vip'] | default('') | trim -%}
            {%- if hv_mon | length > 0 and found.v | length == 0 -%}
              {%- set found.v = hv_mon -%}
            {%- endif -%}
          {%- endfor -%}
          {{ found.v | trim }}
      run_once: true
      delegate_to: localhost

    - name: 'Precheck (TOPOLOGI) — FALLBACK DIRECT PARSE /etc/agra/globals.yml (slurp + from_yaml) jika aggregate masih kosong'
      block:
        - name: 'Precheck — slurp globals.yml di localhost'
          ansible.builtin.slurp:
            src: "/etc/agra/globals.yml"
          register: _precheck_globals_slurp
          delegate_to: localhost

        - name: 'Precheck — extract monitoring_vip dari parsed YAML globals jika fact diatas masih kosong'
          ansible.builtin.set_fact:
            _precheck_monitoring_vip: >-
              {%- set parsed = (_precheck_globals_slurp.content | b64decode | from_yaml) or {} -%}
              {%- set from_file = parsed.get('monitoring_vip', '') | default('') | trim -%}
              {%- if from_file | length > 0 and (_precheck_monitoring_vip | default('') | length == 0) -%}
                {{ from_file }}
              {%- else -%}
                {{ _precheck_monitoring_vip | default('') | trim }}
              {%- endif -%}
          delegate_to: localhost
      when:
        - _precheck_etcagra_stat.results[0].stat.exists | default(false) | bool
        - _precheck_monitoring_vip | default('') | length == 0
      run_once: true
      tags: ['always']

    - name: 'Precheck (TOPOLOGI) — Multi-node WAJIB monitoring_vip (validasi via aggregate 4-sumber fact)'
      ansible.builtin.assert:
        that:
          - _precheck_monitoring_vip | default('') | length > 0
        fail_msg: >-
          Multi-node HA: groups['monitoring']={{ groups['monitoring'] | length }} node TAPI monitoring_vip KOSONG.
          Keepalived HA butuh Virtual IP.
          
          Lokasi config yang dicari (4 SUMBER, first found non-empty):
            1. Variable `monitoring_vip` di Ansible context (include_vars globals.yml / extra vars)
            2. hostvars[groups['monitoring'][0]].monitoring_vip — inventory_host var first node monitoring
            3. SEMUA node group monitoring hostvars.*.monitoring_vip — any host var non-empty
            4. DIRECT PARSE /etc/agra/globals.yml di control node → key monitoring_vip
          
          Perbaiki: set `monitoring_vip: "x.x.x.x"` di INVENTORY vars
          (group_vars/monitoring.yml atau group_vars/all.yml)
          ATAU di /etc/agra/globals.yml:
            monitoring_vip: "192.168.1.100"
          
          Setelah di-set: pastikan YAML syntax valid:
            $ python3 -c "import yaml; yaml.safe_load(open('/etc/agra/globals.yml')); print('YAML OK')"
      when:
        - groups['monitoring'] is defined
        - groups['monitoring'] | length > 1
      run_once: true
      delegate_to: localhost

    - name: 'Precheck (GRAFANA DB) — Mode DB valid'
      ansible.builtin.assert:
        that:
          - grafana_database | default('sqlite') in ['sqlite', 'mysql', 'postgresql']
        fail_msg: >-
          grafana_database='{{ grafana_database | default("") }}' INVALID.
          Hanya 3 mode yang didukung: sqlite (file lokal) | mysql (external) | postgresql (external).
          Perbaiki globals.yml grafana_database ke salah satu dari 3.
      run_once: true
      delegate_to: localhost

    - name: 'Precheck (GRAFANA DB) — External mysql/pg WAJIB host tidak kosong'
      ansible.builtin.assert:
        that:
          - grafana_database_host | default('') | length > 0
        fail_msg: >-
          grafana_database='{{ grafana_database }}' external TAPI grafana_database_host KOSONG.
          RULES §9: agra TIDAK install DB — user harus sudah punya external DB server.
          Perbaiki set grafana_database_host di globals.yml atau inventory.
      when:
        - grafana_database | default('sqlite') in ['mysql', 'postgresql']
      run_once: true
      delegate_to: localhost

    - name: 'Precheck (GRAFANA DB) — Connectivity check ke external DB host port'
      ansible.builtin.wait_for:
        host: "{{ grafana_database_host }}"
        port: "{{ grafana_database_port | int }}"
        state: started
        timeout: 5
      when:
        - grafana_database | default('sqlite') in ['mysql', 'postgresql']
      run_once: true
      delegate_to: localhost
      register: _db_check
      ignore_errors: true

    - name: 'Precheck (GRAFANA DB) — Hard fail jika external DB tidak reachable'
      ansible.builtin.assert:
        that:
          - _db_check is not failed
        fail_msg: >-
          External DB {{ grafana_database }} di {{ grafana_database_host }}:{{ grafana_database_port }}
          TIDAK TERCAPAI dalam 5 detik. Grafana tidak akan bisa connect saat deploy.
          Checklist perbaikan: (a) host/port benar, (b) firewall open, (c) service DB hidup.
      when:
        - grafana_database | default('sqlite') in ['mysql', 'postgresql']
        - _db_check is failed
      run_once: true
      delegate_to: localhost

    - name: 'Precheck (VERSI) — Docker variabel tag terisi jika mode docker'
      ansible.builtin.assert:
        that:
          - item.tag | length > 0
        fail_msg: >-
          Mode docker tapi {{ item.name }}_tag KOSONG.
          Tag wajib untuk reproducible deployment. Set {{ item.name }}_tag di globals.yml.
      loop:
        - { name: 'prometheus', tag: "{{ prometheus_tag | default('') }}" }
        - { name: 'grafana', tag: "{{ grafana_tag | default('') }}" }
        - { name: 'node_exporter', tag: "{{ node_exporter_tag | default('') }}" }
      when:
        - agra_deployment_mode == 'docker'
      run_once: true
      delegate_to: localhost

    - name: 'Precheck (VERSI) — Native variabel version terisi jika mode native'
      ansible.builtin.assert:
        that:
          - item.ver | length > 0
        fail_msg: >-
          Mode native tapi {{ item.name }}_native_version KOSONG.
          Perlu spesifikasi versi untuk pin reproducible install native OS package.
          Set {{ item.name }}_native_version di globals.yml.
      loop:
        - { name: 'prometheus', ver: "{{ prometheus_native_version | default('') }}" }
        - { name: 'grafana', ver: "{{ grafana_native_version | default('') }}" }
        - { name: 'node_exporter', ver: "{{ node_exporter_native_version | default('') }}" }
      when:
        - agra_deployment_mode == 'native'
      run_once: true
      delegate_to: localhost

    - name: 'Precheck (TLS EXPIRY) — Cek sisa umur cert self-signed jika enable_https'
      block:
        - name: 'Precheck TLS — Stat cert file'
          ansible.builtin.stat:
            path: "{{ tls_cert_path }}"
          register: _cert_stat
        - name: 'Precheck TLS — Hitung days remaining via openssl x509'
          ansible.builtin.command: >-
            openssl x509 -in {{ tls_cert_path }} -noout -enddate
          register: _cert_end
          changed_when: false
          failed_when: false
          when: _cert_stat.stat is defined and _cert_stat.stat.exists
        - name: 'Precheck TLS — WARNING kalau remaining < 30 hari'
          ansible.builtin.debug:
            msg: >-
              ⚠️ PERINGATAN: TLS cert {{ tls_cert_path }} akan EXPIRED DALAM < 30 HARI
              (enddate={{ _cert_end.stdout | default('N/A') }}). Jalankan `agra tls regenerate` untuk
              generate cert self-signed baru (DESIGN §6, Task 13).
          when:
            - _cert_end.rc is defined
            - _cert_end.rc == 0
            - (('notAfter=' in _cert_end.stdout) or ('notAfter' in _cert_end.stdout))
      when:
        - enable_https | default(true) | bool
        - tls_cert_path | default('') | length > 0
      ignore_errors: true


    - name: 'Precheck (DEPLOYMENT MODE) — Mode docker/native valid'
      ansible.builtin.assert:
        that:
          - agra_deployment_mode in ['docker', 'native']
        fail_msg: >-
          agra_deployment_mode='{{ agra_deployment_mode }}' INVALID.
          Hanya support: 'docker' (default) atau 'native' (systemd).
          Perbaiki globals.yml atau set via CLI env AGRA_DEPLOYMENT_MODE.
      run_once: true
      delegate_to: localhost

    - name: 'Precheck — SUMMARY SUCCESS'
      ansible.builtin.debug:
        msg:
          - "✅ AGRA PRECHECK PASSED"
          - "Topologi: {{ groups['monitoring'] | length }} monitoring node(s), {{ groups['node_exporter'] | default([]) | length }} node_exporter target(s)"
          - "Deployment mode: {{ agra_deployment_mode }}"
          - "Grafana database: {{ grafana_database | default('sqlite') }}"
          - "HA: enable_ha_grafana={{ enable_ha_grafana | default(false) }}; keepalived={{ groups['monitoring'] | length > 1 }}"
      run_once: true
