---
- import_playbook: precheck.yml
  tags: ['always', 'precheck']

- name: 'AGRA ROLLBACK — Info awal'
  hosts: all
  gather_facts: true
  become: false
  tags: ['rollback']
  vars_files:
    - "{{ playbook_dir }}/../../etc/agra/globals.yml"
    - "{{ playbook_dir }}/../../etc/agra/passwords.yml"
  tasks:
    - name: 'Rollback — Info'
      ansible.builtin.debug:
        msg: >-
          ⚠️ ROLLBACK: Menggunakan variabel rollback_* jika tersedia di globals.yml atau extra_vars.
          Jika TIDAK ada rollback variabel, peran ini setara dengan deploy (apply state idempotent current vars).
          Contoh: -e prometheus_tag=v2.45.0 -e grafana_tag=10.4.0 untuk pin ke versi lama.
      run_once: true

- name: 'AGRA ROLLBACK — Phase 1 Standby nodes first'
  hosts: "{{ groups['monitoring'][1:] | default([]) }}"
  gather_facts: true
  become: true
  serial: 1
  tags: ['rollback']
  vars_files:
    - "{{ playbook_dir }}/../../etc/agra/globals.yml"
    - "{{ playbook_dir }}/../../etc/agra/passwords.yml"
  roles:
    - role: common
    - role: node_exporter
      when: inventory_hostname in groups['node_exporter'] | default([])
    - role: prometheus
      when: inventory_hostname in groups['prometheus'] | default([])
    - role: grafana
      when: inventory_hostname in groups['grafana'] | default([])
    - role: nginx
      when: enable_nginx | default(true) | bool
    - role: keepalived
      when:
        - groups['monitoring'] is defined
        - groups['monitoring'] | length > 1

- name: 'AGRA ROLLBACK — Phase 2 Master node last'
  hosts: "{{ [groups['monitoring'][0]] }}"
  gather_facts: true
  become: true
  serial: 1
  tags: ['rollback']
  vars_files:
    - "{{ playbook_dir }}/../../etc/agra/globals.yml"
    - "{{ playbook_dir }}/../../etc/agra/passwords.yml"
  roles:
    - role: common
    - role: node_exporter
      when: inventory_hostname in groups['node_exporter'] | default([])
    - role: prometheus
      when: inventory_hostname in groups['prometheus'] | default([])
    - role: grafana
      when: inventory_hostname in groups['grafana'] | default([])
    - role: nginx
      when: enable_nginx | default(true) | bool
    - role: keepalived
      when:
        - groups['monitoring'] is defined
        - groups['monitoring'] | length > 1
