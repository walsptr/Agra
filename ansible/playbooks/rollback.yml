---
- name: 'AGRA ROLLBACK — Info awal'
  hosts: all
  gather_facts: true
  become: false
  tags: ['rollback']
  pre_tasks:
    - name: 'Load globals.yml + passwords.yml (become root — handle 0600 passwords.yml RULES §7)'
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "/etc/agra/globals.yml"
        - "/etc/agra/passwords.yml"
      become: true
      become_user: root
      run_once: true
      delegate_to: localhost
      changed_when: false
      failed_when: false
  tasks:
    - name: 'Rollback — Info'
      ansible.builtin.debug:
        msg: >-
          ⚠️ ROLLBACK: Menggunakan variabel rollback_* jika tersedia di globals.yml atau extra_vars.
          Jika TIDAK ada rollback variabel, peran ini setara dengan deploy (apply state idempotent current vars).
          Contoh: -e prometheus_tag=v2.45.0 -e grafana_tag=10.4.0 untuk pin ke versi lama.
      run_once: true

- name: 'AGRA ROLLBACK — Phase 1 Standby nodes first'
  hosts: "{{ groups['monitoring'][1:] | default([]) }}"
  gather_facts: true
  become: true
  serial: 1
  tags: ['rollback']
  pre_tasks:
    - name: 'Load globals.yml + passwords.yml (become root — handle 0600 passwords.yml RULES §7)'
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "/etc/agra/globals.yml"
        - "/etc/agra/passwords.yml"
      become: true
      become_user: root
      run_once: true
      delegate_to: localhost
      changed_when: false
      failed_when: false
  roles:
    - role: common
    - role: node_exporter
      when: inventory_hostname in groups['node_exporter'] | default([])
    - role: prometheus
      when: inventory_hostname in groups['prometheus'] | default([])
    - role: grafana
      when: inventory_hostname in groups['grafana'] | default([])
    - role: nginx
      when: enable_nginx | default(true) | bool
    - role: keepalived
      when:
        - groups['monitoring'] is defined
        - groups['monitoring'] | length > 1

- name: 'AGRA ROLLBACK — Phase 2 Master node last'
  hosts: "{{ [(groups['monitoring'] | default([]))[0]] | default([]) if (groups['monitoring'] is defined and groups['monitoring'] | length > 0) else [] }}"
  gather_facts: true
  become: true
  serial: 1
  tags: ['rollback']
  pre_tasks:
    - name: 'Load globals.yml + passwords.yml (become root — handle 0600 passwords.yml RULES §7)'
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "/etc/agra/globals.yml"
        - "/etc/agra/passwords.yml"
      become: true
      become_user: root
      run_once: true
      delegate_to: localhost
      changed_when: false
      failed_when: false
  roles:
    - role: common
    - role: node_exporter
      when: inventory_hostname in groups['node_exporter'] | default([])
    - role: prometheus
      when: inventory_hostname in groups['prometheus'] | default([])
    - role: grafana
      when: inventory_hostname in groups['grafana'] | default([])
    - role: nginx
      when: enable_nginx | default(true) | bool
    - role: keepalived
      when:
        - groups['monitoring'] is defined
        - groups['monitoring'] | length > 1
