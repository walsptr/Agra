---
- name: 'AGRA — Generate random passwords ke etc/agra/passwords.yml'
  hosts: localhost
  gather_facts: false
  connection: local
  become: false
  tags: ['genpwd']

  vars:
    passwords_file: "/etc/agra/passwords.yml"
    pwd_charset: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-"
    pwd_length: 14
    genpwd_force: "{{ genpwd_force | default(false) }}"

  tasks:
    - name: 'GenPwd — Stat existing passwords.yml'
      ansible.builtin.stat:
        path: "{{ passwords_file }}"
      register: _pwd_stat

    - name: 'GenPwd — Assert JANGAN overwrite jika existing non-empty DAN tidak force'
      ansible.builtin.assert:
        that:
          - (_pwd_stat.stat.size | default(0) < 50) or genpwd_force | bool
        fail_msg: >-
          ❌ /etc/agra/passwords.yml SUDAH ADA dan terisi. TIDAK di-overwrite untuk mencegah kehilangan creds.
          Jika YAKIN ingin generate BARU (semua password lama di-reset) —
          jalankan `agra genpwd --force` (akan set extra_vars genpwd_force=true).
          Backup manual dulu jika perlu — cp /etc/agra/passwords.yml /etc/agra/passwords.yml.bak
      when: _pwd_stat.stat is defined and _pwd_stat.stat.exists

    - name: 'GenPwd — Backup existing sebelum overwrite'
      ansible.builtin.copy:
        src: "{{ passwords_file }}"
        dest: "{{ passwords_file }}.bak-{{ lookup('pipe', 'date +%s') | default('0') }}"
        remote_src: true
      when:
        - _pwd_stat.stat is defined
        - _pwd_stat.stat.exists
        - _pwd_stat.stat.size | default(0) > 10
      ignore_errors: true

    - name: 'GenPwd — Generate 6 random passwords via python3 secrets module (ZERO DEPENDENCY)'
      block:
        - name: 'GenPwd — Generate generator script py path'
          ansible.builtin.tempfile:
            state: file
            suffix: .py
            prefix: agra-genpwd-
          register: _gen_py

        - name: 'GenPwd — Tulis generator script (ensure complexity min_lower min_upper min_numeric)'
          ansible.builtin.copy:
            dest: "{{ _gen_py.path }}"
            mode: '0700'
            content: |
              import secrets, string, json, sys

              LENGTH = 14
              MIN_LOWER = 4
              MIN_UPPER = 4
              MIN_NUMERIC = 4
              SPECIAL_BASE = "-_"  # URL safe
              SPECIAL_EXTRA = "-_./"  # for s3 secret key

              lower = string.ascii_lowercase
              upper = string.ascii_uppercase
              digits = string.digits
              letters = string.ascii_letters

              def gen_pwd(length=LENGTH, extra_chars=SPECIAL_BASE):
                  all_chars = letters + digits + extra_chars
                  password_chars = [
                      secrets.choice(lower) for _ in range(MIN_LOWER)
                  ] + [
                      secrets.choice(upper) for _ in range(MIN_UPPER)
                  ] + [
                      secrets.choice(digits) for _ in range(MIN_NUMERIC)
                  ]
                  remaining = length - len(password_chars)
                  password_chars += [secrets.choice(all_chars) for _ in range(remaining)]
                  secrets.SystemRandom().shuffle(password_chars)
                  return "".join(password_chars)

              out = {
                'grafana_admin_password': gen_pwd(14),
                'grafana_database_password': gen_pwd(14),
                'grafana_secret_key': gen_pwd(14, extra_chars="-_."),
                'keepalived_auth_pass': gen_pwd(14, extra_chars=""),
                'backup_s3_access_key': gen_pwd(14, extra_chars=""),
                'backup_s3_secret_key': gen_pwd(14, extra_chars=SPECIAL_EXTRA),
              }
              sys.stdout.write(json.dumps(out, indent=2))

        - name: 'GenPwd — Execute generator script'
          ansible.builtin.command:
            cmd: "python3 {{ _gen_py.path }}"
          register: _gen_py_out
          changed_when: false

        - name: 'GenPwd — Parse JSON output'
          ansible.builtin.set_fact:
            _gen_pwd_map: "{{ _gen_py_out.stdout | from_json }}"

        - name: 'GenPwd — Set 6 fact passwords'
          ansible.builtin.set_fact:
            _pwd_grafana_admin: "{{ _gen_pwd_map['grafana_admin_password'] }}"
            _pwd_grafana_db: "{{ _gen_pwd_map['grafana_database_password'] }}"
            _pwd_grafana_secret_key: "{{ _gen_pwd_map['grafana_secret_key'] }}"
            _pwd_keepalived: "{{ _gen_pwd_map['keepalived_auth_pass'] }}"
            _pwd_backup_s3_access: "{{ _gen_pwd_map['backup_s3_access_key'] }}"
            _pwd_backup_s3_secret: "{{ _gen_pwd_map['backup_s3_secret_key'] }}"

        - name: 'GenPwd — Cleanup temp py script'
          ansible.builtin.file:
            path: "{{ _gen_py.path }}"
            state: absent

    - name: 'GenPwd — Tulis passwords.yml (TANPA VAULT, plaintext 14 chars)'
      ansible.builtin.copy:
        dest: "{{ passwords_file }}"
        mode: '0600'
        content: |
          # ============================================================
          # /etc/agra/passwords.yml — AGRA SECRETS (PLAINTEXT — JANGAN commit! SUDAH di .gitignore)
          # Generated — {{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S%z') | default('today') }}
          #
          # ❗ PRODUKSI — LINDUNGI FILE INI DENGAN chmod 0600. JANGAN PERNAH commit PLAINTEXT passwords.yml ke GIT (SUDAH di .gitignore). Jika butuh enkripsi, pakai tool external seperti git-crypt / blackbox / sops.
          # ============================================================

          # Grafana admin password (login ke UI https //vip/grafana/)
          grafana_admin_password: "{{ _pwd_grafana_admin }}"

          # Grafana external database password (mysql / postgresql)
          grafana_database_password: "{{ _pwd_grafana_db }}"

          # Grafana [security] secret_key (signing session cookies, link sharing)
          grafana_secret_key: "{{ _pwd_grafana_secret_key }}"

          # Keepalived VRRP authentication password (antar node sync)
          keepalived_auth_pass: "{{ _pwd_keepalived }}"

          # S3 access credentials (backup.yml — HANYA jika backup_s3_bucket di-set)
          backup_s3_access_key: "{{ _pwd_backup_s3_access }}"
          backup_s3_secret_key: "{{ _pwd_backup_s3_secret }}"
      no_log: true

    - name: 'GenPwd — Success info'
      ansible.builtin.debug:
        msg:
          - "✅ AGRA GENPWD SELESAI → 6 random password 14 karakter ditulis ke {{ passwords_file }}"
          - "ℹ️ Passwords dalam plaintext. MODE 0600 hanya owner bisa baca. FILE INI TERMASUK .gitignore JANGAN di-commit."
          - "ℹ️ SELANJUTNYA: Edit globals.yml sesuai environment, lalu jalankan `agra check` lalu `agra deploy`."
