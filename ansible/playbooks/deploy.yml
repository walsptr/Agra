    - role: node_exporter

- name: 'AGRA DEPLOY STEP 3 — Apply prometheus ke group prometheus'
  hosts: prometheus
  gather_facts: true
  become: true
  tags: ['deploy', 'prometheus', 'config']
  pre_tasks:
    - name: 'Load globals.yml + passwords.yml (become root — handle 0600 passwords.yml RULES §7)'
