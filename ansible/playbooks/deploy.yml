---
- name: 'AGRA DEPLOY STEP 1 — Apply common role ke ALL hosts'
  hosts: all
  gather_facts: true
  become: true
  tags: ['deploy', 'common', 'config']
  pre_tasks:
    - name: 'Load globals.yml + passwords.yml (become root — handle 0600 passwords.yml RULES §7)'
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "/etc/agra/globals.yml"
        - "/etc/agra/passwords.yml"
      become: true
      become_user: root
      run_once: true
      delegate_to: localhost
      changed_when: false
      register: _deploy_include_vars_load_common
    - name: 'Precheck deploy 1: HARD FAIL assertion include_vars /etc/agra/passwords.yml (AC-1)'
      ansible.builtin.assert:
        that:
          - grafana_admin_password is defined
          - grafana_secret_key is defined
          - grafana_admin_password | string | length > 0
        fail_msg: |
          **********************************************************************
          *   DEPLOY BLOKIR /etc/agra/passwords.yml TIDAK BERHASIL di-load    *
          **********************************************************************
          3 penyebab umum:
          1. File /etc/agra/passwords.yml TIDAK ADA
          2. chmod file BUKAN 0600 (harus root:root 0600)
          3. YAML syntax ERROR di dalam file

          Solusi 6 langkah perbaikan:
          1. sudo ls -la /etc/agra/passwords.yml
          2. sudo chown root:root /etc/agra/passwords.yml
          3. sudo chmod 0600 /etc/agra/passwords.yml
          4. agra genpwd
          5. agra precheck pass
          6. agra deploy
        success_msg: "✅ include_vars passwords.yml BERHASIL grafana_admin_password len={{ grafana_admin_password | string | length }} chars."
      run_once: true
      delegate_to: localhost
      become: true
      become_user: root
      tags: ['deploy', 'config', 'precheck', 'passwords']
  roles:
    - role: common

