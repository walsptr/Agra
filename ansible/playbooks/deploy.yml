          └─────────────────────────────────────────────────────────────────────────┘
        success_msg: '✅ DUAL MODE load SUCCESS (mode A include_vars atau mode B slurp!). grafana_admin_password: len={{ grafana_admin_password | string | length }} chars, BUKAN default admin (policy AC-1 FAIL-FAST TERPENUHI).'
