---
- name: 'AGRA DEPLOY STEP 1 — Apply common role ke ALL hosts'
  hosts: all
  gather_facts: true
  become: true
  tags: ['deploy', 'common', 'config']
  pre_tasks:
    - name: 'Load globals.yml + passwords.yml (become root — handle 0600 passwords.yml RULES §7)'
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "/etc/agra/globals.yml"
        - "/etc/agra/passwords.yml"
      become: true
      become_user: root
      run_once: true
      delegate_to: localhost
      changed_when: false
      failed_when: false
  roles:
    - role: common

- name: 'AGRA DEPLOY STEP 2 — Apply node_exporter ke group node_exporter'
  hosts: node_exporter
  gather_facts: true
  become: true
  tags: ['deploy', 'node_exporter', 'config']
  pre_tasks:
    - name: 'Load globals.yml + passwords.yml (become root — handle 0600 passwords.yml RULES §7)'
