- name: 'AGRA DEPLOY STEP 5 — Apply nginx ke group monitoring (jika enable_nginx=true)'
  hosts: monitoring
  gather_facts: true
  become: true
  tags: ['deploy', 'nginx', 'config']
  pre_tasks:
    - name: 'Load globals.yml + passwords.yml (become root — handle 0600 passwords.yml RULES §7)'
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "/etc/agra/globals.yml"
        - "/etc/agra/passwords.yml"
      become: true
      become_user: root
      run_once: true
      delegate_to: localhost
      changed_when: false
      failed_when: false
  tasks:
    - name: 'Deploy — Apply role nginx jika enable_nginx=true'
      ansible.builtin.include_role:
        name: nginx
      when:
        - enable_nginx | default(true) | bool

- name: 'AGRA DEPLOY STEP 6 — Apply keepalived KE SELURUH group monitoring HANYA JIKA groups monitoring > 1'
  hosts: monitoring
  gather_facts: true
  become: true
  tags: ['deploy', 'keepalived', 'ha', 'config']
  pre_tasks:
    - name: 'Load globals.yml + passwords.yml (become root — handle 0600 passwords.yml RULES §7)'
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "/etc/agra/globals.yml"
        - "/etc/agra/passwords.yml"
      become: true
      become_user: root
      run_once: true
      delegate_to: localhost
      changed_when: false
      failed_when: false
  tasks:
    - name: 'Deploy — Apply role keepalived HANYA JIKA groups monitoring length > 1'
      ansible.builtin.include_role:
        name: keepalived
      when:
        - groups['monitoring'] is defined
        - groups['monitoring'] | length > 1

- name: 'AGRA DEPLOY SUMMARY'
  hosts: localhost
  gather_facts: false
  connection: local
  tags: ['deploy']
  pre_tasks:
    - name: 'Load globals.yml + passwords.yml (become root — handle 0600 passwords.yml RULES §7)'
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "/etc/agra/globals.yml"
        - "/etc/agra/passwords.yml"
      become: true
      become_user: root
      run_once: true
      delegate_to: localhost
      changed_when: false
      failed_when: false
  vars:
    access_url: >-
      {% if (groups['monitoring'] | length > 1) and (hostvars[groups['monitoring'][0]]['monitoring_vip'] | default('') | length > 0) %}https://{{ hostvars[groups['monitoring'][0]]['monitoring_vip'] }}/
      {%- elif _enable_https %}https://{{ hostvars[groups['monitoring'][0]]['ansible_host'] | default(groups['monitoring'][0]) }}/
      {%- else %}http://{{ hostvars[groups['monitoring'][0]]['ansible_host'] | default(groups['monitoring'][0]) }}/
      {%- endif %}
  tasks:
    - name: 'Deploy — Summary access URL'
      ansible.builtin.debug:
        msg:
          - "✅ AGRA DEPLOY SELESAI"
          - "Grafana URL: {{ access_url | trim }}"
          - "Default user: {{ grafana_admin_user | default('admin') }} — password: lihat /etc/agra/passwords.yml field grafana_admin_password (default fallback: admin jika belum run genpwd)"
          - "Prometheus: {% if _expose_prometheus_via_nginx %}{{ access_url | trim }}prometheus/{% else %}http://127.0.0.1:9090 (HANYA internal node, tidak expose via nginx){% endif %}"
      vars:
        _enable_https: "{{ lookup('vars', 'enable_https', default=true) | bool }}"
        _expose_prometheus_via_nginx: "{{ lookup('vars', 'expose_prometheus_via_nginx', default=false) | bool }}"
