---
# agra upgrade / agra rollback — rolling apply (DESIGN.md §7). Rollback memakai
# playbook ini via rollback.yml (agra_lifecycle_action: rollback) dengan tag
# versi lama yang di-pass CLI. CLI menjalankan precheck dan backup SEBELUM
# playbook ini; upgrade tidak pernah dijalankan tanpa backup.
#
# Urutan: node_exporter-only hosts → standby monitoring → master
# (groups['monitoring'][0]) terakhir. serial: 1 + max_fail_percentage: 0 +
# health gate per host: satu host gagal/tidak sehat = upgrade berhenti.

- name: 'AGRA ROLLING — Phase 0 (node_exporter-only hosts, di luar [monitoring])'
  hosts: "{{ groups['node_exporter'] | default([]) | difference(groups['monitoring'] | default([])) }}"
  gather_facts: true
  become: true
  serial: 1
  max_fail_percentage: 0
  tags: ['upgrade', 'rollback']
  vars_files:
    - vars/lifecycle.yml
  roles:
    - role: common
    - role: node_exporter
  post_tasks:
    - name: Health gate
      ansible.builtin.import_tasks: tasks/health_gate.yml

- name: 'AGRA ROLLING — Phase 1 (STANDBY nodes, groups monitoring[1:])'
  hosts: "{{ groups['monitoring'][1:] | default([]) }}"
  gather_facts: true
  become: true
  serial: 1
  max_fail_percentage: 0
  tags: ['upgrade', 'rollback']
  vars_files:
    - vars/lifecycle.yml
  roles: &monitoring_roles
    - role: common
    - role: node_exporter
      when: inventory_hostname in groups['node_exporter'] | default([])
    - role: prometheus
      when: inventory_hostname in groups['prometheus'] | default([])
    - role: grafana
      when: inventory_hostname in groups['grafana'] | default([])
    - role: nginx
      when: enable_nginx | default(true) | bool
    - role: keepalived
      when: groups['monitoring'] | default([]) | length > 1
  post_tasks:
    - name: Health gate
      ansible.builtin.import_tasks: tasks/health_gate.yml

- name: 'AGRA ROLLING — Phase 2 (MASTER terakhir, groups monitoring[0])'
  hosts: "{{ (groups['monitoring'] | default([]))[:1] }}"
  gather_facts: true
  become: true
  serial: 1
  max_fail_percentage: 0
  tags: ['upgrade', 'rollback']
  vars_files:
    - vars/lifecycle.yml
  roles: *monitoring_roles
  post_tasks:
    - name: Health gate
      ansible.builtin.import_tasks: tasks/health_gate.yml

- name: 'AGRA ROLLING — Catat versi + summary'
  hosts: localhost
  gather_facts: false
  connection: local
  become: false
  tags: ['upgrade', 'rollback']
  vars_files:
    - vars/lifecycle.yml
  vars:
    agra_record_action: "{{ agra_lifecycle_action | default('upgrade') }}"
  tasks:
    - name: Record installed versions
      ansible.builtin.import_tasks: tasks/record_installed_versions.yml

    - name: 'Upgrade — Selesai'
      ansible.builtin.debug:
        msg:
          - "✅ AGRA ROLLING {{ agra_record_action | upper }} SELESAI"
          - "Urutan: node_exporter-only → standby {{ groups['monitoring'][1:] | default([]) }} → master {{ (groups['monitoring'] | default([]))[:1] }}"
          - "Rollback ke versi sebelumnya: agra rollback -i <inventory>"
