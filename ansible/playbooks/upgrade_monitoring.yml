---
- name: 'AGRA UPGRADE — Phase 1 (STANDBY NODES first, idx 1++)'
  hosts: "{{ groups['monitoring'][1:] | default([]) }}"
  gather_facts: true
  become: true
  serial: 1
  max_fail_percentage: 0
  tags: ['upgrade']
  pre_tasks:
    - name: 'Load globals.yml + passwords.yml (become root — handle 0600 passwords.yml RULES §7)'
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "/etc/agra/globals.yml"
        - "/etc/agra/passwords.yml"
      become: true
      become_user: root
      run_once: true
      delegate_to: localhost
      changed_when: false
      failed_when: false
  roles:
    - role: common
    - role: node_exporter
      when: inventory_hostname in groups['node_exporter'] | default([])
    - role: prometheus
      when: inventory_hostname in groups['prometheus'] | default([])
    - role: grafana
      when: inventory_hostname in groups['grafana'] | default([])
    - role: nginx
      when: enable_nginx | default(true) | bool
    - role: keepalived
      when:
        - groups['monitoring'] is defined
        - groups['monitoring'] | length > 1

- name: 'AGRA UPGRADE — Phase 2 (MASTER NODE LAST, idx 0 = groups monitoring[0])'
  hosts: "{{ [(groups['monitoring'] | default([]))[0]] | default([]) if (groups['monitoring'] is defined and groups['monitoring'] | length > 0) else [] }}"
  gather_facts: true
  become: true
  serial: 1
  max_fail_percentage: 0
  tags: ['upgrade']
  pre_tasks:
    - name: 'Load globals.yml + passwords.yml (become root — handle 0600 passwords.yml RULES §7)'
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "/etc/agra/globals.yml"
        - "/etc/agra/passwords.yml"
      become: true
      become_user: root
      run_once: true
      delegate_to: localhost
      changed_when: false
      failed_when: false
  roles:
    - role: common
    - role: node_exporter
      when: inventory_hostname in groups['node_exporter'] | default([])
    - role: prometheus
      when: inventory_hostname in groups['prometheus'] | default([])
    - role: grafana
      when: inventory_hostname in groups['grafana'] | default([])
    - role: nginx
      when: enable_nginx | default(true) | bool
    - role: keepalived
      when:
        - groups['monitoring'] is defined
        - groups['monitoring'] | length > 1

- name: 'AGRA UPGRADE SUMMARY'
  hosts: localhost
  gather_facts: false
  connection: local
  tags: ['upgrade']
  pre_tasks:
    - name: 'Load globals.yml + passwords.yml (become root — handle 0600 passwords.yml RULES §7)'
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "/etc/agra/globals.yml"
        - "/etc/agra/passwords.yml"
      become: true
      become_user: root
      run_once: true
      delegate_to: localhost
      changed_when: false
      failed_when: false

    - name: 'Upgrade — Compute rollback order (DESIGN §7 standby first = groups[1:] + groups[0] last)'
      ansible.builtin.set_fact:
        monitoring_upgrade_order: "{{ (groups['monitoring'][1:] | default([])) + ([groups['monitoring'][0]] | default([])) }}"
      run_once: true
      delegate_to: localhost
  tasks:
    - name: 'Upgrade — Selesai'
      ansible.builtin.debug:
        msg:
          - "✅ AGRA ROLLING UPGRADE SELESAI (serial 1, standby first → master last — DESIGN §7)"
          - "Urutan aktual — standby={{ groups['monitoring'][1:] | default([]) }} → master=[{{ (groups['monitoring'][0] | default('N/A')) if groups['monitoring'] is defined else 'N/A' }}]"
