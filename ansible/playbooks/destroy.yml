---
- name: 'AGRA — Destroy Monitoring Services (DEFAULT TIDAK PURGE APAPUN; opt-in purge via destroy_purge_data=true / destroy_purge_config=true)'
  hosts: monitoring
  gather_facts: true
  become: true
  tags: ['destroy']

  vars:
    destroy_confirm: "{{ destroy_confirm | default(false) }}"
    destroy_purge_data: "{{ destroy_purge_data | default(false) }}"
    destroy_purge_config: "{{ destroy_purge_config | default(false) }}"

  pre_tasks:
    - name: 'Load globals.yml + passwords.yml (become root — handle 0600 passwords.yml RULES §7)'
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "/etc/agra/globals.yml"
        - "/etc/agra/passwords.yml"
      become: true
      become_user: root
      run_once: true
      delegate_to: localhost
      changed_when: false
      failed_when: false

    - name: 'Destroy (SAFETY LAYER 2) — ASSERT destroy_confirm=true'
      ansible.builtin.assert:
        that:
          - destroy_confirm | bool
        fail_msg: >-
          ❌ DESTROY DIBLOKIR (RULES §8): destroy_confirm=false.
          Operasi destroy BERSIFAT DESTRUKTIF (menghapus container/service monitoring).
          Untuk benar-benar menjalankan: gunakan CLI `agra destroy --yes-i-really-mean-it`
          (flag ini akan set destroy_confirm=true ke playbook ini).

    - name: 'Destroy — Info run; destroy_purge_data + destroy_purge_config status'
      ansible.builtin.debug:
        msg:
          - "⚠️ MENJALANKAN DESTROY: destroy_purge_data={{ destroy_purge_data }}, destroy_purge_config={{ destroy_purge_config }}"
          - "  purge_data=true     : data_dir service (grafana.db, prometheus tsdb, node_exporter textfile_dir) AKAN DIHAPUS (TIDAK bisa recovery)"
          - "  purge_data=false    : data_dir DITAHAN (aman redeploy nanti tanpa kehilangan data)"
          - "  purge_config=true   : config workdirs (/etc/grafana, /etc/prometheus, /etc/node_exporter, /etc/agra) AKAN DIHAPUS (TIDAK bisa recovery)"
          - "  purge_config=false  : config /etc/<service> DITAHAN (aman redeploy nanti tanpa reconfig)"
          - "  KEDUA PURGE FALSE   : HANYA hapus container/systemd unit. FULL state ditahan (mode upgrade re-install tanpa kehilangan apapun)."
      run_once: true

  tasks:
    - name: 'Destroy — Remove all agra containers'
      block:
        - name: 'Destroy — Remove grafana container'
          ansible.builtin.shell:
            cmd: RUNTIME=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker); $RUNTIME rm -f {{ grafana_container_name | default('agra-grafana') }} || true
          changed_when: true
          ignore_errors: true

        - name: 'Destroy — Remove prometheus container'
          ansible.builtin.shell:
            cmd: RUNTIME=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker); $RUNTIME rm -f {{ prometheus_container_name | default('agra-prometheus') }} || true
          changed_when: true
          ignore_errors: true

        - name: 'Destroy — Remove node_exporter container'
          ansible.builtin.shell:
            cmd: RUNTIME=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker); $RUNTIME rm -f {{ node_exporter_container_name | default('agra-node-exporter') }} || true
          changed_when: true
          ignore_errors: true

        - name: 'Destroy — Remove nginx container'
          ansible.builtin.shell:
            cmd: RUNTIME=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker); $RUNTIME rm -f {{ nginx_container_name | default('agra-nginx') }} || true
          changed_when: true
          ignore_errors: true

        - name: 'Destroy — Remove keepalived container'
          ansible.builtin.shell:
            cmd: RUNTIME=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker); $RUNTIME rm -f {{ keepalived_container_name | default('agra-keepalived') }} || true
          changed_when: true
          ignore_errors: true

    - name: 'Destroy (PURGE TIPE 1 DATA) — Delete service data directories JIKA destroy_purge_data=true'
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ grafana_data_dir | default('/var/lib/agra/grafana') }}"
        - "{{ prometheus_data_dir | default('/var/lib/agra/prometheus') }}"
        - "{{ node_exporter_textfile_dir | default('') }}"
      when:
        - destroy_purge_data | bool
        - item | length > 0

    - name: 'Destroy (PURGE TIPE 2 CONFIG) — Delete service config workdirs JIKA destroy_purge_config=true'
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop:
        - { path: "{{ grafana_config_dir | default('/etc/grafana') }}", desc: "grafana config (/etc/grafana: grafana.ini + provisioning)" }
        - { path: "{{ prometheus_config_dir | default('/etc/prometheus') }}", desc: "prometheus config (/etc/prometheus: prometheus.yml + file_sd + rules)" }
        - { path: "{{ node_exporter_config_dir | default('/etc/node_exporter') }}", desc: "node_exporter config (/etc/node_exporter: node_exporter.default)" }
        - { path: "{{ nginx_config_dir | default('/etc/nginx') }}", desc: "nginx config (/etc/nginx: sites-available conf.d ssl self-signed certs agra)" }
        - { path: "{{ keepalived_config_dir | default('/etc/keepalived') }}", desc: "keepalived config (/etc/keepalived: keepalived.conf + vrrp_script healthcheck)" }
        - { path: "{{ common_etc_dir | default('/etc/agra') }}", desc: "agra common config dir (/etc/agra)" }
      when:
        - destroy_purge_config | bool
      register: purge_config_result
      loop_control:
        label: "{{ item.desc }} → path={{ item.path }}"

    - name: 'Destroy (Backward compat) — Pre-check: getent user agra (safety conditional)'
      ansible.builtin.command:
        cmd: getent passwd agra
      register: _check_agra_user
      changed_when: false
      failed_when: false

    - name: 'Destroy (Backward compat) — Pre-check: getent group agra (safety conditional)'
      ansible.builtin.command:
        cmd: getent group agra
      register: _check_agra_group
      changed_when: false
      failed_when: false

    - name: 'Destroy (Backward compat OQ-2) — Task A: Hapus user account agra (remove=no agar /var/lib/agra TIDAK kehapus)'
      ansible.builtin.user:
        name: agra
        state: absent
        remove: false
        force: true
      when:
        - _check_agra_user.rc == 0

    - name: 'Destroy (Backward compat OQ-2) — Task B: Hapus group agra'
      ansible.builtin.group:
        name: agra
        state: absent
      when:
        - _check_agra_group.rc == 0

    - name: 'Destroy — Info after run'
      ansible.builtin.debug:
        msg:
          - "✅ AGRA DESTROY COMPLETE"
          - "Purge data    (database/tsdb/textfile): {{ destroy_purge_data | default(false) }}"
          - "Purge config  (/etc/<service> lengkap): {{ destroy_purge_config | default(false) }}"
          - "  Config purged list (jika purge_config=true): grafana, prometheus, node_exporter, nginx (/etc/nginx), keepalived (/etc/keepalived), common agra (/etc/agra)"
          - "Keepalived VIP sudah tidak dipasang; paket OS (nginx/keepalived/prometheus apt/dnf) TIDAK di-uninstall — hanya config dirs + data dirs yang dihapus."
