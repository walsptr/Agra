---
# 1. Global
agra_deployment_mode: docker

# 2. Grafana
enable_grafana: true
enable_ha_grafana: false
grafana_database: sqlite
grafana_sqlite_sync_method: rsync
# Interval sync Grafana SQLite HA (jika enable_ha_grafana=true & grafana_database=sqlite).
# WAJIB BERUPA STRING cron expression 5 kolom standard: <minute> <hour> <day> <month> <weekday>
# Contoh valid:
#   "*/1 * * * *" = setiap 1 menit
#   "*/5 * * * *" = setiap 5 menit (default role)
#   "0 */6 * * *" = tiap 6 jam sekali (minute 0, hour tiap kelipatan 6)
# ⚠️ JANGAN diisi INTEGER (mis. 60) → tidak bisa di-split, ERROR cron task.
grafana_sqlite_sync_interval: "*/1 * * * *"
grafana_database_host: ""
grafana_database_port: 3306
grafana_database_name: grafana
grafana_database_user: grafana
grafana_database_ssl_mode: disable
grafana_image: grafana/grafana
grafana_tag: "11.2.0"
grafana_native_version: "11.2.0"
grafana_data_dir: /var/lib/agra/grafana
grafana_database_password: ""
grafana_admin_password: "admin"
grafana_secret_key: "CHANGE_ME_GRAFANA_SECRET_KEY_MIN_32_CHARS"

# 3. Prometheus
enable_prometheus: true
prometheus_retention_time: 15d
prometheus_retention_size: ""
prometheus_scrape_interval: 15s
prometheus_evaluation_interval: 15s
prometheus_data_dir: /var/lib/agra/prometheus
prometheus_image: prom/prometheus
prometheus_tag: v2.53.0
prometheus_native_version: "2.53.0"
expose_prometheus_via_nginx: false
# Domain khusus untuk expose Prometheus via HTTPS dedicated server block Nginx (SCALABLE: bisa pakai SSL cert sendiri per domain).
# JIKA diisi (mis. "prometheus.example.com"):
#   - expose_prometheus_via_nginx OTOMATIS dianggap true
#   - Akan dibuat HTTPS server block tersendiri dengan server_name={{ prometheus_domain }}
#   - proxy_pass ke upstream http://127.0.0.1:9090 (tanpa subpath /prometheus)
#   - SSL cert untuk block ini bisa di-custom via `tls_prometheus_cert_path` / `tls_prometheus_key_path` (fallback ke global tls_cert_path / tls_key_path)
# JIKA dikosongkan (default ""): Prometheus expose via path /prometheus subpath default server block (atur expose_prometheus_via_nginx=true jika ingin)
prometheus_domain: ""

# 4. Node Exporter
enable_node_exporter: true
node_exporter_port: 9100
node_exporter_image: prom/node-exporter
node_exporter_tag: v1.8.2
node_exporter_native_version: "1.8.2"
node_exporter_collectors_enabled: []
node_exporter_collectors_disabled: []
node_exporter_textfile_dir: ""

# 5. Monitoring VIP/Keepalived
monitoring_vip: ""
monitoring_vip_interface: eth0
keepalived_router_id: 51
keepalived_check_interval: 2
keepalived_fall_count: 3
keepalived_rise_count: 2
keepalived_auth_pass: ""

# 6. Nginx/TLS
enable_nginx: true
enable_https: true
tls_cert_path: /etc/agra/ssl/agra.crt
tls_key_path: /etc/agra/ssl/agra.key
tls_ca_path: /etc/agra/ssl/agra-ca.crt
tls_self_signed_days_valid: 3650
tls_self_signed_cn: "{{ monitoring_vip | default('localhost') }}"
# ── Dedicated SSL paths PER SERVICE (scalable untuk multi-domain berbeda cert) ──
# Jika dikosongkan ("") → FALLBACK otomatis ke global tls_cert_path / tls_key_path (backward compat).
# Path source ini DIBACA dari CONTROL NODE saat deploy (biasanya /etc/agra/ssl/),
# lalu di-copy otomatis ke managed node /etc/nginx/ssl/<service>.{crt,key} oleh role nginx config task block custom copy.

# Dedicated cert untuk Grafana default HTTPS server block (server_name = grafana_domain / monitoring_vip):
tls_grafana_cert_path: ""
tls_grafana_key_path: ""

# Dedicated cert untuk Prometheus dedicated HTTPS server block (jika prometheus_domain diisi):
# Contoh custom: /etc/letsencrypt/live/prometheus.example.com/fullchain.pem
tls_prometheus_cert_path: ""
tls_prometheus_key_path: ""

# ── Advanced: Nginx worker ownership override (HANYA JIKA custom image/UID host BEDA default) ──
# Default otomatis compute tergantung deployment_mode:
#   docker: uid=101, gid=101 (official nginx alpine image user nginx)
#   native: uid=33,  gid=33  (Ubuntu/Debian www-data user system package)
# Uncomment DAN ISI HANYA JIKA Anda pakai custom nginx image dengan UID/GID BEDA
# nginx_uid: 101
# nginx_gid: 101
# nginx_dir_mode: "0755"

# 7. Backup & Restore
backup_destination_type: local
backup_destination_path: /var/backups/agra
backup_retention_days: 14
backup_include_prometheus_tsdb: false
backup_s3_enabled: false
backup_s3_bucket: ""
backup_s3_endpoint: ""
backup_s3_region: ""
backup_s3_access_key: ""
backup_s3_secret_key: ""
enable_scheduled_backup: false
backup_schedule_cron: "0 2 * * *"
