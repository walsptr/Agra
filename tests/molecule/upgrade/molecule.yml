---
# Lifecycle on one node: deploy → upgrade → rollback. Run from tests/:
#   cd tests && molecule test -s upgrade
#
# Each side_effect advances the phase recorded in $MOLECULE_EPHEMERAL_DIRECTORY/phase
# (deploy → upgrade → rollback); agra-vars.yml derives versions from it.
#
# Same flow as the CLI: prepare = `agra check` (precheck.yml), converge =
# `agra deploy` (deploy.yml), with vars injected as extra-vars exactly like
# agra/utils/run_playbook.py — the repo's globals.yml template first, then the
# scenario file (overrides + the secrets `agra genpwd` would generate).
# The inventory carries topology and connection vars only (RULES.md §14).
driver:
  name: docker

platforms:
  - name: agra-mon1
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    volumes:
      # Nested Docker cannot run overlayfs on top of the container overlay.
      - /var/lib/docker
      - /var/lib/containerd
    cgroupns_mode: private  # own cgroup tree for nested Docker (cgroup v2)

provisioner:
  name: ansible
  playbooks:
    prepare: ../shared/prepare.yml
    converge: ../shared/converge.yml
    side_effect: side_effect.yml
    verify: verify.yml
  # Two distinct keys because molecule turns this dict into flags and cannot
  # repeat one; both become ansible-playbook extra-vars, in this order.
  options:
    e: "@${MOLECULE_SCENARIO_DIRECTORY}/../../../etc/agra/globals.yml"
    extra-vars: "@${MOLECULE_SCENARIO_DIRECTORY}/agra-vars.yml"
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_SCENARIO_DIRECTORY}/../../../ansible/roles"
  inventory:
    hosts:
      all:
        vars:
          ansible_python_interpreter: /usr/bin/python3
        children:
          monitoring:
            hosts:
              agra-mon1:
          grafana:
            children:
              monitoring:
          prometheus:
            children:
              monitoring:
          node_exporter:
            hosts:
              agra-mon1:

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - side_effect  # upgrade
    - verify
    - side_effect  # rollback
    - verify
    - destroy
