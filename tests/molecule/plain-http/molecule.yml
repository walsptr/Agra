---
# Feature flags off the defaults. Run from tests/:
#   cd tests && molecule test -s plain-http
#
# enable_https: false, prometheus_domain, Grafana on an external MySQL and
# backups uploaded to S3. agra-db1 stands in for the operator's existing
# servers: MySQL and an S3 endpoint (s3mock) run there as fixtures
# (prepare.yml) — agra only connects to them (RULES §9). It is also a plain
# node_exporter target, scraped across the network.
# Same CLI flow as `default`: prepare = `agra check`, converge = `agra deploy`,
# side_effect = `agra backup create`. Vars are injected like the CLI does.
driver:
  name: docker

platforms:
  - &node
    name: agra-mon1
    image: geerlingguy/docker-ubuntu2204-ansible@sha256:66cb5cb99bd08c40ec7c8d2b1c31efc3359a3e950c05427d1d4bed7b2f33781f
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    volumes:
      # Nested Docker cannot run overlayfs on top of the container overlay.
      - /var/lib/docker
      - /var/lib/containerd
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    # host on GitHub's Docker, private on rootless podman (see default).
    cgroupns_mode: ${MOLECULE_CGROUPNS:-host}
    docker_networks:
      - name: agra-plain-net
        ipam_config:
          - subnet: 172.29.0.0/24
            gateway: 172.29.0.1
    networks:
      - name: agra-plain-net
        ipv4_address: 172.29.0.11
  - <<: *node
    name: agra-db1
    networks:
      - name: agra-plain-net
        ipv4_address: 172.29.0.21

provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: ../shared/converge.yml
    side_effect: side_effect.yml
    verify: verify.yml
  # Two distinct keys because molecule turns this dict into flags and cannot
  # repeat one; both become ansible-playbook extra-vars, in this order.
  options:
    e: "@${MOLECULE_SCENARIO_DIRECTORY}/../../../etc/agra/globals.yml"
    extra-vars: "@${MOLECULE_SCENARIO_DIRECTORY}/agra-vars.yml"
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_SCENARIO_DIRECTORY}/../../../ansible/roles"
  inventory:
    # ansible_host is the address other nodes and Prometheus use;
    # ansible_docker_host keeps the docker connection on the container name.
    hosts:
      all:
        vars:
          ansible_python_interpreter: /usr/bin/python3
        hosts:
          agra-mon1:
            ansible_host: 172.29.0.11
            ansible_docker_host: agra-mon1
          agra-db1:
            ansible_host: 172.29.0.21
            ansible_docker_host: agra-db1
        children:
          monitoring:
            hosts:
              agra-mon1:
          grafana:
            children:
              monitoring:
          prometheus:
            children:
              monitoring:
          node_exporter:
            hosts:
              agra-mon1:
              agra-db1:

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - side_effect  # agra backup create
    - verify
    - destroy
