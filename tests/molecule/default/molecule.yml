---
driver:
  name: docker
  provider:
    name: docker

platforms:
  - name: agra-mon1
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    environment:
      container: docker

provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    hosts:
      all:
        hosts:
          agra-mon1:
            ansible_connection: docker
        children:
          monitoring:
            hosts:
              agra-mon1:
          node_exporter:
            hosts:
              agra-mon1:
    group_vars:
      all:
        ansible_python_interpreter: /usr/bin/python3
        agra_deployment_mode: docker
        enable_ha_grafana: false
        monitoring_vip: ""

verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
